reference_object_name: SSG
reference_object_class: semantic
semantic_class: semantic_structure_geometry
version: 1.0.0

purpose:
  short: >
    Defines the semantic manifold geometry, invariants, admissible envelopes, and
    routing constraints for the Semantic Structure Geometry (SSG) object in Path A.
  long: >
    SSG is the core semantic manifold reference object. It defines the geometry of
    semantic meaning, the axes of semantic variation, the invariants required for
    PSC replay, and the admissible semantic envelopes used by SOB, SROB, CnOB, IE,
    ISc, and IMR. SSG provides the foundational semantic coordinate system for all
    semantic operations in Path A.

invariants:
  - name: semantic_manifold_must_be_defined
    description: >
      The semantic manifold must be fully defined before any semantic boundary or
      correction primitive may operate.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate the envelope.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate the envelope.
  - name: manifold_axis_consistency
    description: >
      All semantic axes must remain consistent with the manifold definition; SSG may
      not distort semantic geometry.
  - name: replay_stability_required
    description: >
      SSG must produce identical semantic geometry under replay for identical inputs.
  - name: semantic_core_alignment
    description: >
      semantic_vector must remain aligned with semantic_core definitions.

geometry_signature:
  envelope_type: semantic_structure_envelope
  shape: semantic_manifold
  dimensions:
    - name: meaning_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: context_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: semantic_core_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    SSG geometry defines the semantic manifold used throughout Path A. It provides
    the axes of semantic variation (meaning, context, cue, semantic core) and the
    bounded manifold structure required for PSC replay and semantic stability.

scalar_fields:
  - name: meaning_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of meaning along the semantic manifold.
  - name: context_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of contextual meaning.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile within the semantic manifold.
  - name: semantic_core_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Strength of semantic core alignment.

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates (meaning, context, cue).
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - semantic_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SSG invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical semantic geometry.
  - name: inadmissible_source
    description: Envelope did not originate from a valid upstream semantic-adjacent object.

routing:
  admissible_inputs:
    - SmOB
  admissible_outputs:
    - SOB
    - SROB
    - CnOB
  description: >
    SSG defines the semantic manifold and routes semantic structure envelopes into
    semantic, routing, or correction-neutral boundaries depending on semantic stability
    and cue coherence.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - smob_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SSG must satisfy PSC semantic object requirements.
  - SSG must expose deterministic geometry for replay validation.
  - SSG must align with semantic, routing, and correction-neutral boundaries.
  - SSG must enforce admissible semantic manifold envelope constraints.
