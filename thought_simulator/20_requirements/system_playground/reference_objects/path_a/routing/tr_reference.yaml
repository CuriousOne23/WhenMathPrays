reference_object_name: TR
reference_object_class: routing
semantic_class: transition_routing
version: 1.0.0

purpose:
  short: >
    Defines the routing geometry, invariants, admissible envelopes, and routing
    constraints for the Transition Routing (TR) object in Path A.
  long: >
    TR is the routing-class reference object that determines routing transitions
    after semantic stabilization (SOB, SROB), correction flow (IE, CEx, CE, ISc),
    and identity reconciliation (IMR, RBU). TR evaluates routing stability,
    semantic alignment, cue coherence, and identity readiness to produce the
    transition envelope consumed by RTU, RB, and IdOB.

invariants:
  - name: envelope_must_be_closed
    description: >
      TR must operate only on closed envelopes produced by upstream routing or identity primitives.
  - name: routing_vector_required
    description: >
      routing_vector must be present and valid; missing vectors invalidate routing.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate routing.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate routing.
  - name: routing_stability_consistency
    description: >
      routing_stability must be consistent with upstream primitives; TR may not alter it.
  - name: semantic_routing_alignment
    description: >
      semantic_vector and routing_vector must remain aligned according to routing manifold rules.
  - name: identity_alignment_required
    description: >
      identity_vector must be present and aligned when routing into IdOB.
  - name: replay_stability_required
    description: >
      TR must produce identical routing geometry under replay for identical inputs.
  - name: admissible_source_only
    description: >
      TR may only accept envelopes produced by SROB, IMR, or RBU.

geometry_signature:
  envelope_type: routing_transition_envelope
  shape: routing_manifold
  dimensions:
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: identity_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: transition_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    TR geometry defines the routing transition manifold used by RTU, RB, and IdOB.
    It provides axes for routing stability, semantic stability, cue coherence,
    identity readiness, and transition magnitude.

scalar_fields:
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing meaning at the transition boundary.
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning at the transition boundary.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile at the transition boundary.
  - name: identity_readiness
    type: float
    bounds: [0.0, 1.0]
    description: >
      Readiness of identity manifold alignment for IdOB transition.
  - name: transition_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of routing transition applied by TR.

vector_fields:
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates at the transition boundary.
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates at the transition boundary.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates at the transition boundary.
  - name: identity_vector
    type: vector
    length: 3
    description: >
      Identity manifold coordinates used for IdOB transitions.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - routing_ready
    - identity_ready
    - transition_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy TR invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical routing transition geometry.
  - name: inadmissible_source
    description: Envelope did not originate from SROB, IMR, or RBU.

routing:
  admissible_inputs:
    - SROB
    - IMR
    - RBU
  admissible_outputs:
    - RTU
    - RB
    - IdOB
  description: >
    TR evaluates routing, semantic, cue, and identity alignment and routes the
    transition envelope into RTU, RB, or IdOB depending on transition magnitude
    and identity readiness.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - srob_reference
    - imr_reference
    - rbu_reference
    - identity_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_corrected_flow
    - path_a_identity_flow

psc_alignment:
  - TR must satisfy PSC routing object requirements.
  - TR must expose deterministic geometry for replay validation.
  - TR must align with RTU, RB, and IdOB primitives.
  - TR must enforce admissible routing transition envelope constraints.
