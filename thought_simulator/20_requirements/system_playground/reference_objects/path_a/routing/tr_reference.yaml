reference_object_name: TR
reference_object_class: routing
semantic_class: thought_router
version: 1.0.0

purpose:
  short: >
    Defines the deterministic routing‑vector computation geometry, invariants,
    admissible envelopes, and cue‑consumption rules for the Thought Router (TR).
  long: >
    TR computes the deterministic routing vector TP.TR for Path‑A by consuming OB
    structural residue, DCB curvature events, and trajectory‑adjacent signals.
    TR does not interpret meaning, modify TP, merge envelopes, evaluate semantics,
    or perform routing arbitration. TR produces stable, auditable routing metadata
    consumed by RB‑prm for basin selection.

invariants:
  - name: envelope_must_be_closed
    description: >
      TR must operate only on closed envelopes produced by OB/DCB primitives.
  - name: ob_residue_required
    description: >
      ob_residue_vector must be present and valid; missing residue invalidates routing.
  - name: dcb_curvature_required
    description: >
      dcb_curvature_vector must be present and valid; missing curvature invalidates routing.
  - name: trajectory_signal_required
    description: >
      trajectory_signal_vector must be present and valid.
  - name: deterministic_routing_required
    description: >
      Given identical OB/DCB inputs, TR must produce identical TP.TR under replay.
  - name: no_semantic_interpretation
    description: >
      TR must not interpret semantic meaning, stance, truth, or identity.
  - name: no_tp_write
    description: >
      TR must not write or modify TP; it only computes routing metadata.
  - name: path_a_only
    description: >
      TR must not be invoked by Path‑B; Path‑B is meaning‑read‑only.

geometry_signature:
  envelope_type: routing_vector_envelope
  shape: bounded_polytope
  dimensions:
    - name: ob_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: curvature_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: trajectory_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
  description: >
    TR geometry represents structural evidence magnitude, curvature influence,
    trajectory signal strength, and routing‑vector magnitude. No semantic, cue,
    or identity manifold axes appear here.

scalar_fields:
  - name: ob_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of OB structural evidence contributing to routing.
  - name: curvature_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of DCB curvature influence.
  - name: trajectory_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of trajectory‑adjacent signals.
  - name: routing_magnitude
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Magnitude of the computed routing vector TP.TR.

vector_fields:
  - name: ob_residue_vector
    type: vector
    length: 3
    description: >
      Structural residue coordinates from OB layers.
  - name: dcb_curvature_vector
    type: vector
    length: 3
    description: >
      Curvature event coordinates from DCB.
  - name: trajectory_signal_vector
    type: vector
    length: 3
    description: >
      Trajectory‑adjacent signal coordinates.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Deterministic routing vector TP.TR produced by TR.

envelope_status:
  admissible_status:
    - routing_ready
    - degraded
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy TR invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_ob_or_dcb
    description: Required OB/DCB vectors are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical routing vectors.

routing:
  admissible_inputs:
    - OB
    - DCB
  admissible_outputs:
    - RB
  description: >
    TR computes TP.TR and emits routing metadata consumed by RB‑prm for basin
    arbitration. TR does not route into semantic, identity, or correction primitives.

dependencies:
  dictionaries:
    - routing_dictionary
    - runtime_dictionary
  reference_objects:
    - ob_reference
    - dcb_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_routing_flow

psc_alignment:
  - TR must satisfy PSC routing object requirements.
  - TR must expose deterministic routing geometry for replay validation.
  - TR must align with RB‑prm and routing metadata rules.
  - TR must enforce admissible routing‑vector envelope constraints.
