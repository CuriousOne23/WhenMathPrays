reference_object_name: RTU
reference_object_class: routing
semantic_class: routing_tp_update_primitive
version: 1.0.0

purpose:
  short: >
    Defines deterministic TP‑write geometry, invariants, admissible envelopes, and
    commit‑constraints for the Routing TP Update Primitive (RTU‑prm) in Path A.
  long: >
    RTU‑prm commits RB‑prm’s routing metadata into the TP snapshot, including culture
    and subculture lanes, fallback lane, routing lineage, routing reasons, fan‑out
    decisions, and routing‑relevant structural fields. RTU‑prm validates the routing
    envelope, ensures RB‑prm remains pure and side‑effect‑free, and embeds routing
    state for TS/TR scheduling and staleness evaluation. RTU‑prm performs no routing
    computation, no semantic evaluation, no scoring, and no modification of OB outputs
    or semantic fields. It runs once per routing cycle and is never re‑invoked for the
    same RB output.

invariants:
  - name: envelope_must_be_closed
    description: >
      RTU‑prm must operate only on closed routing envelopes produced by RB‑prm.
  - name: admissible_source_required
    description: >
      RTU‑prm may only accept envelopes produced by RB‑prm; any other source is invalid.
  - name: deterministic_tp_write
    description: >
      Given identical RB‑prm outputs, RTU‑prm must produce identical TP(N+1) under replay.
  - name: no_routing_computation
    description: >
      RTU‑prm must not compute routing deltas, routing lanes, or routing transitions.
  - name: no_semantic_or_truth_write
    description: >
      RTU‑prm must not modify semantic fields, truth fields, merge results, or completion data.
  - name: single_commit_per_cycle
    description: >
      RTU‑prm must run exactly once per routing cycle and must never re‑commit the same RB output.
  - name: path_a_only
    description: >
      RTU‑prm must not be invoked by Path‑B; Path‑B is meaning‑read‑only.

geometry_signature:
  envelope_type: routing_commit_envelope
  shape: bounded_polytope
  dimensions:
    - name: lane_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: fallback_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: lineage_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: reason_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: fanout_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    RTU‑prm geometry represents routing lane selection, fallback lane magnitude,
    routing lineage stability, routing reason‑code magnitude, and fan‑out decision
    magnitude. No semantic, identity, or scoring axes appear here.

scalar_fields:
  - name: lane_selection_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of culture/subculture lane selection committed to TP.
  - name: fallback_lane_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of fallback lane selection.
  - name: routing_lineage_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of routing lineage metadata.
  - name: routing_reason_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of routing reason‑code metadata.
  - name: fanout_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of routing fan‑out decision.

vector_fields:
  - name: lane_vector
    type: vector
    length: 3
    description: >
      Culture/subculture lane coordinates committed to TP.
  - name: fallback_vector
    type: vector
    length: 3
    description: >
      Fallback lane coordinates committed to TP.
  - name: lineage_vector
    type: vector
    length: 3
    description: >
      Routing lineage coordinates committed to TP.
  - name: reason_vector
    type: vector
    length: 3
    description: >
      Routing reason‑code coordinates committed to TP.
  - name: fanout_vector
    type: vector
    length: 3
    description: >
      Fan‑out decision coordinates committed to TP.

envelope_status:
  admissible_status:
    - commit_ready
    - validated
  terminal_status:
    - invalid_geometry
    - inadmissible_source
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy RTU‑prm invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: inadmissible_source
    description: Envelope did not originate from RB‑prm.
  - name: replay_inconsistency
    description: Replay produced non‑identical routing commit geometry.

routing:
  admissible_inputs:
    - RB
  admissible_outputs:
    - TP
  description: >
    RTU‑prm validates RB‑prm’s routing envelope and commits routing metadata into TP(N),
    producing TP(N+1). Routing transitions occur only after commit via TS/TR scheduling.

dependencies:
  dictionaries:
    - routing_dictionary
    - runtime_dictionary
  reference_objects:
    - rb_reference
    - boundary_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_routing_flow
    - path_a_commit_flow

psc_alignment:
  - RTU‑prm must satisfy PSC routing‑commit object requirements.
  - RTU‑prm must expose deterministic commit geometry for replay validation.
  - RTU‑prm must align with RB‑prm, TS, and TR scheduling rules.
  - RTU‑prm must enforce admissible routing‑commit envelope constraints.
