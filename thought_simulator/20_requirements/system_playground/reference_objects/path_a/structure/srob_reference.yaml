reference_object_name: SROB
reference_object_class: structure
semantic_class: semantic_routing_object_boundary
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Semantic Routing Object Boundary (SROB) in Path A.
  long: >
    SROB stabilizes routing meaning after semantic boundary formation (SOB) and before
    routing primitives (RTU, RB) or identity primitives (IdOB) operate. It ensures
    deterministic replay, enforces routing manifold consistency, and provides the
    structural routing envelope used throughout Path A.

invariants:
  - name: envelope_must_be_closed
    description: >
      SROB must operate only on closed envelopes produced by upstream semantic or routing primitives.
  - name: routing_vector_required
    description: >
      routing_vector must be present and valid; missing vectors invalidate the envelope.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate the envelope.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate the envelope.
  - name: routing_stability_consistency
    description: >
      routing_stability must be consistent with upstream primitives; SROB may not alter it.
  - name: semantic_routing_alignment
    description: >
      semantic_vector and routing_vector must remain aligned according to routing manifold rules.
  - name: replay_stability_required
    description: >
      SROB must produce identical routing boundary geometry under replay for identical inputs.

geometry_signature:
  envelope_type: semantic_routing_boundary_envelope
  shape: bounded_polytope
  dimensions:
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: stability_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    SROB geometry is a bounded polytope representing routing stability, semantic stability,
    cue coherence, and boundary stability. This geometry determines whether routing meaning
    is ready for RTU, RB, or identity transitions.

scalar_fields:
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing meaning at the routing boundary.
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning at the routing boundary.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile at the routing boundary.
  - name: boundary_stability
    type: float
    bounds: [0.0, 1.0]
    description: >
      Stability of the routing boundary envelope.

vector_fields:
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates at the routing boundary.
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates at the routing boundary.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates at the routing boundary.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - routing_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SROB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical routing boundary geometry.
  - name: inadmissible_source
    description: Envelope did not originate from a valid upstream semantic or routing primitive.

routing:
  admissible_inputs:
    - SOB
    - IE
    - IMR
  admissible_outputs:
    - RTU
    - RB
    - IdOB
  description: >
    SROB stabilizes routing meaning and routes the semantic-routing boundary envelope
    into routing or identity primitives depending on routing stability and cue coherence.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - sob_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
    - identity_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SROB must satisfy PSC structure object requirements.
  - SROB must expose deterministic geometry for replay validation.
  - SROB must align with routing and identity primitives.
  - SROB must enforce admissible semantic-routing boundary envelope constraints.
