reference_object_name: CnOB
reference_object_class: structure
semantic_class: correction_neutral_object_boundary
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Correction-Neutral Object Boundary (CnOB) in Path A.
  long: >
    CnOB is the neutral structural boundary between semantic/routing stabilization
    and correction primitives. It ensures deterministic replay, enforces neutrality
    constraints, and provides the correction-neutral envelope consumed by IE, CEx,
    CE, and ISc. CnOB does not apply correction; it preserves semantic and routing
    meaning while preparing the envelope for correction flow.

invariants:
  - name: envelope_must_be_closed
    description: >
      CnOB must operate only on closed envelopes produced by upstream semantic or routing boundaries.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate the envelope.
  - name: routing_vector_required
    description: >
      routing_vector must be present and valid; missing vectors invalidate the envelope.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate the envelope.
  - name: correction_level_must_be_zero
    description: >
      correction_level must be zero; CnOB is strictly neutral and may not apply correction.
  - name: degradation_level_consistency
    description: >
      degradation_level must not increase relative to upstream boundaries.
  - name: semantic_routing_alignment
    description: >
      semantic_vector and routing_vector must remain aligned according to manifold rules.
  - name: replay_stability_required
    description: >
      CnOB must produce identical neutral boundary geometry under replay for identical inputs.

geometry_signature:
  envelope_type: correction_neutral_boundary_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: degradation_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: neutrality_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    CnOB geometry is a bounded polytope representing semantic stability, routing stability,
    cue coherence, degradation magnitude, and neutrality magnitude. This geometry determines
    whether the envelope is ready for correction primitives (IE, CEx, CE, ISc).

scalar_fields:
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning at the neutral boundary.
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing meaning at the neutral boundary.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile at the neutral boundary.
  - name: degradation_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of degradation detected; must not increase relative to upstream boundaries.
  - name: neutrality_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of neutrality; must be maximal before correction begins.

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates at the neutral boundary.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates at the neutral boundary.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates at the neutral boundary.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - neutral_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy CnOB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical neutral boundary geometry.
  - name: inadmissible_source
    description: Envelope did not originate from a valid upstream semantic or routing boundary.

routing:
  admissible_inputs:
    - SOB
    - SROB
    - IE
  admissible_outputs:
    - IE
    - ISc
    - CEx
    - CE
  description: >
    CnOB stabilizes semantic and routing meaning without applying correction and routes
    the neutral envelope into correction primitives depending on stability and cue coherence.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - sob_reference
    - srob_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - CnOB must satisfy PSC structure object requirements.
  - CnOB must expose deterministic geometry for replay validation.
  - CnOB must align with correction primitives (IE, CEx, CE, ISc).
  - CnOB must enforce admissible correction-neutral envelope constraints.
