reference_object_name: CnOB
reference_object_class: structure
semantic_class: correction_neutral_object_boundary
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and routing constraints
    for the Constraint‑Neutral Object Boundary (CnOB) in Path A.
  long: >
    CnOB extracts structural constraint‑level residue from refined structural envelopes
    (SROB) without performing semantic interpretation, plausibility, world‑knowledge
    inference, or repair. CnOB emits monotonic, provably‑entailed constraint cues
    (C1–C7 families), missing‑slot signals, underspecification markers, conflict
    indicators, and ΔH%‑derived constraint metadata. CnOB is strictly correction‑neutral
    and prepares constraint residue for SmOB and correction primitives.

invariants:
  - name: envelope_must_be_closed
    description: >
      CnOB must operate only on closed structural envelopes produced by SROB.
  - name: structural_vectors_required
    description: >
      structural_vector and anchor_vector must be present and valid; missing vectors invalidate the envelope.
  - name: no_semantic_interpretation
    description: >
      CnOB must not introduce or modify semantic fields; it operates purely on structural constraints.
  - name: monotonic_constraint_extraction
    description: >
      Extracted constraints must be monotonic and provably entailed by structural residue; no semantic plausibility allowed.
  - name: neutrality_required
    description: >
      CnOB must not apply correction; neutrality_level must remain maximal.
  - name: replay_stability_required
    description: >
      CnOB must produce identical constraint residue geometry under replay for identical inputs.

geometry_signature:
  envelope_type: constraint_neutral_boundary_envelope
  shape: bounded_polytope
  dimensions:
    - name: constraint_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: structural_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: underspec_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: conflict_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: neutrality_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    CnOB geometry represents constraint extraction magnitude, structural residue strength,
    underspecification level, conflict indicator magnitude, and neutrality magnitude.
    No semantic or routing manifold axes appear here.

scalar_fields:
  - name: constraint_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of extracted structural constraints (C1–C7 families).
  - name: underspec_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of structural underspecification detected.
  - name: conflict_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of structural conflict indicators.
  - name: neutrality_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Neutrality magnitude; must remain maximal before correction begins.
  - name: delta_h_percent
    type: float
    bounds: [0.0, 1.0]
    description: >
      ΔH%‑derived constraint metadata used for downstream routing and correction scoring.

vector_fields:
  - name: structural_vector
    type: vector
    length: 3
    description: >
      Structural manifold coordinates from SROB.
  - name: anchor_vector
    type: vector
    length: 3
    description: >
      Canonicalized structural anchor coordinates.
  - name: constraint_vector
    type: vector
    length: 3
    description: >
      Manifold coordinates representing extracted constraint residue (C1–C7).

envelope_status:
  admissible_status:
    - constraint_ready
    - degraded_structure
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy CnOB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_structural_vectors
    description: Required structural vectors are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical constraint residue geometry.

routing:
  admissible_inputs:
    - SROB
  admissible_outputs:
    - SmOB
    - IE
    - ISc
  description: >
    CnOB emits constraint‑level residue for SmOB and correction primitives. It does not
    route into semantic scoring, routing, or identity primitives.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - srob_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - CnOB must satisfy PSC structure object requirements.
  - CnOB must expose deterministic constraint residue geometry for replay validation.
  - CnOB must align with SROB, SmOB, and correction primitives.
  - CnOB must enforce admissible constraint‑neutral envelope constraints.
