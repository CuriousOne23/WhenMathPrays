reference_object_name: SmOB
reference_object_class: structure
semantic_class: semantic_adjacent_object
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Semantic-Adjacent Object (SmOB) in Path A.
  long: >
    SmOB is a pre-semantic structural object that carries semantic-adjacent cues,
    modality cues, affect markers, presemantic residue, and routing-adjacent signals.
    It is used upstream of semantic manifold formation and provides deterministic
    geometry, invariant sets, and field definitions required for PSC replay and
    semantic-adjacent processing.

invariants:
  - name: envelope_must_be_closed
    description: >
      SmOB must operate only on closed envelopes produced by upstream intake primitives.
  - name: semantic_adjacent_vector_required
    description: >
      semantic_adjacent_vector must be present and valid; missing vectors invalidate the envelope.
  - name: modality_vector_required
    description: >
      modality_vector must be present and valid; missing vectors invalidate the envelope.
  - name: affect_markers_required
    description: >
      affect_markers must be present and valid; missing markers invalidate the envelope.
  - name: presemantic_residue_consistency
    description: >
      presemantic_residue_hash must be consistent with upstream primitives; SmOB may not alter it.
  - name: replay_stability_required
    description: >
      SmOB must produce identical semantic-adjacent geometry under replay for identical inputs.
  - name: semantic_adjacent_manifold_consistency
    description: >
      SmOB must preserve semantic-adjacent manifold structure and may not distort adjacent axes.

geometry_signature:
  envelope_type: semantic_adjacent_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_adjacent_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: modality_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: affect_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: residue_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: routing_adjacent_axis
      type: scalar
      bounds: [-1.0, 1.0]
  description: >
    SmOB geometry is a bounded polytope representing semantic-adjacent stability,
    modality coherence, affect magnitude, presemantic residue magnitude, and routing-adjacent
    stability. This geometry determines whether semantic-adjacent meaning is ready for
    semantic manifold formation.

scalar_fields:
  - name: semantic_adjacent_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic-adjacent meaning at the adjacent boundary.
  - name: modality_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of modality cues at the adjacent boundary.
  - name: affect_magnitude
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Magnitude of affect markers at the adjacent boundary.
  - name: residue_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of presemantic residue.
  - name: routing_adjacent_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing-adjacent meaning.

vector_fields:
  - name: semantic_adjacent_vector
    type: vector
    length: 3
    description: >
      Semantic-adjacent manifold coordinates.
  - name: modality_vector
    type: vector
    length: 3
    description: >
      Modality manifold coordinates.
  - name: affect_markers
    type: vector
    length: 3
    description: >
      Affect marker coordinates.
  - name: routing_adjacent_vector
    type: vector
    length: 3
    description: >
      Routing-adjacent manifold coordinates.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - semantic_adjacent_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SmOB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical semantic-adjacent geometry.
  - name: inadmissible_source
    description: Envelope did not originate from a valid upstream intake primitive.

routing:
  admissible_inputs:
    - InB
    - IIInB
  admissible_outputs:
    - SOB
    - SROB
    - CnOB
  description: >
    SmOB stabilizes semantic-adjacent meaning and routes the adjacent envelope into
    semantic, routing, or correction-neutral boundaries depending on stability and cue coherence.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SmOB must satisfy PSC structure object requirements.
  - SmOB must expose deterministic geometry for replay validation.
  - SmOB must align with semantic, routing, and correction-neutral boundaries.
  - SmOB must enforce admissible semantic-adjacent envelope constraints.
