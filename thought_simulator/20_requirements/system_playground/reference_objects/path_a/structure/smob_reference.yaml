reference_object_name: SmOB
reference_object_class: structure
semantic_class: semantic_adjacent_object
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and routing constraints
    for the Semantic OB (SmOB) in Path A.
  long: >
    SmOB performs two jobs: (1) extract semantic-adjacent and pre-semantic cues from
    SOB→SROB→CnOB residue, including modality cues, affect markers, conflict-adjacent
    and underspecification-adjacent signals; and (2) compress all upstream residue plus
    SmOB cues into a deterministic pre-semantic hash and TR-input cue vector used by
    SSG and the Thought Router. SmOB performs no semantic interpretation, plausibility,
    stance assignment, or truth evaluation.

invariants:
  - name: envelope_must_be_closed
    description: >
      SmOB must operate only on closed envelopes produced by CnOB.
  - name: semantic_adjacent_vectors_required
    description: >
      semantic_adjacent_vector, modality_vector, and affect_vector must be present and valid.
  - name: upstream_residue_required
    description: >
      structural_vector, anchor_vector, and constraint_vector from CnOB must be present.
  - name: deterministic_hash_required
    description: >
      presemantic_hash must be deterministically derived from upstream residue + SmOB cues.
  - name: replay_stability_required
    description: >
      SmOB must produce identical semantic-adjacent geometry and identical presemantic_hash
      under replay for identical inputs.
  - name: no_semantic_interpretation
    description: >
      SmOB must not perform semantic interpretation, truth evaluation, stance assignment,
      or semantic normalization.

geometry_signature:
  envelope_type: semantic_adjacent_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_adjacent_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: modality_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: affect_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: residue_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: tr_input_axis
      type: scalar
      bounds: [-1.0, 1.0]
  description: >
    SmOB geometry represents semantic-adjacent cue strength, modality coherence,
    affect magnitude, pre-semantic residue magnitude, and TR-input cue stability.
    No semantic manifold axes appear here.

scalar_fields:
  - name: semantic_adjacent_strength
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Magnitude of semantic-adjacent cue activation.
  - name: modality_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of modality cues.
  - name: affect_magnitude
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Magnitude of affect markers.
  - name: residue_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of pre-semantic residue extracted from upstream OB layers.
  - name: tr_input_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of TR-input cue formation.

vector_fields:
  - name: semantic_adjacent_vector
    type: vector
    length: 3
    description: >
      Semantic-adjacent manifold coordinates.
  - name: modality_vector
    type: vector
    length: 3
    description: >
      Modality cue coordinates.
  - name: affect_vector
    type: vector
    length: 3
    description: >
      Affect marker coordinates.
  - name: upstream_residue_vector
    type: vector
    length: 3
    description: >
      Combined upstream residue (structural + constraint) coordinates.
  - name: tr_input_vector
    type: vector
    length: 3
    description: >
      Deterministic TR-input cue vector derived from upstream residue + SmOB cues.

hash_fields:
  - name: presemantic_hash
    type: hash
    description: >
      Deterministic hash of upstream residue + SmOB cues; used by SSG and TR.

envelope_status:
  admissible_status:
    - semantic_adjacent_ready
    - degraded
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SmOB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_upstream_residue
    description: Required upstream residue vectors are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical semantic-adjacent geometry or hash.

routing:
  admissible_inputs:
    - CnOB
  admissible_outputs:
    - SSG
    - TR
  description: >
    SmOB emits semantic-adjacent cues, presemantic_hash, and TR-input cue vectors
    consumed by SSG and the Thought Router. SmOB does not route backward into structural
    OB layers.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - cnob_reference
    - boundary_reference
    - structure_reference
    - routing_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SmOB must satisfy PSC structure object requirements.
  - SmOB must expose deterministic semantic-adjacent geometry and deterministic hash.
  - SmOB must align with CnOB, SSG, and TR.
  - SmOB must enforce admissible semantic-adjacent envelope constraints.
