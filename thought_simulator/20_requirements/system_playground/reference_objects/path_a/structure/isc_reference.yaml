reference_object_name: ISc
reference_object_class: structure
semantic_class: intake_score
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, scoring fields, and routing constraints
    for the Intake Score (ISc) reference object used in Path A.
  long: >
    ISc evaluates semantic stability, routing stability, cue coherence, degradation level,
    and correction level to determine whether Path A continues, loops, or transitions.
    It provides deterministic geometry, invariant sets, and field definitions required
    for PSC replay and routing decisions.

invariants:
  - name: envelope_must_be_closed
    description: >
      ISc must evaluate only closed envelopes produced by upstream primitives.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate scoring.
  - name: routing_vector_required
    description: >
      routing_vector must be present and valid; missing vectors invalidate scoring.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate scoring.
  - name: degradation_level_consistency
    description: >
      degradation_level must not increase relative to IE or IIInB.
  - name: correction_level_consistency
    description: >
      correction_level must be consistent with IE and CEx outputs.
  - name: replay_stability_required
    description: >
      ISc must produce identical scoring geometry under replay for identical inputs.

geometry_signature:
  envelope_type: intake_score_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: degradation_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: correction_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: score_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    ISc geometry is a bounded polytope representing semantic stability, routing stability,
    cue coherence, degradation magnitude, correction magnitude, and final intake score.
    This geometry determines routing transitions in Path A.

scalar_fields:
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning after correction.
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing signals after correction.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile after correction.
  - name: degradation_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of degradation detected; must not increase relative to IE.
  - name: correction_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of correction applied by IE/CEx.
  - name: intake_score
    type: float
    bounds: [0.0, 1.0]
    description: >
      Final score determining routing transitions (RTU, RB, IdOB).

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates used for scoring.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates used for scoring.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates used for scoring.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - correction_ready
    - score_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy ISc invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical scoring geometry.
  - name: inadmissible_source
    description: Envelope did not originate from IE or CEx.

routing:
  admissible_inputs:
    - IE
    - CEx
  admissible_outputs:
    - RTU
    - RB
    - IdOB
  description: >
    ISc determines whether Path A continues, loops, or transitions based on intake_score
    and envelope geometry.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - ie_reference
    - cex_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_corrected_flow
    - intake_correction_flow

psc_alignment:
  - ISc must satisfy PSC structure object requirements.
  - ISc must expose deterministic geometry for replay validation.
  - ISc must align with RTU, RB, and IdOB routing primitives.
  - ISc must enforce admissible scoring envelope constraints.
