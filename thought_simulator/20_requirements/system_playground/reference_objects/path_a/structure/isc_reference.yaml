reference_object_name: ISc
reference_object_class: structure
semantic_class: inference_score
version: 1.0.0

purpose:
  short: >
    Defines the structural scoring geometry, invariants, and admissible envelopes
    for the Inference Scorer (ISc) used in Path A.
  long: >
    ISc applies truth_hypotheses-prc over candidate_set{} using CE output to produce
    deterministic scoring fields (score_set, score_conflict, score_reason_code)
    consumed by TPU. ISc is strictly a local scoring mechanism: it does not perform
    semantic generation, meaning construction, truth evaluation, or global inference.
    It provides deterministic geometry and PSC-aligned structural fields required
    for TPU merge and downstream routing.

invariants:
  - name: closed_envelope_required
    description: >
      ISc may only evaluate closed envelopes produced by CE and candidate_set{}.
  - name: candidate_set_required
    description: >
      candidate_set{} must be present; missing or null candidate sets invalidate scoring.
  - name: ce_output_required
    description: >
      CE output must be present; missing CE fields invalidate scoring.
  - name: no_meaning_construction
    description: >
      ISc must not construct meaning, generate semantics, or evaluate truth globally.
  - name: no_global_state_access
    description: >
      ISc must not read global inference state; scoring must be local and deterministic.
  - name: replay_stability_required
    description: >
      ISc must produce identical scoring geometry under replay for identical inputs.

geometry_signature:
  envelope_type: inference_score_envelope
  shape: bounded_polytope
  dimensions:
    - name: score_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: conflict_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: reason_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    ISc geometry is a bounded polytope representing local scoring magnitude,
    conflict magnitude, and reason-code stability. These axes form the structural
    scoring envelope consumed by TPU.

scalar_fields:
  - name: score_set
    type: float
    bounds: [0.0, 1.0]
    description: >
      Deterministic score assigned to candidate_set{} under truth_hypotheses-prc.
  - name: score_conflict
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of conflict detected among candidate interpretations.
  - name: score_reason_code
    type: float
    bounds: [0.0, 1.0]
    description: >
      Encoded reason for scoring outcome; consumed by TPU for merge decisions.

vector_fields:
  - name: candidate_vector
    type: vector
    length: 3
    description: >
      Structural manifold coordinates representing candidate_set{} features.
  - name: ce_vector
    type: vector
    length: 3
    description: >
      Structural manifold coordinates derived from CE output used in scoring.

envelope_status:
  admissible_status:
    - score_ready
    - conflict_detected
  terminal_status:
    - invalid_geometry
    - missing_candidate_set
    - missing_ce_output
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy ISc invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical scoring geometry.
  - name: inadmissible_source
    description: Envelope did not originate from CE + candidate_set{}.

routing:
  admissible_inputs:
    - CE
    - candidate_set
  admissible_outputs:
    - TPU
  description: >
    ISc produces deterministic scoring fields consumed by TPU. ISc does not route
    directly to RTU, RB, or IdOB; routing decisions occur after TPU merge.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - ce_reference
    - candidate_reference
    - structure_reference
  flow_contracts:
    - path_a_inference_flow

psc_alignment:
  - ISc must satisfy PSC structural object requirements.
  - ISc must expose deterministic scoring geometry for replay validation.
  - ISc must align with TPU merge and downstream routing primitives.
  - ISc must enforce admissible scoring envelope constraints.
