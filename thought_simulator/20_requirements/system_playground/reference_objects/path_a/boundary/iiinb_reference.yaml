reference_object_name: IIInB
reference_object_class: boundary
semantic_class: intake_inference_boundary
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Intake Inference Boundary (IIInB) used in Corrected Path A.
  long: >
    IIInB is the boundary reference object that governs how degraded or ambiguous
    intake meaning is stabilized before entering correction primitives (IE, CEx, CE, TPU, IMR).
    It provides the geometric envelope, invariant set, and field definitions required
    for deterministic replay and PSC‑aligned routing.

invariants:
  - name: envelope_must_be_closed
    description: >
      The IIInB envelope must form a closed geometric boundary before any inference
      or correction primitives may operate.
  - name: no_unbounded_fields
    description: >
      All scalar and vector fields must be bounded by the IIInB geometry signature.
  - name: admissible_intake_only
    description: >
      IIInB may only accept intake‑class envelopes (InB‑derived or degraded InB envelopes).
  - name: replay_stability_required
    description: >
      IIInB must produce identical envelope geometry under replay for identical inputs.
  - name: correction_flag_consistency
    description: >
      If correction flags are present, they must match the envelope_status table.

geometry_signature:
  envelope_type: intake_inference_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: degradation_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    The IIInB geometry is a bounded polytope in four axes representing semantic stability,
    routing stability, cue coherence, and degradation magnitude. This geometry is used
    by IE and CEx to determine admissible correction paths.

scalar_fields:
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning entering correction.
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing signals entering correction.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile relative to intake meaning.
  - name: degradation_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of degradation detected at intake.

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates used by IE and CEx.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates used by IE and CEx.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - correction_required
  terminal_status:
    - invalid_geometry
    - unbounded_field
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy IIInB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non‑identical envelope geometry.
  - name: inadmissible_intake
    description: Envelope is not derived from InB or degraded InB.

routing:
  admissible_inputs:
    - InB
    - degraded_InB
  admissible_outputs:
    - IE
    - CEx
  description: >
    IIInB routes degraded or ambiguous intake envelopes into the correction pipeline.
    Stable envelopes bypass IIInB and proceed directly to SOB.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_corrected_flow
    - intake_correction_flow

psc_alignment:
  - IIInB must satisfy PSC boundary object requirements.
  - IIInB must expose deterministic geometry for replay validation.
  - IIInB must align with correction primitives IE, CEx, CE, TPU, IMR.
  - IIInB must enforce admissible intake envelope constraints.
