reference_object_name: CEx
reference_object_class: boundary
semantic_class: correction_expansion
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Correction Expansion (CEx) boundary object in Path A.
  long: >
    CEx expands the corrected intake envelope produced by IE. It increases correction
    magnitude, adjusts semantic and routing vectors, and prepares the envelope for
    evaluation by CE. CEx provides deterministic geometry, invariant sets, and field
    definitions required for PSC replay and correction routing.

invariants:
  - name: envelope_must_be_closed
    description: >
      CEx must produce a closed envelope geometry before CE may evaluate it.
  - name: semantic_vector_required
    description: >
      semantic_vector must be present and valid; missing vectors invalidate the envelope.
  - name: routing_vector_required
    description: >
      routing_vector must be present and valid; missing vectors invalidate the envelope.
  - name: cue_vector_required
    description: >
      cue_vector must be present and valid; missing vectors invalidate the envelope.
  - name: correction_level_must_increase
    description: >
      correction_level must be strictly greater than the correction_level in IE.
  - name: degradation_level_consistency
    description: >
      degradation_level must not increase relative to IE or IIInB.
  - name: replay_stability_required
    description: >
      CEx must produce identical envelope geometry under replay for identical inputs.
  - name: admissible_source_only
    description: >
      CEx may only accept envelopes produced by IE.

geometry_signature:
  envelope_type: correction_expansion_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: degradation_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: correction_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: expansion_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    CEx geometry is a bounded polytope representing semantic stability, routing stability,
    cue coherence, degradation magnitude, correction magnitude, and expansion magnitude.
    This geometry determines whether CE can evaluate the expanded envelope.

scalar_fields:
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning after correction expansion.
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing signals after correction expansion.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile after correction expansion.
  - name: degradation_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of degradation detected; must not increase relative to IE.
  - name: correction_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of correction applied by IE and increased by CEx.
  - name: expansion_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of expansion applied by CEx.

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates after correction expansion.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates after correction expansion.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates after correction expansion.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - correction_ready
    - expansion_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy CEx invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical envelope geometry.
  - name: inadmissible_source
    description: Envelope did not originate from IE.

routing:
  admissible_inputs:
    - IE
  admissible_outputs:
    - CE
  description: >
    CEx expands the corrected intake envelope and routes it into CE for evaluation.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - ie_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_corrected_flow
    - intake_correction_flow

psc_alignment:
  - CEx must satisfy PSC boundary object requirements.
  - CEx must expose deterministic geometry for replay validation.
  - CEx must align with IE and CE correction primitives.
  - CEx must enforce admissible correction expansion envelope constraints.
