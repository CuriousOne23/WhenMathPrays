reference_object_name: IE
reference_object_class: boundary
semantic_class: intake_envelope
version: 1.0.0

purpose:
  short: >
    Defines the static geometry, invariants, admissible envelopes, and routing
    constraints for the Intake Envelope (IE) used in Corrected Path A.
  long: >
    IE is the first correction-stage boundary reference object. It receives stabilized
    intake inference envelopes from IIInB and constructs the corrected intake envelope
    used by CEx, CE, TPU, and IMR. IE provides deterministic geometry, invariant sets,
    and field definitions required for PSC replay and correction routing.

invariants:
  - name: envelope_must_be_closed
    description: >
      IE must produce a closed envelope geometry before any correction expansion
      or evaluation primitives may operate.
  - name: semantic_vector_required
    description: >
      IE must expose a valid semantic_vector; missing or null vectors invalidate the envelope.
  - name: routing_vector_required
    description: >
      IE must expose a valid routing_vector; missing or null vectors invalidate the envelope.
  - name: degradation_level_consistency
    description: >
      degradation_level must be consistent with IIInB.degradation_level and may not increase.
  - name: replay_stability_required
    description: >
      IE must produce identical envelope geometry under replay for identical inputs.
  - name: admissible_intake_inference_only
    description: >
      IE may only accept envelopes produced by IIInB.

geometry_signature:
  envelope_type: corrected_intake_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: routing_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: cue_axis
      type: scalar
      bounds: [-1.0, 1.0]
    - name: degradation_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: correction_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    IE geometry is a bounded polytope in five axes representing semantic stability,
    routing stability, cue coherence, degradation magnitude, and correction magnitude.
    IE constructs the corrected intake envelope used by CEx and CE.

scalar_fields:
  - name: semantic_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of semantic meaning after intake inference.
  - name: routing_stability
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Stability of routing signals after intake inference.
  - name: cue_coherence
    type: float
    bounds: [-1.0, 1.0]
    description: >
      Coherence of cue profile after intake inference.
  - name: degradation_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of degradation detected at intake; must not increase relative to IIInB.
  - name: correction_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of correction applied at IE stage.

vector_fields:
  - name: semantic_vector
    type: vector
    length: 3
    description: >
      Semantic manifold coordinates used by CEx and CE.
  - name: routing_vector
    type: vector
    length: 3
    description: >
      Routing manifold coordinates used by CEx and CE.
  - name: cue_vector
    type: vector
    length: 3
    description: >
      Cue manifold coordinates used to determine correction direction.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - correction_ready
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy IE invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical envelope geometry.
  - name: inadmissible_source
    description: Envelope did not originate from IIInB.

routing:
  admissible_inputs:
    - IIInB
  admissible_outputs:
    - CEx
    - CE
  description: >
    IE constructs the corrected intake envelope and routes it into correction expansion (CEx)
    or correction evaluation (CE) depending on correction_level and envelope geometry.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - iiinb_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_corrected_flow
    - intake_correction_flow

psc_alignment:
  - IE must satisfy PSC boundary object requirements.
  - IE must expose deterministic geometry for replay validation.
  - IE must align with correction primitives CEx, CE, TPU, IMR.
  - IE must enforce admissible intake inference envelope constraints.
