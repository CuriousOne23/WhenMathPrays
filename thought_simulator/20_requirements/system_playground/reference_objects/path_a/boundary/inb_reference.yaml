primitive: InB
domain: boundary
version: 1.0.0
description: >
  Input Basin — deterministic, non-inferential front door for all external signals.
  Performs schema validation, surface canonicalization, FIFO preservation, and
  structural admissibility evaluation using POS-category dictionary. Determines
  whether Path A proceeds via Clean Flow or Corrected Flow (IIInB engaged).
  Does not perform semantic repair, inference, inquiry, or routing authority.

lifecycle:
  start_conditions:
    - external_signal_received
    - envelope_not_initialized
  done_conditions:
    - envelope_initialized
    - structural_admissibility_evaluated
    - canonical_form_emitted

behavioral_contract:
  invariants:
    - no_semantic_inference
    - preserve_fifo_order
    - preserve_token_boundaries
    - envelope_must_be_closed
    - envelope_must_be_connected
    - envelope_stable_under_replay
    - structural_validation_must_be_deterministic
  geometry:
    envelope_type: minimal
    rules:
      - closure_required
      - connectedness_required
      - no_refinement_allowed
  fields:
    required:
      - raw_input
      - canonical_tokens
      - pos_tags
      - admissibility_flag
    optional:
      - transport_metadata
  refinement_rules:
    - no_semantic_refinement
    - no_clause_refinement
    - no_envelope_refinement
    - only_surface_canonicalization_allowed

envelope_evaluation:
  envelope_status:
    valid_clean:
      conditions:
        - admissibility_flag == clean
        - no_anomalies_detected
    valid_degraded:
      conditions:
        - admissibility_flag == degraded
        - anomalies_present
    invalid:
      conditions:
        - admissibility_flag == invalid
  anomaly_flags:
    - malformed_token
    - malformed_pos
    - malformed_adjacency
    - degraded_envelope
    - degraded_clause

routing:
  valid_clean: SOB
  valid_degraded: IIInB
  invalid: PathB

dependencies:
  meaning_dictionary: none
  runtime_dictionary: pos_category_dictionary
  dev_dictionary: none

reference_objects:
  - OB
  - SOB

field_reference_tables:
  - inb_field_schema

flow_contracts:
  - path_a_clean_flow
  - path_a_corrected_flow
