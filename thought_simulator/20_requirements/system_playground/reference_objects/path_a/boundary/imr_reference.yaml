reference_object_name: IMR
reference_object_class: boundary
semantic_class: mismatch_record
version: 1.0.0

purpose:
  short: >
    Defines the deterministic mismatch‑classification geometry and invariants for the
    Inconsistency/Mismatch Record (IMR), which supervises Path‑A correction without
    performing semantic rewrite or meaning construction.
  long: >
    IMR classifies mismatches into Types A, B, and C with strict precedence ordering (C > B > A).
    Type A triggers realization retry only; Type B may emit a CorrectionTrigger for bounded
    semantic reconsideration; Type C is safety‑critical and GB‑gated. IMR is a supervisory
    evaluator invoked after CTP or RTU/RBU events. It does not construct meaning, rewrite
    semantics, or generate free‑form correction signals. IMR provides deterministic geometry,
    invariant sets, and PSC‑aligned mismatch fields required for safe Path‑A correction.

invariants:
  - name: no_meaning_construction
    description: >
      IMR must not construct meaning, rewrite semantics, or generate semantic candidates.
  - name: no_freeform_correction
    description: >
      IMR may not emit arbitrary correction signals; only Type B may emit a bounded CorrectionTrigger.
  - name: strict_precedence_ordering
    description: >
      Mismatch classification must obey C > B > A precedence; higher severity overrides lower.
  - name: closed_envelope_required
    description: >
      IMR may only evaluate closed envelopes produced by CTP or RTU/RBU.
  - name: replay_stability_required
    description: >
      IMR must produce identical mismatch classification under replay for identical inputs.
  - name: admissible_source_only
    description: >
      IMR may only accept envelopes produced by CTP or RTU/RBU.

geometry_signature:
  envelope_type: mismatch_record_envelope
  shape: bounded_polytope
  dimensions:
    - name: expression_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: semantic_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: safety_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    IMR geometry represents expression mismatch magnitude (Type A), semantic mismatch magnitude
    (Type B), and safety mismatch magnitude (Type C). These axes determine mismatch classification
    and corrective authority.

scalar_fields:
  - name: expression_mismatch
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of expression mismatch; Type A triggers realization retry only.
  - name: semantic_mismatch
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of semantic mismatch; Type B may emit a bounded CorrectionTrigger.
  - name: safety_mismatch
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of safety mismatch; Type C is GB‑gated and highest precedence.

vector_fields:
  - name: mismatch_vector
    type: vector
    length: 3
    description: >
      Manifold coordinates representing mismatch features across expression, semantic,
      and safety dimensions.

envelope_status:
  admissible_status:
    - mismatch_detected
    - type_a
    - type_b
    - type_c
  terminal_status:
    - invalid_geometry
    - inadmissible_source
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy IMR invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: precedence_violation
    description: Mismatch classification violated C > B > A ordering.
  - name: inadmissible_source
    description: Envelope did not originate from CTP or RTU/RBU.
  - name: replay_inconsistency
    description: Replay produced non-identical mismatch classification.

routing:
  admissible_inputs:
    - CTP
    - RTU
    - RBU
  admissible_outputs:
    - realization_retry
    - correction_trigger
    - gb_gate
  description: >
    IMR routes mismatch outcomes according to severity: Type A → realization retry;
    Type B → bounded CorrectionTrigger; Type C → GB‑gated safety pathway. IMR does not
    perform semantic rewrite or correction itself.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - ctp_reference
    - rtu_reference
    - rbu_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_correction_flow
    - mismatch_evaluation_flow

psc_alignment:
  - IMR must satisfy PSC boundary object requirements.
  - IMR must expose deterministic mismatch geometry for replay validation.
  - IMR must align with CTP, RTU, RBU, and GB‑gated safety primitives.
  - IMR must enforce admissible mismatch‑classification constraints.
