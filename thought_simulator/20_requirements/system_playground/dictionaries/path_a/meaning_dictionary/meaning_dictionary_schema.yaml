schema_version: 1.0.0

entry:
  id:
    type: string
    required: true
    description: "Globally unique identifier for the dictionary entry."

  word:
    type: string
    required: true
    description: "Surface form of the lexical item."

  identity_anchor:
    type: string
    required: true
    description: "Stable semantic anchor used across TS subsystems."

  meaning_signature:
    type: object
    required: true
    fields:
      primitive:
        type: string
        required: true
        allowed_values:
          - agent
          - action
          - state
          - relation
          - modifier
        description: "Semantic primitive category."

      invariants:
        type: list
        required: true
        description: "Semantic truths that must always hold."

      cue_envelope:
        type: object
        required_if_primitive:
          - modifier
          - relation
        fields:
          triggers:
            type: list
            required_if_present: true
            description: "Cues that activate meaning."
          suppressors:
            type: list
            required_if_present: true
            description: "Cues that deactivate meaning."

  routing_signature:
    type: object
    required: true
    fields:
      route_class:
        type: string
        required: true
        allowed_values:
          - agent-route
          - object-route
          - modifier-route
          - relation-route
        description: "Routing class for deterministic interpretation."

      constraints:
        type: list
        required: true
        description: "Routing constraints required for deterministic interpretation."

  notes:
    type: string
    required: false
    description: "Optional human-readable commentary."

validation:
  missing_schema_behavior:
    on_missing_schema:
      action: "abort"
      message: "ERROR: meaning_dictionary_schema.yaml not found. No modifications were applied."

  schema_change_detection:
    compare:
      - fields_added
      - fields_removed
      - fields_renamed
      - field_types_changed
      - constraints_changed
    on_change:
      warn_user: true
      require_confirmation: true
      revalidate_dictionary: true
      generate_report: "schema_update_report.md"
