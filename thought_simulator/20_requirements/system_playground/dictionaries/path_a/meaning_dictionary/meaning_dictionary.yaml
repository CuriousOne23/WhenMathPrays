# meaning_dictionary.yaml
# Starter Path A meaning dictionary for TS

entries:

  bank:
    - id: bank_financial_v1
      primitive: agent
      invariants:
        - institution
        - handles_money
      cue_envelope:
        triggers:
          - finance
          - money
          - loan
          - interest
        suppressors:
          - river
          - water
      routing_signature:
        route_class: agent_route
        constraints:
          - may_bind_to_action_as_agent
      identity_anchor:
        continuity_hint: "bank_financial_identity"
        notes: "Financial institution meaning."

    - id: bank_river_v1
      primitive: state
      invariants:
        - geographic_feature
        - adjacent_to_water
      cue_envelope:
        triggers:
          - river
          - water
          - slope
          - geography
        suppressors:
          - loan
          - interest
          - currency
      routing_signature:
        route_class: state_route
        constraints:
          - may_bind_to_relation_as_location
      identity_anchor:
        continuity_hint: "bank_river_identity"
        notes: "River bank meaning."

  cat:
    - id: cat_agent_v1
      primitive: agent
      invariants:
        - animate
        - has_identity
        - participates_in_agent_route
      cue_envelope:
        triggers:
          - animal
          - pet
          - cat
        suppressors:
          - bank
          - finance
      routing_signature:
        route_class: agent_route
        constraints:
          - must_bind_to_action_as_agent
      identity_anchor:
        continuity_hint: "default_cat_agent"
        notes: "Canonical cat as agent."

  chased:
    - id: chased_action_v1
      primitive: action
      invariants:
        - requires_agent
        - requires_object
      cue_envelope:
        triggers:
          - chase
          - run
          - pursuit
        suppressors:
          - static_state
      routing_signature:
        route_class: action_route
        constraints:
          - must_bind_agent
          - must_bind_object
      identity_anchor:
        continuity_hint: "default_chase_action"
        notes: "Canonical chasing action."

  dog:
    - id: dog_agent_v1
      primitive: agent
      invariants:
        - animate
        - has_identity
        - participates_in_agent_route
      cue_envelope:
        triggers:
          - animal
          - pet
          - dog
        suppressors:
          - bank
          - finance
      routing_signature:
        route_class: agent_route
        constraints:
          - must_bind_to_action_as_agent
      identity_anchor:
        continuity_hint: "default_dog_agent"
        notes: "Canonical dog as agent."

metadata:
  version: 0.1
  description: "Starter TS Path A meaning dictionary with minimal example entries."
  notes:
    - "Each entry has: primitive, invariants, cue_envelope, routing_signature, identity_anchor."
    - "Extend by following meaning_dct_spec.md and ts_path_a_semantic_engine.md."
