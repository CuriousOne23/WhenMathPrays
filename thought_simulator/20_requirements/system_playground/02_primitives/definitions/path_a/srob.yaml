primitive_name: SROB
primitive_family: path_a
reference_type: srob_reference
version: 1.0.0

description: >
  SROB (Structural Refinement OB) is the Path-A primitive responsible for
  refining the structural-boundary envelope produced by SOB. SROB performs no
  semantic interpretation, no cue extraction, no routing computation, and no
  correction. Its sole job is to canonicalize, normalize, and refine structural
  slots before CnOB enforces neutrality. SROB is strictly structural and
  replay-stable.

runtime_behavior:
  mode: refine_structural_slots
  semantic_interpretation: none
  cue_extraction: none
  routing_computation: none
  correction_application: none
  replay_behavior: deterministic

inputs:
  required:
    - sob_envelope

outputs:
  envelope_type: structural_refinement_envelope
  fields:
    scalar_fields:
      - refinement_integrity
      - slot_count
      - slot_shape_score
      - refinement_magnitude
      - degradation_level
    vector_fields:
      - refined_structural_slot_vector
      - refined_structural_residue_vector
  status_flags:
    - srob_ready
    - degraded

invariants:
  sob_envelope_required: true
  structural_slots_required: true
  deterministic_refinement: true
  no_semantic_fields: true
  no_routing_fields: true
  no_cue_fields: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required SOB structural slots must be present; SROB may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All structural slots must match expected shapes; no plausibility checks.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_refinement_monotonicity:
    description: >
      refinement_magnitude must reflect deterministic refinement rules and may not
      decrease when upstream structural irregularities increase.
    enforced: true

  C5_no_semantic_or_routing:
    description: >
      SROB must not produce semantic, routing, or cue vectors.
    enforced: true

  C6_structural_canonicalization:
    description: >
      refined_structural_slot_vector must be canonical, stable, and identical under replay.
    enforced: true

  C7_replay_determinism:
    description: >
      SROB must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_sob_envelope
    - extract_structural_slots
    - canonicalize_structural_slots
    - normalize_structural_shapes
    - compute_refined_residue
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  srob_ready:
    conditions:
      - refinement_integrity >= 0.0
      - slot_count > 0
  degraded:
    conditions:
      - degradation_level > 0.2

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_sob_envelope:
    triggers:
      - SOB envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical refinement geometry
  inadmissible_source:
    triggers:
      - envelope not from SOB

routing:
  admissible_inputs:
    - SOB
  admissible_outputs:
    - CnOB
  description: >
    SROB emits structural-refinement envelopes consumed by CnOB. SROB performs no
    routing transitions.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - sob_reference
    - cnob_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow

psc_alignment:
  - SROB satisfies PSC structural-refinement object requirements.
  - SROB exposes deterministic refinement geometry for replay validation.
  - SROB aligns with SOB and CnOB.
  - SROB enforces admissible structural-refinement envelope constraints.
