primitive_name: IIInB
primitive_family: path_a
reference_type: iiinb_reference
version: 1.0.0

description: >
  IIInB (Third-Order Neutral Boundary) is the Path-A primitive responsible for
  enforcing third-order neutrality by removing residual semantic curvature,
  residual cue-alignment, and residual routing-adjacent signals left after IInB.
  IIInB performs no semantic interpretation, no cue extraction, no routing, and
  no correction. Its sole job is to produce a fully neutral envelope for CnOB.

runtime_behavior:
  mode: enforce_third_order_neutrality
  semantic_interpretation: none
  cue_extraction: none
  routing_computation: none
  correction_application: none
  replay_behavior: deterministic

inputs:
  required:
    - iinb_envelope
  optional:
    - semantic_vector
    - cue_vector
    - routing_vector

outputs:
  envelope_type: third_order_neutral_boundary_envelope
  fields:
    scalar_fields:
      - neutrality_level
      - curvature_residual
      - cue_alignment_residual
      - routing_adjacent_residual
      - degradation_level
    vector_fields:
      - semantic_vector
      - cue_vector
      - routing_vector
  status_flags:
    - neutral_ready
    - degraded

invariants:
  iinb_envelope_required: true
  semantic_vector_required: true
  cue_vector_required: true
  routing_vector_required: true
  neutrality_must_increase: true
  residuals_must_decrease: true
  no_semantic_or_routing_write: true
  no_cue_extraction: true
  deterministic_neutrality: true
  replay_stability_required: true

constraint_families:
  C1_slot_presence:
    description: >
      All required IInB fields must be present; IIInB may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All fields must match expected structural shapes; no plausibility checks.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_residual_reduction:
    description: >
      curvature_residual, cue_alignment_residual, and routing_adjacent_residual
      must be strictly reduced relative to IInB.
    enforced: true

  C5_neutrality_monotonicity:
    description: >
      neutrality_level must be greater than or equal to neutrality_level from IInB.
    enforced: true

  C6_no_semantic_or_routing:
    description: >
      IIInB must not modify semantic meaning, routing metadata, or cue semantics.
    enforced: true

  C7_replay_determinism:
    description: >
      IIInB must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_iinb_envelope
    - validate_required_vectors
    - check_closed_envelope
    - compute_residual_reductions
    - enforce_neutrality_monotonicity
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  neutral_ready:
    conditions:
      - neutrality_level >= 0.9
      - curvature_residual <= 0.05
      - cue_alignment_residual <= 0.05
      - routing_adjacent_residual <= 0.05
  degraded:
    conditions:
      - degradation_level > 0.2

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_iinb_envelope:
    triggers:
      - IInB envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical neutral geometry
  inadmissible_source:
    triggers:
      - envelope not from IInB

routing:
  admissible_inputs:
    - IInB
  admissible_outputs:
    - CnOB
  description: >
    IIInB enforces third-order neutrality and routes the neutral envelope into CnOB.
    IIInB performs no routing transitions.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - iinb_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - IIInB satisfies PSC neutral-boundary object requirements.
  - IIInB exposes deterministic third-order neutrality geometry for replay validation.
  - IIInB aligns with IInB and CnOB.
  - IIInB enforces admissible third-order neutral-boundary envelope constraints.
