primitive_name: CnOB
primitive_family: path_a
reference_type: cnob_reference
version: 1.0.0

description: >
  CnOB (Correction-Neutral Object Boundary) is the Path-A primitive responsible for
  extracting neutral structural residue, enforcing neutrality invariants, and producing
  the correction-neutral envelope consumed by IE, CEx, CE, and ISc. CnOB performs no
  semantic interpretation, no routing computation, and no correction. It preserves
  semantic and routing meaning while preparing the envelope for correction flow.

runtime_behavior:
  mode: extract_boundary_residue
  neutrality: enforced
  correction_application: none
  semantic_interpretation: none
  routing_computation: none
  replay_behavior: deterministic

inputs:
  required:
    - sob_envelope
    - srob_envelope
  optional:
    - cue_vector
    - semantic_vector
    - routing_vector

outputs:
  envelope_type: correction_neutral_boundary_envelope
  fields:
    scalar_fields:
      - semantic_stability
      - routing_stability
      - cue_coherence
      - degradation_level
      - neutrality_level
    vector_fields:
      - semantic_vector
      - routing_vector
      - cue_vector
  status_flags:
    - stable
    - degraded
    - neutral_ready

invariants:
  envelope_must_be_closed: true
  semantic_vector_required: true
  routing_vector_required: true
  cue_vector_required: true
  correction_level_must_be_zero: true
  degradation_level_consistency: true
  semantic_routing_alignment: true
  replay_stability_required: true

constraint_families:
  C1_slot_presence:
    description: >
      All required structural slots must be present; no semantic inference permitted.
    enforced: true

  C2_slot_shape:
    description: >
      All slots must match expected structural shapes; no repair or plausibility allowed.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_monotonic_degradation:
    description: >
      degradation_level must not increase relative to upstream boundaries.
    enforced: true

  C5_neutrality_zero:
    description: >
      neutrality_level must be maximal and correction_level must be zero.
    enforced: true

  C6_alignment_rules:
    description: >
      semantic_vector and routing_vector must remain aligned according to manifold rules.
    enforced: true

  C7_replay_determinism:
    description: >
      CnOB must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_required_vectors
    - check_closed_envelope
    - enforce_neutrality_constraints
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  stable:
    conditions:
      - degradation_level <= 0.2
      - neutrality_level == 1.0
  degraded:
    conditions:
      - degradation_level > 0.2
  neutral_ready:
    conditions:
      - neutrality_level == 1.0
      - semantic_stability >= 0.0
      - routing_stability >= 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  replay_inconsistency:
    triggers:
      - replay produces non-identical envelopes
  inadmissible_source:
    triggers:
      - envelope not from SOB or SROB

routing:
  admissible_inputs:
    - SOB
    - SROB
    - IE
  admissible_outputs:
    - IE
    - ISc
    - CEx
    - CE
  description: >
    CnOB stabilizes semantic and routing meaning without applying correction and routes
    the neutral envelope into correction primitives depending on stability and cue coherence.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - sob_reference
    - srob_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - CnOB satisfies PSC structure-object requirements.
  - CnOB exposes deterministic geometry for replay validation.
  - CnOB aligns with correction primitives (IE, CEx, CE, ISc).
  - CnOB enforces admissible correction-neutral envelope constraints.
