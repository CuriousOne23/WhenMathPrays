primitive_name: CE
primitive_class: boundary
semantic_class: context_envelope
version: 1.1.0

description:
  short: >
    CE (ContextEnvelope) validates and evaluates the bounded context slice produced
    by CEx, ensuring deterministic, replay‑safe geometry before candidate_set{} and ISc.
  long: >
    CE is a deterministic context‑evaluation primitive. It reads all TP‑stream fields
    but does not modify or commit any. CE validates bounded geometry, checks referent,
    discourse, cue, and locality fields, ensures semantic/meaning/process/supervisor
    invariants remain unchanged, and produces an evaluation‑ready CE envelope for
    candidate generation and scoring. CE is strictly local, replay‑safe, and side‑effect‑free.

inputs:
  admissible_sources:
    - CEx
  envelope_type: context_envelope
  description: >
    CE accepts the bounded context envelope produced by CEx. CE may not accept envelopes
    from any other source.

outputs:
  envelope_type: context_envelope
  scalar_fields:
    - referent_strength
    - discourse_coherence
    - cue_salience
    - locality_bound
  vector_fields:
    - referent_vector
    - discourse_vector
    - cue_vector
  status_flags:
    - context_ready
    - referents_present
    - cues_present
    - evaluation_valid
  description: >
    CE forwards the validated context envelope to candidate_set{} and ISc without
    modification of TP‑stream fields.

invariants:
  - name: closed_envelope_required
    description: >
      CE may only operate on closed envelopes produced by CEx.
  - name: no_tp_modification
    description: >
      CE must not modify any TP‑stream fields; all meaning/process/supervisor fields
      must remain unchanged.
  - name: bounded_context_required
    description: >
      CE must validate that all context geometry remains within bounded limits.
  - name: no_semantic_interpretation
    description: >
      CE must not interpret or construct meaning; it only validates context geometry.
  - name: no_routing_authority
    description: >
      CE must not perform routing decisions or modify routing metadata.
  - name: replay_stability_required
    description: >
      CE must produce identical output envelopes under replay for identical inputs.
  - name: admissible_source_only
    description: >
      CE may only accept envelopes produced by CEx.

evaluation_logic:
  steps:
    - validate_ce_envelope_shape
    - check_closed_envelope
    - verify_scalar_bounds
    - verify_vector_bounds
    - verify_tp_stream_unchanged
    - determine_context_status
    - determine_evaluation_validity
    - forward_envelope_unchanged

status_determination:
  context_ready:
    conditions:
      - referent_strength >= 0.0
      - discourse_coherence >= 0.0
      - cue_salience >= 0.0
  referents_present:
    conditions:
      - referent_strength > 0.0
  cues_present:
    conditions:
      - cue_salience > 0.0
  evaluation_valid:
    conditions:
      - locality_bound >= 0.0
      - no_tp_modification

anomaly_flags:
  - name: geometry_violation
    triggers:
      - envelope geometry violates invariants
  - name: field_out_of_bounds
    triggers:
      - scalar or vector fields exceed bounds
  - name: inadmissible_source
    triggers:
      - envelope not from CEx
  - name: tp_stream_modified
    triggers:
      - any TP‑stream field differs from upstream committed values
  - name: replay_inconsistency
    triggers:
      - replay produces non-identical envelopes

routing:
  admissible_inputs:
    - CEx
  admissible_outputs:
    - candidate_set
    - ISc
  description: >
    CE validates and evaluates the bounded context envelope and forwards it to
    candidate_set{} and ISc. CE performs no routing transitions.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - ce_reference
    - cex_reference
    - boundary_reference
    - semantic_reference
    - structure_reference
  flow_contracts:
    - path_a_inference_flow

psc_alignment:
  - CE satisfies PSC boundary-object requirements.
  - CE exposes deterministic, bounded context geometry for replay validation.
  - CE aligns with CEx, candidate_set{}, and ISc.
  - CE enforces admissible context‑envelope constraints.
