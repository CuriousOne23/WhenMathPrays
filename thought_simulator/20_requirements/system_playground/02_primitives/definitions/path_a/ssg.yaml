primitive_name: SSG
primitive_family: path_a
reference_type: ssg_reference
version: 1.0.0

description: >
  SSG (Structural Signature Generator) is the Path-A primitive responsible for
  converting SmOB output into deterministic structural signature vectors used
  for routing, similarity, and manifold adjacency. SSG performs no semantic
  interpretation, no hashing, no XOR, no correction, and no truth evaluation.
  Its sole job is to generate fixed-length structural signatures from
  presemantic structural residue and semantic-adjacent cues.

runtime_behavior:
  mode: generate_structural_signature
  semantic_interpretation: none
  correction_application: none
  routing_computation: none
  truth_evaluation: none
  replay_behavior: deterministic

inputs:
  required:
    - smob_envelope
  optional:
    - semantic_adjacent_cues
    - presemantic_residue_hash
    - tr_input_cues

outputs:
  envelope_type: structural_signature_envelope
  fields:
    scalar_fields:
      - signature_integrity
      - signature_strength
      - adjacency_strength
      - degradation_level
    vector_fields:
      - structural_signature_vector
      - adjacency_vector
      - routing_signature_vector
  status_flags:
    - ssg_ready
    - degraded

invariants:
  smob_envelope_required: true
  deterministic_signature_required: true
  no_semantic_interpretation: true
  no_hashing_or_xor: true
  no_truth_evaluation: true
  no_routing_computation: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required SmOB fields must be present; SSG may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All signature and adjacency vectors must match expected structural shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_signature_determinism:
    description: >
      structural_signature_vector must be stable, canonical, and identical under replay.
    enforced: true

  C5_no_semantic_or_truth:
    description: >
      SSG must not modify semantic meaning, truth fields, routing metadata,
      identity fields, or cue semantics.
    enforced: true

  C6_presemantic_boundary:
    description: >
      SSG must remain strictly pre-semantic; no semantic manifold access allowed.
    enforced: true

  C7_replay_determinism:
    description: >
      SSG must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_smob_envelope
    - extract_structural_inputs
    - compute_structural_signature
    - compute_adjacency_vector
    - compute_routing_signature_vector
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  ssg_ready:
    conditions:
      - signature_integrity >= 0.0
      - signature_strength >= 0.0
  degraded:
    conditions:
      - degradation_level > 0.2

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_smob_envelope:
    triggers:
      - SmOB envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical signature geometry
  inadmissible_source:
    triggers:
      - envelope not from SmOB

routing:
  admissible_inputs:
    - SmOB
  admissible_outputs:
    - STPX
  description: >
    SSG emits structural-signature envelopes consumed by STPX. SSG performs no
    routing transitions.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - smob_reference
    - stpx_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow

psc_alignment:
  - SSG satisfies PSC structural-signature object requirements.
  - SSG exposes deterministic signature geometry for replay validation.
  - SSG aligns with SmOB and STPX.
  - SSG enforces admissible structural-signature envelope constraints.
