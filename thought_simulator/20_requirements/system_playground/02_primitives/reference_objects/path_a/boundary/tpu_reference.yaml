reference_object_name: TPU
reference_object_class: boundary
semantic_class: thought_packet_updater
version: 1.0.0

purpose:
  short: >
    Defines the deterministic, bounded geometry and invariants for the Thought Packet
    Updater (TPU), the sole safe writer to TP for Path‑A correction.
  long: >
    TPU applies CE + CEx + ISc validated updates to TP(N), producing TP(N+1) under a new
    commit_id. TPU inserts and corrects message‑items, referents, constraints, and meaning
    fields while enforcing the single‑writer invariant. TPU performs no topology, routing,
    governance, or realization work and does not write semantic_core. TPU is Path‑A only;
    Path‑B is meaning‑read‑only and must never invoke TPU.

invariants:
  - name: single_writer_invariant
    description: >
      TPU is the sole primitive permitted to write to TP during Path‑A correction.
  - name: admissible_source_required
    description: >
      TPU may only accept envelopes produced by CE + ISc; any other source is invalid.
  - name: no_semantic_core_write
    description: >
      TPU must not write or modify semantic_core; semantic_core is written only by OuBA.
  - name: no_topology_or_routing_work
    description: >
      TPU must not perform topology, routing, governance, or realization operations.
  - name: deterministic_update_required
    description: >
      Given identical CE + ISc inputs, TPU must produce identical TP(N+1) under replay.
  - name: path_a_only
    description: >
      TPU‑prm must not be invoked by Path‑B; Path‑B is meaning‑read‑only.
  - name: closed_envelope_required
    description: >
      TPU may only operate on closed CE + ISc envelopes; open or partial envelopes are invalid.

geometry_signature:
  envelope_type: tpu_update_envelope
  shape: bounded_polytope
  dimensions:
    - name: update_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: referent_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: constraint_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: meaning_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    TPU geometry represents the magnitude of validated updates applied to TP, including
    message‑item corrections, referent updates, constraint adjustments, and meaning‑field
    updates. No semantic_core, topology, routing, or realization axes appear here.

scalar_fields:
  - name: update_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of validated updates applied to TP(N).
  - name: referent_update_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of referent correction or insertion.
  - name: constraint_update_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of constraint correction or insertion.
  - name: meaning_update_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of meaning‑field correction or insertion.

vector_fields:
  - name: ce_vector
    type: vector
    length: 3
    description: >
      Context manifold coordinates from CE used to determine update direction.
  - name: isc_vector
    type: vector
    length: 3
    description: >
      Scoring manifold coordinates from ISc used to determine update magnitude.
  - name: update_vector
    type: vector
    length: 3
    description: >
      Manifold coordinates representing the validated TP update applied by TPU.

envelope_status:
  admissible_status:
    - update_ready
    - referent_update_ready
    - meaning_update_ready
  terminal_status:
    - invalid_geometry
    - inadmissible_source
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy TPU invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: inadmissible_source
    description: Envelope did not originate from CE + ISc.
  - name: replay_inconsistency
    description: Replay produced non-identical TP update geometry.

routing:
  admissible_inputs:
    - CE
    - ISc
  admissible_outputs:
    - TP
  description: >
    TPU applies validated updates to TP(N) and produces TP(N+1). TPU does not route to
    any other primitive; routing occurs after TP update via TR and CTP.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - ce_reference
    - isc_reference
    - boundary_reference
    - semantic_reference
    - structure_reference
  flow_contracts:
    - path_a_correction_flow

psc_alignment:
  - TPU must satisfy PSC boundary object requirements.
  - TPU must expose deterministic update geometry for replay validation.
  - TPU must align with CE, ISc, TR, and CTP.
  - TPU must enforce admissible TP update constraints.
