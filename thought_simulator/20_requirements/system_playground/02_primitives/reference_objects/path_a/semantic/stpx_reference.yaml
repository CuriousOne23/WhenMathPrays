reference_object_name: STPX
reference_object_class: structure
semantic_class: structured_token_pattern_extractor
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and routing constraints
    for the Structured Token & Pattern Extractor (STPX) in Path A.
  long: >
    STPX extracts deterministic lexical, structural, and constraint cues from cleaned
    structural geometry and canonical tokens. It identifies surface markers (contrastive,
    temporal, uncertainty tokens), structural boundaries (clauses, conjunction types,
    punctuation patterns), and constraint flags (temporal progression, causal tension,
    referential stability). STPX emits a bounded cue_envelope consumed by RBU, ISc,
    RB, and IdOB. STPX performs no semantic interpretation and does not modify meaning
    geometry.

invariants:
  - name: envelope_must_be_closed
    description: >
      STPX must operate only on closed envelopes produced by SSG.
  - name: canonical_tokens_required
    description: >
      canonical_tokens must be present and valid; missing tokens invalidate cue extraction.
  - name: structural_geometry_required
    description: >
      cleaned_structural_geometry must be present and valid.
  - name: deterministic_cue_extraction
    description: >
      cue_envelope must be deterministically derived from structural geometry + canonical tokens.
  - name: no_semantic_interpretation
    description: >
      STPX must not perform semantic interpretation, semantic plausibility, or meaning refinement.
  - name: replay_stability_required
    description: >
      STPX must produce identical cue_envelopes under replay for identical inputs.

geometry_signature:
  envelope_type: cue_envelope
  shape: bounded_polytope
  dimensions:
    - name: lexical_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: structural_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: constraint_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: boundary_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    STPX geometry represents lexical cue strength, structural boundary magnitude,
    constraint flag activation, and clause/conjunction boundary stability. No semantic
    manifold axes appear here.

scalar_fields:
  - name: lexical_cue_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of lexical cues (contrastive, temporal, uncertainty tokens).
  - name: structural_boundary_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Strength of structural boundaries (clauses, conjunction types, punctuation patterns).
  - name: constraint_flag_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of constraint cues (temporal progression, causal tension, referential stability).
  - name: cue_entropy
    type: float
    bounds: [0.0, 1.0]
    description: >
      Entropy of extracted cue distribution.

vector_fields:
  - name: lexical_cue_vector
    type: vector
    length: 3
    description: >
      Coordinates representing lexical cue activation.
  - name: structural_cue_vector
    type: vector
    length: 3
    description: >
      Coordinates representing structural boundary cues.
  - name: constraint_cue_vector
    type: vector
    length: 3
    description: >
      Coordinates representing constraint flags.
  - name: cue_envelope_vector
    type: vector
    length: 9
    description: >
      Combined cue vector (lexical + structural + constraint) used by RBU and scoring primitives.

envelope_status:
  admissible_status:
    - cue_ready
    - degraded_structure
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy STPX invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_structural_geometry
    description: Required structural geometry is absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical cue_envelopes.

routing:
  admissible_inputs:
    - SSG
  admissible_outputs:
    - RBU
    - ISc
    - RB
    - IdOB
  description: >
    STPX emits cue_envelopes consumed by RBU, ISc, RB, and IdOB. It does not route
    into semantic manifold formation or meaning refinement.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - ssg_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - STPX must satisfy PSC structure object requirements.
  - STPX must expose deterministic cue geometry for replay validation.
  - STPX must align with SSG, RBU, RB, ISc, and IdOB.
  - STPX must enforce admissible cue_envelope constraints.
