reference_object_name: RBU
reference_object_class: identity
semantic_class: routing_buffer_update_primitive
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and TP‑write constraints
    for the Routing Buffer Update Primitive (RBU‑prm) in Path A.
  long: >
    RBU‑prm enriches the TP with interpretive metadata required for RB‑prm to perform
    correct routing. RBU‑prm deterministically writes culture, subculture, identity,
    register, and stance‑relevant cues into the TP snapshot before routing occurs.
    RBU‑prm performs no routing, scoring, semantic evaluation, or identity formation.
    It prepares TP(N) so RB‑prm can compute routing deltas correctly.

invariants:
  - name: envelope_must_be_closed
    description: >
      RBU‑prm must operate only on closed envelopes produced by STPX or upstream
      structural cue extractors.
  - name: interpretive_metadata_required
    description: >
      culture_vector, subculture_vector, register_vector, and stance_vector must be
      present and valid; missing vectors invalidate the envelope.
  - name: no_routing_computation
    description: >
      RBU‑prm must not compute routing deltas, routing lanes, or routing manifold transitions.
  - name: no_semantic_evaluation
    description: >
      RBU‑prm must not evaluate semantic meaning, truth, stance, or plausibility.
  - name: deterministic_tp_write
    description: >
      Given identical interpretive metadata envelopes, RBU‑prm must produce identical
      TP(N+1) under replay.
  - name: path_a_only
    description: >
      RBU‑prm must not be invoked by Path‑B; Path‑B is meaning‑read‑only.

geometry_signature:
  envelope_type: interpretive_metadata_envelope
  shape: bounded_polytope
  dimensions:
    - name: culture_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: subculture_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: register_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: stance_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    RBU‑prm geometry represents interpretive metadata magnitude and stability. No
    routing, semantic, or identity manifold axes appear here.

scalar_fields:
  - name: culture_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of cultural metadata extracted from upstream cues.
  - name: subculture_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of subculture metadata.
  - name: register_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of register metadata.
  - name: stance_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of stance‑relevant cues.

vector_fields:
  - name: culture_vector
    type: vector
    length: 3
    description: >
      Culture manifold coordinates written into TP.
  - name: subculture_vector
    type: vector
    length: 3
    description: >
      Subculture manifold coordinates written into TP.
  - name: register_vector
    type: vector
    length: 3
    description: >
      Register manifold coordinates written into TP.
  - name: stance_vector
    type: vector
    length: 3
    description: >
      Stance‑relevant cue coordinates written into TP.

envelope_status:
  admissible_status:
    - metadata_ready
    - degraded
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy RBU‑prm invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_metadata
    description: Required interpretive metadata vectors are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical TP writes.

routing:
  admissible_inputs:
    - STPX
  admissible_outputs:
    - TP
  description: >
    RBU‑prm writes interpretive metadata into TP(N), producing TP(N+1). Routing occurs
    only after RBU‑prm via RB‑prm.

dependencies:
  dictionaries:
    - identity_dictionary
    - runtime_dictionary
  reference_objects:
    - stpx_reference
    - boundary_reference
    - identity_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_routing_enrichment_flow

psc_alignment:
  - RBU‑prm must satisfy PSC identity‑class object requirements.
  - RBU‑prm must expose deterministic TP‑write geometry for replay validation.
  - RBU‑prm must align with RB‑prm and TP update rules.
  - RBU‑prm must enforce admissible interpretive metadata envelope constraints.
