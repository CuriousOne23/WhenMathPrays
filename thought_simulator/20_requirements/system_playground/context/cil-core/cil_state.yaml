# CIL State Schema
# System Playground Version
# This file contains no SHALL statements and no HLRs.

cil_state:
  description: >
    Internal state representation for the Conversation Identity Layer (CIL).
    Tracks selected identity-layer objects, stability summaries, ambiguity levels,
    ordering metrics, and lineage information used to construct the CIL Intake Packet.

  version: 1.0

  fields:

    selected_identity_objects:
      description: >
        Identity-layer objects chosen from COB for inclusion in the next intake packet.
      type: list
      items:
        type: object
        fields:
          id:
            type: string
            description: >
              Unique identifier for the identity-layer object.
          referent_map:
            type: object
            description: >
              Stabilized referent map for the identity-layer object.
          anchors:
            type: list
            description: >
              Anchor set associated with the identity-layer object.
          lineage:
            type: object
            description: >
              Lineage record and lineage stability indicators.
          ambiguity:
            type: object
            description: >
              Ambiguity indicators for referents and anchors.
          stability_metrics:
            type: object
            description: >
              Stability metrics derived from CST signals.
          ordering_metrics:
            type: object
            description: >
              Recency, frequency, and density metrics from COB.

    certainty_state:
      description: >
        Aggregated certainty indicators across selected identity-layer objects.
      type: object
      fields:
        certainty_levels:
          type: object
        ambiguity_levels:
          type: object

    stability_state:
      description: >
        Aggregated stability information derived from CST signals.
      type: object
      fields:
        drift:
          type: number
        oscillation:
          type: number
        collapse:
          type: boolean
        merge_split:
          type: object
        freeze_thaw:
          type: object

    lineage_state:
      description: >
        Aggregated lineage hints and stability indicators.
      type: object
      fields:
        lineage_records:
          type: list
        lineage_stability:
          type: object

    ordering_state:
      description: >
        Ordering metrics used by CIL for identity selection.
      type: object
      fields:
        recency:
          type: number
        frequency:
          type: number
        density:
          type: number

    metadata:
      description: >
        Metadata describing the current CIL state.
      type: object
      fields:
        turn_index:
          type: integer
        timestamp:
          type: string
        cob_object_count:
          type: integer
        selected_object_count:
          type: integer

  notes:
    - "This schema defines the system_playground version of CIL state."
    - "It mirrors global CIL architecture while remaining scoped for simulation and testing."
    - "No SHALL statements appear in this file."
