# COB Structures Schema
# System Playground Version
# This file contains no SHALL statements and no HLRs.

cob_structures:
  description: >
    Structural definitions for the Conversation Object Basin (COB).
    Defines identity-layer object structure, referent maps, anchors,
    lineage records, ambiguity indicators, stability metrics, and ordering metrics.

  version: 1.0

  identity_object:
    description: >
      Structure of a single identity-layer object maintained by COB.
    type: object
    fields:

      id:
        type: string
        description: >
          Unique identifier for the identity-layer object.

      referent_map:
        type: object
        description: >
          Stabilized referent map representing identity-layer referents.

      anchors:
        type: list
        description: >
          Anchor set associated with the identity-layer object.

      lineage:
        type: object
        description: >
          Lineage record and lineage stability indicators.

      ambiguity:
        type: object
        description: >
          Ambiguity indicators for referents and anchors.

      stability_metrics:
        type: object
        description: >
          Stability metrics derived from CST signals.

      ordering_metrics:
        type: object
        description: >
          Recency, frequency, and density metrics used for selection and eviction.

  basin_state:
    description: >
      Structure representing the entire COB basin containing up to 20 identity-layer objects.
    type: object
    fields:

      objects:
        type: list
        description: >
          List of identity-layer objects currently stored in COB.
        items:
          type: object
          ref: identity_object

      object_count:
        type: integer
        description: >
          Number of identity-layer objects currently stored.

      ordering_summary:
        type: object
        description: >
          Aggregated ordering metrics across the basin.
        fields:
          recency_distribution:
            type: list
          frequency_distribution:
            type: list
          density_distribution:
            type: list

      ambiguity_summary:
        type: object
        description: >
          Aggregated ambiguity indicators across the basin.

      stability_summary:
        type: object
        description: >
          Aggregated stability metrics across the basin.

      lineage_summary:
        type: object
        description: >
          Aggregated lineage stability indicators across the basin.

  metadata:
    description: >
      Metadata describing COB basin state.
    type: object
    fields:
      turn_index:
        type: integer
      timestamp:
        type: string

  notes:
    - "This schema defines the system_playground version of COB structures."
    - "It mirrors global COB architecture while remaining scoped for simulation and testing."
    - "No SHALL statements appear in this file."
