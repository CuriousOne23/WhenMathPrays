# CST Signals Schema
# System Playground Version
# This file contains no SHALL statements and no HLRs.

cst_signals:
  description: >
    Stability signals produced by the Conversation Stability Tracker (CST).
    These signals are consumed by COB and indirectly by CIL.

  version: 1.0

  fields:

    drift:
      description: >
        Drift indicators representing divergence in referent or anchor positions.
      type: object
      fields:
        magnitude:
          type: number
        direction:
          type: string
        affected_objects:
          type: list

    oscillation:
      description: >
        Oscillation indicators representing alternating incompatible states.
      type: object
      fields:
        frequency:
          type: number
        amplitude:
          type: number
        affected_objects:
          type: list

    collapse:
      description: >
        Collapse indicators representing structural failure of identity-layer objects.
      type: object
      fields:
        collapsed_objects:
          type: list
        severity:
          type: number

    merge:
      description: >
        Merge indicators representing convergence of identity-layer objects.
      type: object
      fields:
        merge_pairs:
          type: list
        confidence:
          type: number

    split:
      description: >
        Split indicators representing divergence of identity-layer objects.
      type: object
      fields:
        split_objects:
          type: list
        confidence:
          type: number

    freeze:
      description: >
        Freeze signals preventing COB from modifying specific identity-layer objects.
      type: object
      fields:
        frozen_objects:
          type: list
        reason:
          type: string

    thaw:
      description: >
        Thaw signals restoring normal update behavior for identity-layer objects.
      type: object
      fields:
        thawed_objects:
          type: list
        reason:
          type: string

    certainty_adjustment:
      description: >
        Adjustments to certainty indicators for identity-layer objects.
      type: object
      fields:
        increased_certainty:
          type: list
        decreased_certainty:
          type: list

    ambiguity_adjustment:
      description: >
        Adjustments to ambiguity indicators for identity-layer objects.
      type: object
      fields:
        increased_ambiguity:
          type: list
        decreased_ambiguity:
          type: list

    lineage_stability:
      description: >
        Indicators representing lineage stability for identity-layer objects.
      type: object
      fields:
        stable_lineage:
          type: list
        unstable_lineage:
          type: list

  metadata:
    description: >
      Metadata describing the CST signal set.
    type: object
    fields:
      turn_index:
        type: integer
      timestamp:
        type: string

  notes:
    - "This schema defines the system_playground version of CST signals."
    - "It mirrors global CST architecture while remaining scoped for simulation and testing."
    - "No SHALL statements appear in this file."
