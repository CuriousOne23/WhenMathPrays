primitive_name: SmOB
primitive_family: path_a
reference_type: smob_reference
version: 1.0.0

description: >
  SmOB (Semantic OB) is the Path-A primitive responsible for two jobs:
  (1) extracting semantic-adjacent cues, modality cues, and affect markers from
      the OB envelope; and
  (2) compressing presemantic residue into deterministic hashes and TR-input
      cue vectors. SmOB performs no semantic interpretation, no truth evaluation,
      no routing, and no correction. It is the sole pre-semantic input to SSG.

runtime_behavior:
  mode: semantic_adjacent_extraction_and_residue_hashing
  semantic_interpretation: none
  correction_application: none
  routing_computation: none
  truth_evaluation: none
  replay_behavior: deterministic

inputs:
  required:
    - ob_envelope
  optional:
    - modality_vector
    - affect_vector
    - structural_residue_vector

outputs:
  envelope_type: smob_envelope
  fields:
    scalar_fields:
      - semantic_adjacent_strength
      - modality_strength
      - affect_strength
      - residue_hash_strength
      - tr_input_strength
    vector_fields:
      - semantic_adjacent_cues
      - modality_cues
      - affect_markers
      - presemantic_residue_hash
      - tr_input_cues
      - delta_h_semantic_adjacent
      - routing_semantic_cues
  status_flags:
    - smob_ready
    - stabilized

invariants:
  ob_envelope_required: true
  deterministic_extraction_required: true
  deterministic_hashing_required: true
  no_semantic_interpretation: true
  no_truth_evaluation: true
  no_routing_or_correction: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required OB fields must be present; SmOB may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All cue and residue fields must match expected structural shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_deterministic_hashing:
    description: >
      presemantic_residue_hash must be stable, canonical, and identical under replay.
    enforced: true

  C5_no_semantic_or_truth:
    description: >
      SmOB must not modify semantic meaning, truth fields, routing metadata,
      identity fields, or cue semantics.
    enforced: true

  C6_presemantic_boundary:
    description: >
      SmOB must remain strictly pre-semantic; no semantic manifold access allowed.
    enforced: true

  C7_replay_determinism:
    description: >
      SmOB must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_ob_envelope
    - extract_semantic_adjacent_cues
    - extract_modality_cues
    - extract_affect_markers
    - compute_presemantic_residue_hash
    - compute_tr_input_cues
    - compute_delta_h_semantic_adjacent
    - compute_routing_semantic_cues
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  smob_ready:
    conditions:
      - semantic_adjacent_strength >= 0.0
      - residue_hash_strength >= 0.0
  stabilized:
    conditions:
      - tr_input_strength > 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_ob_envelope:
    triggers:
      - OB envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical SmOB geometry
  inadmissible_source:
    triggers:
      - envelope not from OB

routing:
  admissible_inputs:
    - OB
  admissible_outputs:
    - SSG
  description: >
    SmOB emits semantic-adjacent cues, residue hashes, and TR-input cues consumed
    by SSG. SmOB performs no routing transitions.

dependencies:
  dictionaries:
    - semantic_dictionary
    - runtime_dictionary
  reference_objects:
    - ob_reference
    - ssg_reference
    - boundary_reference
    - semantic_reference
  flow_contracts:
    - path_a_clean_flow

psc_alignment:
  - SmOB satisfies PSC pre-semantic object requirements.
  - SmOB exposes deterministic extraction and hashing geometry for replay validation.
  - SmOB aligns with SSG and STPX.
  - SmOB enforces admissible semantic-adjacent and residue-hash envelope constraints.
