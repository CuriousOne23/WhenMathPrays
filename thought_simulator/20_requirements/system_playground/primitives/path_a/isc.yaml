primitive_name: ISc
primitive_family: path_a
reference_type: isc_reference
version: 1.0.0

description: >
  ISc (Inference Scorer) is the Path-A primitive responsible for deterministically
  scoring interpretation candidates using truth_hypotheses-prc over candidate_set{}.
  ISc performs no semantic generation, no meaning construction, no global inference,
  and no routing. Its sole job is to produce score_set, score_conflict, and
  score_reason_code for TPU and TR. ISc is strictly local, replay-safe, and
  side-effect-free.

runtime_behavior:
  mode: deterministic_scoring
  semantic_interpretation: none
  correction_application: none
  routing_computation: none
  truth_evaluation: local_only
  global_state_access: none
  replay_behavior: deterministic

inputs:
  required:
    - ce_envelope
    - candidate_set
  optional:
    - routing_candidate_vector
    - routing_ce_vector

outputs:
  envelope_type: inference_score_routing_envelope
  fields:
    scalar_fields:
      - score_set
      - score_conflict
      - score_reason_code
    vector_fields:
      - routing_candidate_vector
      - routing_ce_vector
  status_flags:
    - score_ready
    - conflict_detected

invariants:
  closed_envelope_required: true
  score_fields_required: true
  no_meaning_construction: true
  no_global_state_access: true
  deterministic_scoring_required: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All CE and candidate_set{} fields must be present; ISc may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All fields must match expected structural shapes; no plausibility checks.
    enforced: true

  C3_slot_bounds:
    description: >
      score_set, score_conflict, and score_reason_code must remain within bounds [0,1].
    enforced: true

  C4_local_truth_hypotheses:
    description: >
      truth_hypotheses-prc must be applied strictly locally; no global inference allowed.
    enforced: true

  C5_no_semantic_or_routing_write:
    description: >
      ISc must not modify semantic meaning, routing metadata, identity fields, or cue semantics.
    enforced: true

  C6_conflict_detection_rules:
    description: >
      score_conflict must reflect deterministic conflict rules over candidate_set{}.
    enforced: true

  C7_replay_determinism:
    description: >
      ISc must produce identical scoring geometry under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_ce_envelope
    - validate_candidate_set
    - check_closed_envelope
    - extract_candidate_features
    - apply_truth_hypotheses_prc
    - compute_score_set
    - compute_score_conflict
    - compute_score_reason_code
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  score_ready:
    conditions:
      - score_set >= 0.0
  conflict_detected:
    conditions:
      - score_conflict > 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_score_fields:
    triggers:
      - score_set or score_conflict or score_reason_code missing
  replay_inconsistency:
    triggers:
      - replay produces non-identical scoring geometry
  inadmissible_source:
    triggers:
      - envelope not from CE + candidate_set{}

routing:
  admissible_inputs:
    - CE
    - candidate_set
  admissible_outputs:
    - TPU
    - TR
  description: >
    ISc produces deterministic scoring fields consumed by TPU (merge) and TR (routing).
    ISc performs no routing transitions.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - ce_reference
    - candidate_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_inference_flow
    - path_a_routing_flow

psc_alignment:
  - ISc satisfies PSC scoring-object requirements.
  - ISc exposes deterministic scoring geometry for replay validation.
  - ISc aligns with CE, candidate_set{}, TPU, and TR.
  - ISc enforces admissible scoring-envelope constraints.
