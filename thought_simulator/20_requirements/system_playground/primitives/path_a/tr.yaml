primitive_name: TR
primitive_family: path_a
reference_type: tr_reference
version: 1.0.0

description: >
  TR (Thought Router) is the Path-A primitive responsible for computing the
  deterministic routing metadata TP.TR from OB, DCB, and ISc scoring outputs.
  TR performs no semantic interpretation, no basin selection, no correction,
  and no truth evaluation. Its sole job is to compute the canonical routing
  vector TP.TR and write it atomically into the TP snapshot. TR is strictly
  deterministic and replay-stable.

runtime_behavior:
  mode: routing_metadata_computation
  semantic_interpretation: none
  routing_computation: metadata_only
  basin_selection: none
  correction_application: none
  truth_evaluation: none
  tp_write: tr_update_only
  replay_behavior: deterministic

inputs:
  required:
    - ob_envelope
    - dcb_envelope
    - isc_envelope
  optional:
    - cue_vector
    - semantic_adjacent_vector
    - routing_candidate_vector
    - routing_ce_vector

outputs:
  envelope_type: tr_routing_envelope
  fields:
    scalar_fields:
      - stance
      - intent
      - affect
      - epistemic_shading
      - tension
      - politeness
      - commitment
      - reservation
      - logical_structure
      - semantic_deltaH
      - lineage_additions
      - routing_semantics
    vector_fields:
      - tr_vector
      - cue_vector
      - semantic_adjacent_vector
      - routing_candidate_vector
      - routing_ce_vector
  tp_update_fields:
    - tr_update
  status_flags:
    - tr_ready
    - tr_applied

invariants:
  ob_required: true
  dcb_required: true
  isc_required: true
  deterministic_tr_required: true
  no_semantic_construction: true
  no_basin_selection: true
  no_truth_evaluation: true
  no_correction: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required OB, DCB, and ISc fields must be present; TR may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All routing metadata fields must match expected structural shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar routing fields must remain within declared bounds.
    enforced: true

  C4_metadata_determinism:
    description: >
      TP.TR must be stable, canonical, and identical under replay.
    enforced: true

  C5_no_semantic_or_truth:
    description: >
      TR must not modify semantic meaning, truth fields, identity fields,
      or cue semantics.
    enforced: true

  C6_no_basin_selection:
    description: >
      TR must not select the next basin; RB is the sole routing arbiter.
    enforced: true

  C7_atomic_tp_write:
    description: >
      TR must write TP.TR atomically and deterministically.
    enforced: true

evaluation_logic:
  steps:
    - validate_ob_envelope
    - validate_dcb_envelope
    - validate_isc_envelope
    - extract_routing_inputs
    - compute_routing_metadata_fields
    - assemble_tr_vector
    - compute_scalar_fields
    - compute_vector_fields
    - generate_tr_update
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  tr_ready:
    conditions:
      - stance >= 0.0
      - intent >= 0.0
  tr_applied:
    conditions:
      - routing_semantics >= 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_required_inputs:
    triggers:
      - OB, DCB, or ISc envelope missing
  replay_inconsistency:
    triggers:
      - replay produces non-identical TR geometry
  inadmissible_source:
    triggers:
      - envelope not from OB/DCB/ISc

routing:
  admissible_inputs:
    - OB
    - DCB
    - ISc
  admissible_outputs:
    - TPU
  description: >
    TR computes TP.TR and hands control to TPU. TR performs no routing transitions.

dependencies:
  dictionaries:
    - routing_dictionary
    - runtime_dictionary
  reference_objects:
    - ob_reference
    - dcb_reference
    - isc_reference
    - boundary_reference
    - routing_reference
  flow_contracts:
    - path_a_routing_flow

psc_alignment:
  - TR satisfies PSC routing-metadata object requirements.
  - TR exposes deterministic routing geometry for replay validation.
  - TR aligns with OB, DCB, ISc, and TPU.
  - TR enforces admissible routing-metadata envelope constraints.
