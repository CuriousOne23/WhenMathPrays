primitive_name: RBU
primitive_family: path_a
reference_type: rbu_reference
version: 1.0.0

description: >
  RBU (Routing Boundary Updater) is the Path-A primitive responsible for writing
  interpretive metadata into the TP before RB-prm performs routing arbitration.
  RBU computes no routing, performs no semantic interpretation, and does not
  modify routing_metadata. Its sole job is to emit deterministic TP.rbu_update
  based on IdOB-conditioned interpretive cues.

runtime_behavior:
  mode: interpretive_metadata_commit
  semantic_interpretation: none
  routing_computation: none
  truth_evaluation: none
  tp_write: rbu_update_only
  replay_behavior: deterministic

inputs:
  required:
    - idob_output_snapshot
  optional:
    - identity_vector
    - semantic_adjacent_vector
    - interpretive_context_vector

outputs:
  envelope_type: rbu_commit_envelope
  fields:
    scalar_fields:
      - interpretive_activation
      - interpretive_magnitude
      - basin_strength
    vector_fields:
      - identity_vector
      - interpretive_vector
      - semantic_adjacent_vector
  tp_update_fields:
    - rbu_update
  status_flags:
    - rbu_ready
    - stabilized

invariants:
  idob_snapshot_required: true
  deterministic_update_required: true
  no_routing_computation: true
  no_routing_metadata_write: true
  no_truth_evaluation: true
  no_semantic_construction: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required IdOB fields must be present; RBU may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All identity and interpretive fields must match expected shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_interpretive_monotonicity:
    description: >
      interpretive_magnitude must reflect deterministic interpretive rules and may
      not decrease when upstream interpretive cues increase.
    enforced: true

  C5_no_routing_or_truth:
    description: >
      RBU must not modify routing metadata, truth fields, ΔH%, lineage, or TR-input.
    enforced: true

  C6_basin_locality:
    description: >
      RBU must apply only basin-local interpretive rules; no global semantic normalization.
    enforced: true

  C7_replay_determinism:
    description: >
      RBU must produce identical TP.rbu_update under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_idob_snapshot
    - extract_identity_context
    - compute_interpretive_vector
    - compute_scalar_fields
    - compute_vector_fields
    - generate_rbu_update
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  rbu_ready:
    conditions:
      - interpretive_activation >= 0.0
      - interpretive_magnitude >= 0.0
  stabilized:
    conditions:
      - basin_strength > 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_idob_snapshot:
    triggers:
      - IdOB output absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical interpretive geometry
  inadmissible_source:
    triggers:
      - envelope not from IdOB

routing:
  admissible_inputs:
    - IdOB
  admissible_outputs:
    - RB
  description: >
    RBU emits TP.rbu_update consumed by RB-prm. RBU performs no routing transitions.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - idob_reference
    - rb_reference
    - boundary_reference
    - identity_reference
    - semantic_reference
  flow_contracts:
    - path_a_routing_flow

psc_alignment:
  - RBU satisfies PSC interpretive-metadata object requirements.
  - RBU exposes deterministic interpretive geometry for replay validation.
  - RBU aligns with IdOB and RB-prm.
  - RBU enforces admissible interpretive-commit envelope constraints.
