primitive_name: RTU
primitive_family: path_a
reference_type: rtu_reference
version: 1.0.0

description: >
  RTU (Routing TP Update) is the Path-A primitive responsible for committing
  routing-layer metadata into the TP snapshot after RB routing arbitration.
  RTU performs no routing computation, no semantic interpretation, and no
  truth evaluation. Its sole job is to validate the routing envelope and
  emit deterministic TP.rtu_update. RTU runs once per routing cycle in the
  RB→RTU→IdOB loop.

runtime_behavior:
  mode: routing_metadata_commit
  semantic_interpretation: none
  routing_computation: none
  truth_evaluation: none
  tp_write: rtu_update_only
  replay_behavior: deterministic

inputs:
  required:
    - rb_routing_envelope
  optional:
    - routing_lineage_vector
    - routing_reason_vector
    - lane_activation_vector
    - lane_suppression_vector

outputs:
  envelope_type: routing_update_envelope
  fields:
    scalar_fields:
      - routing_confidence
      - routing_error
      - routing_reason_code
      - lane_activation_strength
      - lane_suppression_strength
    vector_fields:
      - routing_lineage_vector
      - routing_reason_vector
      - lane_activation_vector
      - lane_suppression_vector
  tp_update_fields:
    - rtu_update
  status_flags:
    - routing_update_ready
    - routing_validated

invariants:
  rb_envelope_required: true
  deterministic_update_required: true
  no_routing_computation: true
  no_semantic_or_truth: true
  no_tp_tr_write: true
  no_identity_write: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required RB routing fields must be present; RTU may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All routing vectors must match expected structural shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector routing fields must remain within declared bounds.
    enforced: true

  C4_routing_validation:
    description: >
      RTU must validate routing metadata for determinism, envelope admissibility,
      and replay consistency.
    enforced: true

  C5_no_semantic_or_truth:
    description: >
      RTU must not modify semantic meaning, truth fields, identity fields,
      or cue semantics.
    enforced: true

  C6_no_routing_computation:
    description: >
      RTU must not compute routing decisions; RB is the sole routing arbiter.
    enforced: true

  C7_replay_determinism:
    description: >
      RTU must produce identical TP.rtu_update under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_rb_envelope
    - validate_routing_vectors
    - compute_scalar_fields
    - compute_vector_fields
    - generate_rtu_update
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  routing_update_ready:
    conditions:
      - routing_confidence >= 0.0
  routing_validated:
    conditions:
      - routing_error == 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_rb_envelope:
    triggers:
      - RB routing envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical routing update geometry
  inadmissible_source:
    triggers:
      - envelope not from RB

routing:
  admissible_inputs:
    - RB
  admissible_outputs:
    - IdOB
  description: >
    RTU commits routing metadata into TP and hands control to IdOB. RTU performs
    no routing transitions; RB is the sole routing primitive.

dependencies:
  dictionaries:
    - routing_dictionary
    - runtime_dictionary
  reference_objects:
    - rb_reference
    - idob_reference
    - boundary_reference
    - routing_reference
  flow_contracts:
    - path_a_routing_flow

psc_alignment:
  - RTU satisfies PSC routing-update object requirements.
  - RTU exposes deterministic routing-update geometry for replay validation.
  - RTU aligns with RB and IdOB.
  - RTU enforces admissible routing-update envelope constraints.
