primitive_name: CEx
primitive_family: path_a
reference_type: cex_reference
version: 1.0.0

description: >
  CEx (Context Extractor) is a deterministic Path-A primitive that extracts
  correction-adjacent context features from CE envelopes. CEx performs no
  correction, no semantic interpretation, no routing, and no truth evaluation.
  Its sole job is to read CE output, extract context features, and produce the
  correction-expansion envelope consumed by CE (Evaluation) and ISc.

runtime_behavior:
  mode: extract_context_features
  correction_application: none
  semantic_interpretation: none
  routing_computation: none
  truth_evaluation: none
  replay_behavior: deterministic

inputs:
  required:
    - ce_envelope
  optional:
    - semantic_vector
    - routing_vector
    - cue_vector

outputs:
  envelope_type: correction_expansion_envelope
  fields:
    scalar_fields:
      - context_stability
      - cue_coherence
      - degradation_level
      - neutrality_level
    vector_fields:
      - context_vector
      - semantic_vector
      - routing_vector
      - cue_vector
  status_flags:
    - context_ready
    - degraded

invariants:
  envelope_must_be_closed: true
  semantic_vector_required: true
  routing_vector_required: true
  cue_vector_required: true
  neutrality_preserved: true
  no_correction_allowed: true
  no_semantic_modification: true
  replay_stability_required: true

constraint_families:
  C1_slot_presence:
    description: >
      All required structural slots must be present; CEx may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All slots must match expected structural shapes; CEx performs no plausibility checks.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_neutrality_preservation:
    description: >
      neutrality_level must remain unchanged; CEx may not alter neutrality.
    enforced: true

  C5_no_correction:
    description: >
      CEx must not apply correction or modify correction-level fields.
    enforced: true

  C6_alignment_rules:
    description: >
      semantic_vector and routing_vector must remain aligned according to manifold rules.
    enforced: true

  C7_replay_determinism:
    description: >
      CEx must produce identical envelopes under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_required_vectors
    - check_closed_envelope
    - verify_neutrality_preservation
    - extract_context_features
    - compute_scalar_fields
    - compute_vector_fields
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  context_ready:
    conditions:
      - neutrality_level == 1.0
      - context_stability >= 0.0
      - cue_coherence >= 0.0
  degraded:
    conditions:
      - degradation_level > 0.2

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  replay_inconsistency:
    triggers:
      - replay produces non-identical envelopes
  inadmissible_source:
    triggers:
      - envelope not from CE

routing:
  admissible_inputs:
    - CE
  admissible_outputs:
    - CE   # CE (Evaluation) consumes CEx output
    - ISc
  description: >
    CEx extracts context features and produces the correction-expansion envelope
    consumed by CE (Evaluation) and ISc. CEx performs no routing transitions.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - ce_reference
    - cnob_reference
    - boundary_reference
    - semantic_reference
    - routing_reference
    - structure_reference
  flow_contracts:
    - path_a_inference_flow
    - path_a_corrected_flow

psc_alignment:
  - CEx satisfies PSC context-extraction object requirements.
  - CEx exposes deterministic geometry for replay validation.
  - CEx aligns with CE, candidate_set{}, and ISc.
  - CEx enforces admissible correction-expansion envelope constraints.
