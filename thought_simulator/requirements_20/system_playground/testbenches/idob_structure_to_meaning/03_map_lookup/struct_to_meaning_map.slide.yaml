# Map: card_id -> legal group_ids (a SET written as a list).
# List order is NOT rank. Group_id digits are names, not coordinates.
# Empty list is legal (no birth from this road).
# This revision keys by card_id so Slide 03 can run before live hashing.
# Theory key: structural_key -> group_ids.
struct_to_meaning_map:
  - card_id: S_rock_burst
    meaning_group_candidates: [1001, 3001, 5001]
  - card_id: S_deadline_friday
    meaning_group_candidates: [3001]
  - card_id: S_sleepy
    meaning_group_candidates: [4001]
  - card_id: S_unmapped
    meaning_group_candidates: []
