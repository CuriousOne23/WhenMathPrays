# Official packet this revision. Same keys every run (replay).
# Nulls are legal. Do not invent missing values as 0 unless the field is a vector after birth.
idob_packet:
  card_id: string_or_null
  utterance: string_or_null
  packs_loaded: [string]
  assignment_status: assigned | partial | unassigned | card_given | null
  semantic_field_id: int_or_null
  semantic_role_id: int_or_null
  semantic_object_id: int_or_null
  gradient_id: int_or_null
  universe_id: int_or_null
  subfield_id: int_or_null
  structural_key: string_or_null
  residue_code: string_or_null
  feature_tags: [string]
  candidate_group_ids: [int]
  final_rank_order: [int]
  selected_group_id: int_or_null
  cie_id: string_or_null
  meaning_semantics:            # M0; null if no birth
    physicality: float
    sociality: float
    temporality: float
    intentionality: float
    materiality: float
    spatiality: float
  meaning_semantics_prime:     # M'; null if no birth
    physicality: float
    sociality: float
    temporality: float
    intentionality: float
    materiality: float
    spatiality: float
  meaning_delta_h: float_or_null
  identity_delta: float_or_null
  refinement_cycles: int
  resolution_status: string
  ready_for_ouba: bool
  expand_target: string_or_null
  next_key: null               # never invented here
