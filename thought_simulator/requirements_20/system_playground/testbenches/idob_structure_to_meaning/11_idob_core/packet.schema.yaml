# Official packet this revision. Same keys every run (replay).
# Nulls are legal. Do not invent missing values as 0 unless the field is a vector after birth.
idob_packet:
  card_id: string_or_null
  utterance: string_or_null
  packs_loaded: [string]
  assignment_status: assigned | partial | unassigned | card_given | null
  semantic_field_id: int_or_null
  semantic_role_id: int_or_null
  semantic_object_id: int_or_null
  gradient_id: int_or_null
  universe_id: int_or_null
  subfield_id: int_or_null
  structural_key: string_or_null
  residue_code: string_or_null          # card leftover (Slide 10). Not identity_residual.
  feature_tags: [string]
  candidate_group_ids: [int]
  final_rank_order: [int]
  selected_group_id: int_or_null
  cie_id: string_or_null
  first_meaning_cycle: bool            # no prior M; m_before is zeros
  meaning_semantics_before:            # prior M or zeros on first pass; null if no birth
    physicality: float
    sociality: float
    temporality: float
    intentionality: float
    materiality: float
    spatiality: float
  meaning_semantics:                   # M0 prototype; null if no birth
    physicality: float
    sociality: float
    temporality: float
    intentionality: float
    materiality: float
    spatiality: float
  meaning_semantics_prime:             # M' after CIE; null if no birth
    physicality: float
    sociality: float
    temporality: float
    intentionality: float
    materiality: float
    spatiality: float
  meaning_delta_h: float_or_null       # ||M' - meaning_semantics_before||_2
  meaning_cie_delta: float_or_null     # ||M' - M0||_2 (CIE shove only)
  identity_delta: float_or_null        # ||alpha I||_2
  identity_residual:                   # hold messiness; not residue_code
    magnitude: none | small | medium | large
    pattern: none | collapsed | leftover | empty_map | unassigned
  hold_geometry: string_or_null        # lifecycle of the hold, NOT a meaning axis. Default formation on birth.
  refinement_cycles: int
  resolution_status: string
  ready_for_ouba: bool                 # a group was selected (birth happened)
  idob_complete: bool                  # this hop may leave IdOB (stricter than birth)
  path_b_eligible: bool                # Path B may look; not RB routing
  routing_filter_mutated: bool         # write-boundary diagnostic; must stay false
  expand_target: string_or_null
  next_key: null                       # never invented here
