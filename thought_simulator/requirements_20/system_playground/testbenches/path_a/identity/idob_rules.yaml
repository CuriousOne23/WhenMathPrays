# IdOB Rules — structure-to-meaning hop (primitives/idob).
# Derivation: Path A structure-to-meaning architecture (two geometries, door, rank, CIE, Δh).
# Lifecycle envelope cases: idob_lifecycle_archive.yaml — do not enable on this runner.

primitive: IdOB
version: "s2m"

rules:
  - id: idob_output_001
    description: IdOB must produce an output TP for the given input.
    check: deterministic_output_present

  - id: idob_utterance_001
    description: Test reference must keep the utterance (or explicit card-only source).
    check: utterance_reference_present

  - id: idob_packet_001
    description: Output must contain tp.idob packet with official keys.
    check: packet_present

  - id: idob_write_boundary_001
    description: IdOB must not mutate process.routing_filter or DCB geometric_state.
    check: no_routing_or_dcb_writes

  - id: idob_no_structural_001
    description: IdOB must not produce structural residue or modify SSG fields.
    check: no_structural_writes

  - id: idob_rank_map_001
    description: Rank order must be a subset of map candidates.
    check: rank_subset_of_map

  - id: idob_key_stable_001
    description: Packet structural_key must match input key when both exist.
    check: key_not_invented_from_cie

  - id: idob_flags_001
    description: ready_for_ouba, path_b_eligible, idob_complete must be bool.
    check: completion_flags_bool
