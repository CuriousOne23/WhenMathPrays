# IdOB Testbench — structure-to-meaning (primitives/idob/idob.py).
# Every case records utterance with input and expected packet fields.
# Lifecycle formation..closure: idob_lifecycle_archive.yaml (do not enable here).

tests:
  - id: idob_s2m_01_rock
    enabled: true
    description: Rock burst — birth with leftover residue
    utterance: "The rock burst open."
    utterance_source: card_note
    input:
      utterance: "The rock burst open."
      card_id: S_rock_burst
      cie_id: physical_stance
    expected:
      resolution_status: one_pass_complete
      selected_group_id: 1001
      ready_for_ouba: true
      path_b_eligible: false
      idob_complete: false
      residue_code: static_object_vs_dynamic_action
      first_meaning_cycle: true

  - id: idob_s2m_02_deadline
    enabled: true
    description: Deadline Friday — one candidate, no card residue
    utterance: "The project deadline is Friday."
    utterance_source: card_note
    input:
      utterance: "The project deadline is Friday."
      card_id: S_deadline_friday
      cie_id: neutral
    expected:
      selected_group_id: 3001
      ready_for_ouba: true
      path_b_eligible: true
      residue_code: null

  - id: idob_s2m_03_sleepy
    enabled: true
    description: Sleepy — biological condition group
    utterance: "Biological-condition shaped geometry (toy)."
    utterance_source: card_note
    input:
      utterance: "I am sleepy."
      card_id: S_sleepy
      cie_id: neutral
    expected:
      selected_group_id: 4001
      ready_for_ouba: true
      path_b_eligible: true
      residue_code: null

  - id: idob_s2m_04_unmapped
    enabled: true
    description: Geometry with empty candidate set
    utterance: "Geometry with no meaning-group candidates."
    utterance_source: card_note
    input:
      utterance: "zzzz unmapped geometry"
      card_id: S_unmapped
      cie_id: neutral
    expected:
      resolution_status: empty_map
      selected_group_id: null
      ready_for_ouba: false
      path_b_eligible: false
      meaning_semantics: null

  - id: idob_s2m_05_miss
    enabled: true
    description: Utterance miss — still recorded, no key
    utterance: "zzzzq no cue at all"
    utterance_source: input
    input:
      utterance: "zzzzq no cue at all"
      packs_loaded: [base_en]
      cie_id: neutral
    expected:
      resolution_status: unassigned
      structural_key: null
      selected_group_id: null
      ready_for_ouba: false

  - id: idob_s2m_06_write_boundary
    enabled: true
    description: routing_filter must survive IdOB
    utterance: "The project deadline is Friday."
    utterance_source: input
    input:
      utterance: "The project deadline is Friday."
      card_id: S_deadline_friday
      cie_id: neutral
      process:
        routing_filter:
          keep: true
    expected:
      selected_group_id: 3001
      routing_filter_unchanged: true
