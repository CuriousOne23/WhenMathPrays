          topic: missing
          stance: neutral
          intent: test
          continuity: new
          direction: forward
          coherence: stable
          importance: low
      _rb_foundation:
        enable_red: true
        timestamp: 1010.0
    expected:
      selected_ob_ids: [ob_a]
      adjacency_class: null
      regime_hint: null
      displacement_scale: null

  - id: rb_messy_partial_metadata
    description: Partial routing_metadata; no candidate_obs; no invented semantics
    enabled: true
    input:
      tr_needs_update: false
      process:
        deltaH: 0.0
        routing_metadata:
          core_id: core_0
      metadata:
        context:
          topic: messy
          stance: "???"
          intent: test
          continuity: unknown
          direction: forward
          coherence: noisy
          importance: low
    expected:
      selected_ob_ids: []
      rationale_contains: no_core_local_obs
      tr_gate_rationale_contains: tr_gate:false

  - id: rb_merge_split_exposure
