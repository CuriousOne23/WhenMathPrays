      tr_needs_update: false
      TR:
        version: 7
        committed: true
        note: do_not_touch
      semantic:
        identity:
          persona: locked
        idob:
          roles: [locked]
      process:
        deltaH: 0.02
        routing_metadata:
          core_id: core_0
          orthogonality_signature: A
          candidate_obs:
            - { ob_id: ob_a, core_id: core_0, orthogonality_signature: A }
      metadata:
        geometric_state:
          position: 7
          direction: 8
          curvature: 0.0
          step_index: 3
          lane_id: 0
        residue:
          marker: locked
        context:
          topic: boundary
          stance: neutral
          intent: test
          continuity: same
          direction: forward
          coherence: stable
          importance: high
    expected:
      selected_ob_ids: [ob_a]
      check_tr_unchanged: true
      check_write_boundary: true
      check_idob_view_unchanged: true

  - id: rb_regime_refinement
