        context:
          topic: idob
          stance: neutral
          intent: test
          continuity: same
          direction: forward
          coherence: stable
          importance: medium
      _rb_foundation:
        enable_red: true
        I_stab: 0.8
        R_res: 0.7
        P_cont: 0.6
        Rt_adj: 0.2
        delta_H: 0.05
    expected:
