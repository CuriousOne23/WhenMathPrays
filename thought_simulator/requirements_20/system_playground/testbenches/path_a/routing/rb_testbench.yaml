          policy:
            allow_merge: true
            allow_split: true
          candidate_obs:
            - { ob_id: ob_a, core_id: core_0, orthogonality_signature: A }
      metadata:
        context:
          topic: merge
          stance: neutral
          intent: test
          continuity: same
          direction: forward
          coherence: stable
          importance: medium
    expected:
      selected_ob_ids: [ob_a]
      merge_eligibility: true
      split_directive: true

  - id: rb_write_boundary_explicit
