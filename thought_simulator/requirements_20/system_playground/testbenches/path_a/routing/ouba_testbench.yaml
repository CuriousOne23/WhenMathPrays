# ============================================================
# OuBA Testbench (v0.1) - Deterministic commit/freeze cases
# Structural subset comparison in testbench mode.
# ============================================================

tests:
  - id: ouba_commit_minimal
    description: Deterministic minimal commit with full required fields.
    enabled: true
    input:
      _ouba_commit_context:
        commit_timestamp: 1800000001.0
      semantic:
        semantic_core:
          summary: "user asks for migration path"
          stability: 0.91
        semantic_tags: ["migration", "privacy"]
        lane_local_identity:
          mode: "technical_user"
          context: "os_migration"
      proposition_set:
        - "The user is evaluating migration options."
      truth_evidence:
        - type: support
          detail: "explicit preference stated"
      completion_state: complete
      messy_input_record:
        - "one unresolved pronoun"
      delta_h_percent: 0.2
      ob_trace: ["OB.lexical_parse"]
      tb_trace: ["TB.contextual_alignment"]
      policy_markers: ["policy.safe_completion_required"]
      next_context:
        topic: "os_migration"
        stance: "neutral"
        intent: "informational"
        register: "technical"
        politeness: "neutral"
        epistemic_shading: "qualified"
        continuity: "maintain"
        direction: "next"
        coherence: true
        shift_required: false
        importance: 0.7
        clarifying_fields: ["distribution"]
      lineage_log: ["turn_14.identity_shift"]
      cob_state_snapshot:
        identity_mode: "technical_user"
      sob_id: "sob_01"
      srob_id: "srob_01"
      cnob_id: "cnob_01"
      smob_id: "smob_01"
      idob_id: "idob_01"
      routing_path: ["dcb", "rb", "tr", "idob"]
      ruleset_ids: ["rules.path_a.v3"]
      metadata:
        contextual_alignment_record:
          alignment: "high"
        identity_shift_record:
          changed: false
        topic_anchor_record:
          anchor: "os_migration"
        continuity_record:
          state: "maintained"
        intent_record:
          final_intent: "informational"
        entropy_history: [0.4, 0.5, 0.6]
        signature_history: ["sig_001", "sig_002"]
    expected:
      expect_ouba_complete: true
      ctp_equals_tpsns: true
      tpsns:
        commit_timestamp: 1800000001.0
        semantic_core:
          summary: "user asks for migration path"
          stability: 0.91
        proposition_set:
          - "The user is evaluating migration options."
        completion_state: complete
        semantic_tags: ["migration", "privacy"]
        lane_local_identity:
          mode: "technical_user"
          context: "os_migration"
        next_context:
          topic: "os_migration"
          stance: "neutral"

  - id: ouba_boundary_preservation
    description: OuBA must not mutate TR, routing_filter, or DCB geometry metadata.
    enabled: true
    input:
      _ouba_commit_context:
        commit_timestamp: 1800000002.0
      TR:
        stance: neutral
        intent: inform
      process:
        routing_filter:
          selected_ob_ids: ["ob_locked"]
          regime_hint: Stable
      semantic:
        semantic_core:
          summary: "boundary fixture"
          stability: 0.88
        semantic_tags: ["boundary"]
        lane_local_identity:
          mode: "technical_user"
      proposition_set: ["Boundary conditions persist."]
      truth_evidence:
        - type: support
          detail: "fixture statement"
      completion_state: complete
      messy_input_record: []
      delta_h_percent: 0.1
      ob_trace: ["OB.base"]
      tb_trace: ["TB.base"]
      policy_markers: ["policy.none"]
      next_context:
        topic: "boundary"
        stance: "neutral"
        intent: "informational"
        register: "technical"
        politeness: "neutral"
        epistemic_shading: "stable"
        continuity: "maintain"
        direction: "next"
        coherence: true
        shift_required: false
        importance: 0.5
        clarifying_fields: []
      lineage_log: []
      cob_state_snapshot:
        identity_mode: "technical_user"
      sob_id: "sob_02"
      srob_id: "srob_02"
      cnob_id: "cnob_02"
      smob_id: "smob_02"
      idob_id: "idob_02"
      routing_path: ["dcb", "rb", "tr", "idob"]
      ruleset_ids: ["rules.path_a.v3"]
      metadata:
        geometric_state:
          position: 3
          direction: 4
          curvature: 0.0
        geometric_history:
          - position: 2
            direction: 3
            curvature: 0.0
            cycle_id: 3
        residue:
          marker: locked
        contextual_alignment_record: {alignment: "high"}
        identity_shift_record: {changed: false}
        topic_anchor_record: {anchor: "boundary"}
        continuity_record: {state: "maintained"}
        intent_record: {final_intent: "informational"}
        entropy_history: [0.2, 0.3]
        signature_history: ["sig_a"]
    expected:
      expect_ouba_complete: true
      ctp_equals_tpsns: true
      check_write_boundary: true
      tpsns:
        commit_timestamp: 1800000002.0
        completion_state: complete

  - id: ouba_replay_identical
