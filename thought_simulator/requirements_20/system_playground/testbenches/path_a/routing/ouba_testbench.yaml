      semantic:
        semantic_core: {summary: "replay test", stability: 0.95}
        semantic_tags: ["replay"]
        lane_local_identity: {mode: "technical_user"}
      proposition_set: ["Replay deterministic."]
      truth_evidence: [{type: support, detail: "fixture"}]
      completion_state: complete
      messy_input_record: []
      delta_h_percent: 0.05
      ob_trace: ["OB.replay"]
      tb_trace: ["TB.replay"]
      policy_markers: ["policy.none"]
      next_context:
        topic: "replay"
        stance: "neutral"
        intent: "informational"
        register: "technical"
        politeness: "neutral"
        epistemic_shading: "stable"
        continuity: "maintain"
        direction: "next"
        coherence: true
        shift_required: false
        importance: 0.4
        clarifying_fields: []
      lineage_log: ["turn_1"]
      cob_state_snapshot: {identity_mode: "technical_user"}
      sob_id: "sob_03"
      srob_id: "srob_03"
      cnob_id: "cnob_03"
      smob_id: "smob_03"
      idob_id: "idob_03"
      routing_path: ["dcb", "rb", "tr", "idob"]
      ruleset_ids: ["rules.path_a.v3"]
      metadata:
        contextual_alignment_record: {alignment: "high"}
        identity_shift_record: {changed: false}
        topic_anchor_record: {anchor: "replay"}
        continuity_record: {state: "maintained"}
        intent_record: {final_intent: "informational"}
        entropy_history: [0.1]
        signature_history: ["sig_replay"]
    expected:
      expect_ouba_complete: true
      ctp_equals_tpsns: true
      check_replay: true
      tpsns:
        commit_timestamp: 1800000003.0
        completion_state: complete

