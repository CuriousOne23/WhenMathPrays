# ============================================================
#  SOB Testbench (Version 1.1)
# ============================================================
# Path-A Structural OB (SOB) — deterministic testbench mode
# Source of truth for exact input → expected output comparison
# Aligned with:
#   - 20.40.010_sob_prim.md
#   - progressive_lineup_testing.md (v4.0)
#   - sob.py v1.1 (operator-gated morphology)
#   - sob dictionaries (domains/tones/constraints/operators)
# ============================================================

mode: testbench
primitive: SOB
version: "1.1"

metadata:
  description: >
    Validates SOB structural segmentation, modality classification,
    operator/domain/tone/constraint hint extraction, operator-gated
    morphology normalization, sob_structural_map / sob_residue /
    sob_audit_record production, read-only discipline on upstream
    envelopes, and deterministic replay behavior.
  upstream:
    - TPU
    - CE
    - CEx
  passthrough_allowed: false
  progressive_lineup_compatible: true
  dictionaries_required:
    - sob_dictionary.yaml
    - sob_operators.yaml
    - sob_markers.yaml
    - sob_punctuation.yaml
    - sob_domains.yaml
    - sob_tones.yaml
    - sob_constraints.yaml
    - sob_morphology.yaml

tests:

  # ------------------------------------------------------------
  # 1. Happy-path structural segmentation + domain residue
  # ------------------------------------------------------------
  - id: sob_test_001
    description: >
      Declarative sentence. "system" hits technical_like domain marker.
      No operator morphology (operator-gated). No operators.
    input:
      tp_identity:
        tp_id: "tp_sob_test_001"
        tp_seq: 1
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: "The system processes the input deterministically."

      metadata:
        context:
          context_fields:
            topic: "system_behavior"
            stance: "neutral"
            intent: "inform"
            register: "technical"
            politeness: "medium"
            tone: "neutral"
            continuity: "moderate"
            direction: "forward"
            coherence: "medium"
            importance: "normal"
            clarifying_fields: []
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c001"]
        msl: {}
        semantic_residue: {}

    expected:
      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "The system processes the input deterministically."
              type: sentence
              modality: declarative
          operators: []
          lexical_domains:
            - "technical_like"
          lexical_tones:
            - "neutral"
          lexical_constraints: []
          morphology_flags: []
        sob_residue:
          lexical_tags:
            - domain: "technical_like"
          structural_adjacent:
            - modality: declarative
          override_flags: []
          disagreement_flags: []

  # ------------------------------------------------------------
  # 2. Interrogative modality + operator hint
  # ------------------------------------------------------------
  - id: sob_test_002
    description: >
      Interrogative sentence with operator verb "explain".
      No morphology (surface form already canonical).
    input:
      tp_identity:
        tp_id: "tp_sob_test_002"
        tp_seq: 2
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: "Can you explain the routing decision?"

      metadata:
        context:
          context_fields:
            topic: "routing"
            stance: "neutral"
            intent: "clarify"
            register: "casual"
            politeness: "medium"
            tone: "neutral"
            continuity: "moderate"
            direction: "forward"
            coherence: "medium"
            importance: "normal"
            clarifying_fields: []
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c002"]

    expected:
      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "Can you explain the routing decision?"
              type: sentence
              modality: interrogative
          operators:
            - verb: "explain"
              normalized: "explain"
              source: "lexical"
          lexical_domains: []
          lexical_tones:
            - "neutral"
          lexical_constraints: []
          morphology_flags: []
        sob_residue:
          lexical_tags:
            - operator: "explain"
          structural_adjacent:
            - modality: interrogative
          override_flags: []
          disagreement_flags: []

  # ------------------------------------------------------------
  # 3. Morphology normalization (operator + suffix)
  # ------------------------------------------------------------
  - id: sob_test_003
    description: >
      "summarizing" normalizes via explicit_map to "summarize".
      "please" also fires domain/tone/constraint markers.
    input:
      tp_identity:
        tp_id: "tp_sob_test_003"
        tp_seq: 3
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: "Please start summarizing the previous turn."

      metadata:
        context:
          context_fields:
            topic: "summarization"
            stance: "neutral"
            intent: "request"
            register: "casual"
            politeness: "medium"
            tone: "neutral"
            continuity: "moderate"
            direction: "forward"
            coherence: "medium"
            importance: "normal"
            clarifying_fields: []
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c003"]

    expected:
      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "Please start summarizing the previous turn."
              type: sentence
              modality: imperative
          operators:
            - verb: "summarizing"
              normalized: "summarize"
              source: "morphology"
          lexical_domains:
            - "conversational_like"
          lexical_tones:
            - "supportive"
          lexical_constraints:
            - "politeness"
          morphology_flags:
            - "summarizing→summarize"
        sob_residue:
          lexical_tags:
            - operator: "summarize"
            - domain: "conversational_like"
            - tone: "supportive"
            - constraint: "politeness"
          structural_adjacent:
            - modality: imperative
          override_flags: []
          disagreement_flags: []

  # ------------------------------------------------------------
  # 4. Domain + tone + constraint hints (rich lexical hits)
  # ------------------------------------------------------------
  - id: sob_test_004
    description: >
      "please" → conversational/supportive/politeness;
      "function" → code_like; "parameter" → technical_like + technical;
      "precise" → precision; "implement" → operator.
    input:
      tp_identity:
        tp_id: "tp_sob_test_004"
        tp_seq: 4
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: "Please implement the function with precise parameter checking."

      metadata:
        context:
          context_fields:
            topic: "implementation"
            stance: "neutral"
            intent: "request"
            register: "technical"
            politeness: "medium"
            tone: "technical"
            continuity: "moderate"
            direction: "forward"
            coherence: "medium"
            importance: "normal"
            clarifying_fields: []
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c004"]

    expected:
      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "Please implement the function with precise parameter checking."
              type: sentence
              modality: imperative
          operators:
            - verb: "implement"
              normalized: "implement"
              source: "lexical"
          lexical_domains:
            - "conversational_like"
            - "code_like"
            - "technical_like"
          lexical_tones:
            - "supportive"
            - "technical"
          lexical_constraints:
            - "politeness"
            - "precision"
          morphology_flags: []
        sob_residue:
          lexical_tags:
            - operator: "implement"
            - domain: "conversational_like"
            - domain: "code_like"
            - domain: "technical_like"
            - tone: "supportive"
            - tone: "technical"
            - constraint: "politeness"
            - constraint: "precision"
          structural_adjacent:
            - modality: imperative
          override_flags: []
          disagreement_flags: []

  # ------------------------------------------------------------
  # 5. Boundary discipline — upstream envelopes unchanged
  # ------------------------------------------------------------
  - id: sob_test_005
    description: >
      context_fields / MSL must remain byte-identical. Only SOB-owned
      fields written. No dictionary hits on this sentence.
    input:
      tp_identity:
        tp_id: "tp_sob_test_005"
        tp_seq: 5
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: "The referent remains stable across turns."

      metadata:
        context:
          context_fields:
            topic: "identity"
            stance: "neutral"
            intent: "inform"
            register: "technical"
            politeness: "medium"
            tone: "neutral"
            continuity: "strong"
            direction: "forward"
            coherence: "high"
            importance: "high"
            clarifying_fields: ["referent"]
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c005"]
        msl:
          qualifiers: ["stable"]
          stance: "neutral"
          direction: "forward"
          coherence: "high"
        semantic_residue:
          entities: []
          facts: []

    expected:
      metadata:
        context:
          context_fields:
            topic: "identity"
            stance: "neutral"
            intent: "inform"
            register: "technical"
            politeness: "medium"
            tone: "neutral"
            continuity: "strong"
            direction: "forward"
            coherence: "high"
            importance: "high"
            clarifying_fields: ["referent"]
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c005"]
        msl:
          qualifiers: ["stable"]
          stance: "neutral"
          direction: "forward"
          coherence: "high"

      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "The referent remains stable across turns."
              type: sentence
              modality: declarative
          operators: []
          lexical_domains: []
          lexical_tones:
            - "neutral"
          lexical_constraints: []
          morphology_flags: []
        sob_residue:
          lexical_tags: []
          structural_adjacent:
            - modality: declarative
          override_flags: []
          disagreement_flags: []

  # ------------------------------------------------------------
  # 6. Multi-segment + list structure (order preservation)
  # ------------------------------------------------------------
  - id: sob_test_006
    description: >
      Two sentences + unordered list. Order preserved (HLR-002).
      "consider" / "finalize" are not in operator dictionary, so
      modality stays declarative; list_structure residue is emitted.
    input:
      tp_identity:
        tp_id: "tp_sob_test_006"
        tp_seq: 6
        cycle_id: 1
        lane_id: "A"
        schema_version: "1.0"
        profile_signature: "default"
        wire_map_version: "1.0"
        policy_signature: "default"

      intake:
        text: |
          First consider the following items:
          - stability
          - continuity
          Then finalize the commit.

      metadata:
        context:
          context_fields:
            topic: "commit_prep"
            stance: "neutral"
            intent: "instruct"
            register: "technical"
            politeness: "medium"
            tone: "neutral"
            continuity: "moderate"
            direction: "forward"
            coherence: "medium"
            importance: "normal"
            clarifying_fields: []
          context_provenance:
            origin: "CE"
            last_update: "CE"
            commit_lineage: ["c006"]

    expected:
      structural:
        sob_structural_map:
          segments:
            - id: seg_0
              text: "First consider the following items:"
              type: sentence
              modality: declarative
            - id: seg_1
              text: "- stability"
              type: list_item
              modality: declarative
            - id: seg_2
              text: "- continuity"
              type: list_item
              modality: declarative
            - id: seg_3
              text: "Then finalize the commit."
              type: sentence
              modality: declarative
          operators: []
          lexical_domains: []
          lexical_tones:
            - "neutral"
          lexical_constraints: []
          morphology_flags: []
        sob_residue:
          lexical_tags: []
          structural_adjacent:
            - modality: declarative
            - list_structure: unordered
          override_flags: []
          disagreement_flags: []
