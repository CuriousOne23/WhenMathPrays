# ============================================================
# CEx‑CCR General Input (Mode B — Non-testbench)
# Version 2.0
# ============================================================

metadata:
  primitive: CEx-CCR
  mode: general
  description: >
    General-mode input for the CEx‑CCR primitive.
    Each scenario provides:
      • TP.cex.ie structural hints
      • TP.semantic.importance signals
    CIL is always loaded from cil_input.yaml (static 10-conversation substrate).
    No expected outputs are included in general mode.

# ============================================================
# SCENARIO 1 — User greeting / new topic
# ============================================================

scenario_1:
  description: "User starts a new topic with no reference to prior conversations."

  TP:
    cex:
      ie:
        tokens: ["hello", "there"]
        token_flags: ["norm", "norm"]
        normalized_text: "hello there"
        structural_phrases: ["greeting"]
        topic_hint: "greeting"
        intent_hint: "none"
        continuity_hint: "reset"
        reference_hint: "none"
        register_hint: "casual"
        politeness_hint: "normal"
        direction_hint: "none"
        coherence_hint: "stable"
        importance_hint: "low"

    semantic:
      importance:
        entities: []
        facts: []

# ============================================================
# SCENARIO 2 — Assistance request (router issue)
# ============================================================

scenario_2:
  description: "User asks about router troubleshooting — likely aligns with conv_1."

  TP:
    cex:
      ie:
        tokens: ["my", "router", "is", "still", "not", "working"]
        token_flags: ["norm", "norm", "norm", "norm", "norm", "norm"]
        normalized_text: "my router is still not working"
        structural_phrases: ["issue_report"]
        topic_hint: "assistance"
        intent_hint: "request"
        continuity_hint: "continue"
        reference_hint: "previous"
        register_hint: "casual"
        politeness_hint: "normal"
        direction_hint: "forward"
        coherence_hint: "stable"
        importance_hint: "high"

    semantic:
      importance:
        entities:
          - { value: "router", role: "primary_object", score: 0.85 }
        facts:
          - { value: "Wi‑Fi not working", role: "primary_issue", score: 0.90 }

