# ============================================================
#  SmOB Testbench (Version 1.0)
#  CnOB-shaped inputs + expected SmOB cue/compress outputs
# ============================================================

primitive: SmOB
version: "1.0"

tests:

  - id: smob_test_001
    description: "Clean C1/C5 — modality only from SROB; no conflict/underspec"
    input:
      tp_identity: {tp_id: tp_smob_001}
      structural:
        srob_structural_map:
          segments:
            - {id: seg_0, text: "The system processes input deterministically.", type: sentence, modality: declarative}
          operators: [process]
          discourse_flags: []
        cnob_constraint_map:
          constraint_families:
            C1:
              - {family: C1, rule_id: c1_segment_exists, payload: {reason: segment_exists}}
              - {family: C1, rule_id: c1_operator_present, payload: {reason: operator_present}}
            C2: []
            C3: []
            C4: []
            C5:
              - {family: C5, rule_id: c5_segment_id_lineage, payload: {reason: segment_id_lineage}}
            C6: []
            C7: []
          missing_slot_signals: []
          underspecification_markers: []
          conflict_indicators: []
          constraint_importance: []
          discourse_constraints: []
          lineage_constraints: []
          routing_constraints: []
          policy_constraints: []
        cnob_residue:
          missing_slot_signals: []
          underspecification_markers: []
          conflict_indicators: []
          constraint_importance: []
          constraint_family_summary: [C1, C5]
          disagreement_flags: []
          override_flags: []
          constraint_residue_hash: "deadbeef00000001"
      metadata:
        context:
          context_fields: {topic: system_behavior, stance: neutral, intent: inform, continuity: moderate, direction: forward, coherence: medium, importance: normal}
        msl: {}
    expected:
      structural:
        smob_cue_map:
          semantic_adjacent_cues: []
          modality_cues:
            - {family: modality, cue_id: declarative, rule_id: cue_modality_from_srob, segment_ids: [], source: srob, note: ""}
          affect_markers: []
          conflict_adjacent_signals: []
          underspecification_adjacent_signals: []
          constraint_importance_adjacent_signals: []
          discourse_adjacent_cues: []
          routing_semantic_cues: []
          delta_h_semantic_adjacent: []
        smob_residue:
          semantic_adjacent_cues: []
          conflict_adjacent_signals: []
          underspecification_adjacent_signals: []
          constraint_importance_adjacent_signals: []
          tr_input_cues:
            - {slot: modality, value: declarative}
            - {slot: conflict, value: ""}
            - {slot: underspec, value: ""}
            - {slot: importance, value: ""}
            - {slot: routing, value: ""}
            - {slot: discourse, value: ""}
          presemantic_residue_hash: present
          cue_family_summary: [modality]
          disagreement_flags: []
          override_flags: []

