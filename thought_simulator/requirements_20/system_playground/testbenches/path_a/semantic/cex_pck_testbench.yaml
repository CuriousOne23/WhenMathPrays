# ============================================================
# CEx-Pck Testbench (Mode A — Deterministic)
# ============================================================
# This file provides:
#   - full TP input envelope for CEx-Pck
#   - full expected TP output envelope
# PASS/FAIL is determined by exact equality.
# ============================================================

testbench:
  name: "cex_pck_testbench"
  description: "Deterministic testbench for CEx-Pck packaging layer"
  version: "1.0"

# ============================================================
# INPUTS TO CEx-Pck
# ============================================================

input:

  # ----------------------------------------------------------
  # 1. CEx-IE envelope (bounded structural hints)
  # ----------------------------------------------------------
  cex:
    ie:
      topic_hint: "network_issue"
      intent_hint: "request_help"
      continuity_hint: "moderate"
      reference_hint: "previous"
      register_hint: "informal"
      politeness_hint: "neutral"
      direction_hint: "forward"
      coherence_hint: "medium"
      importance_hint: "high"
      structural_phrases:
        - "router"
        - "wifi"
        - "disconnecting"

  # ----------------------------------------------------------
  # 2. CEx-CCR envelope (alignment + scores + decision)
  # ----------------------------------------------------------
    ccr:
      alignment:
        identity: "moderate"
        clarifying: "weak"
        context: "strong"
        continuity: "moderate"
        reference: "strong"
        semantic_residue: "moderate"

      scores:
        ambiguity: 0.12
        collapse: 0.03
        drift: 0.08
        stability: 0.91

      decision: "specific"
      selected_conversation: 4

      provenance:
        origin: "CEx-CCR"
        last_update: "CEx-CCR"
        commit_lineage: [1001, 1002, 1003]

  # ----------------------------------------------------------
  # 3. Semantic-Importance envelope (bounded residues)
  # ----------------------------------------------------------
  semantic:
    importance:
      entities:
        - value: "router"
          role: "primary_object"
          score: 0.88
          provenance: { origin: "SOB" }

      facts:
        - value: "wifi disconnecting"
          role: "primary_issue"
          score: 0.91
          provenance: { origin: "SmOB" }

  # ----------------------------------------------------------
  # 4. Next-Context metadata (from prior MCB)
  # ----------------------------------------------------------
  metadata:
    next_context:
      next_context: "troubleshooting"
      direction: "forward"
      coherence: "medium"
      stance: "neutral"
      subculture: "general_user"
      next_context_provenance:
        origin: "MCB"
        last_update: "MCB"
        commit_lineage: [1003]

# ============================================================
# EXPECTED OUTPUT FROM CEx-Pck
# ============================================================

expected:

  # ----------------------------------------------------------
  # 1. Context Metadata
  # ----------------------------------------------------------
  metadata.context.context_fields.topic: "network_issue"
  metadata.context.context_fields.intent: "request_help"
  metadata.context.context_fields.stance: "neutral"
  metadata.context.context_fields.register: "informal"
  metadata.context.context_fields.politeness: "neutral"
  metadata.context.context_fields.tone: "neutral"
  metadata.context.context_fields.continuity: "moderate"
  metadata.context.context_fields.direction: "forward"
  metadata.context.context_fields.coherence: "medium"
  metadata.context.context_fields.importance: "high"

  metadata.context.context_fields.clarifying_fields:
    - "router"
    - "wifi"
    - "disconnecting"

  metadata.context.relevance_flags.continuity_relevant: true
  metadata.context.relevance_flags.context_relevant: true

  metadata.context.copy_forward_flags.next_context_used: true
  metadata.context.reset_flags.reset_context: false

  metadata.context.context_provenance.origin: "CEx-Pck"

  # ----------------------------------------------------------
  # 2. Meaning Signal Layer (MSL)
  # ----------------------------------------------------------
  metadata.msl.qualifiers:
    - "router"
    - "wifi"

  metadata.msl.clarifications:
    - "disconnecting"

  metadata.msl.stance: "neutral"
  metadata.msl.shading: "none"
  metadata.msl.intent: "request_help"
  metadata.msl.direction: "forward"
  metadata.msl.coherence: "medium"
  metadata.msl.subculture: "general_user"

  metadata.msl.msl_provenance.origin: "CEx-Pck"

  # ----------------------------------------------------------
  # 3. CIL Metadata
  # ----------------------------------------------------------
  metadata.cil.selected_conversation: 4
  metadata.cil.cil_reference: "static_cil_substrate"
  metadata.cil.projection_provenance.origin: "CEx-CCR"

  # ----------------------------------------------------------
  # 4. Semantic-Residue Metadata
  # ----------------------------------------------------------
  metadata.semantic_residue.entities:
    - value: "router"
      role: "primary_object"
      score: 0.88
      provenance: { origin: "SOB" }

  metadata.semantic_residue.facts:
    - value: "wifi disconnecting"
      role: "primary_issue"
      score: 0.91
      provenance: { origin: "SmOB" }

  metadata.semantic_residue.alignment_scores: "moderate"
  metadata.semantic_residue.provenance.origin: "CEx-CCR"

# ============================================================
# END OF FILE
# ============================================================
