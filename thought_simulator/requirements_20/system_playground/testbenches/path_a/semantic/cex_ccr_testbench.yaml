# ============================================================
# CEx‑CCR Testbench (Mode A — Deterministic Testing)
# Version 1.0
# ============================================================

metadata:
  primitive: CEx-CCR
  mode: testbench
  description: >
    Deterministic testbench for the CEx‑CCR primitive.
    Each scenario provides:
      - TP.cex.ie input (structural hints)
      - TP.cil input (≤10 conversations)
      - expected TP.cex.ccr output
    PASS/FAIL is determined by exact equality.

# ============================================================
# SCENARIO 1 — NEW CONVERSATION
# identity alignment = none
# ambiguity = high
# continuity_hint = reset
# ============================================================

scenario_1:
  description: "NEW conversation — identity none + ambiguity high + continuity reset"

  TP:
    cex:
      ie:
        tokens: ["start", "fresh"]
        token_flags: ["norm", "norm"]
        normalized_text: "start fresh"
        structural_phrases: ["continuity_reset"]
        topic_hint: "misc"
        intent_hint: "none"
        continuity_hint: "reset"
        reference_hint: "none"
        register_hint: "none"
        politeness_hint: "none"
        direction_hint: "none"
        coherence_hint: "stable"
        importance_hint: "low"

    cil:
      conv_1:
        identity_lineage: "greeting"
        clarifying_lineage: "normal"
        context_lineage: "forward"
        continuity_lineage: "continue"
        topology: "linear"
        metrics:
          ambiguity_score: 0.92
          collapse_risk: 0.10
          stability_score: 0.55
          drift_score: 0.20
        semantic_residue: "none"
        next_context: "none"

      conv_2:
        identity_lineage: "assistance"
        clarifying_lineage: "normal"
        context_lineage: "forward"
        continuity_lineage: "continue"
        topology: "linear"
        metrics:
          ambiguity_score: 0.88
          collapse_risk: 0.15
          stability_score: 0.60
          drift_score: 0.25
        semantic_residue: "none"
        next_context: "none"

  expected:
    cex:
      ccr:
        alignment:
          identity: "none"
          clarifying: "none"
          context: "none"
          continuity: "none"
          reference: "none"
        scores:
          ambiguity: 0.92
          collapse: 0.10
          drift: 0.20
          stability: 0.55
        decision: "new"
        selected_conversation: null

# ============================================================
# SCENARIO 2 — SPECIFIC CONVERSATION
# identity strong + ambiguity low + continuity strong
# ============================================================

scenario_2:
  description: "SPECIFIC conversation — identity strong + ambiguity low + continuity strong"

  TP:
    cex:
      ie:
        tokens: ["as", "I", "was", "saying"]
        token_flags: ["norm", "norm", "norm", "norm"]
        normalized_text: "as I was saying"
        structural_phrases: ["reference_previous"]
        topic_hint: "assistance"
        intent_hint: "request"
        continuity_hint: "continue"
        reference_hint: "previous"
        register_hint: "casual"
        politeness_hint: "normal"
        direction_hint: "forward"
        coherence_hint: "stable"
        importance_hint: "medium"

    cil:
      conv_1:
        identity_lineage: "assistance"
        clarifying_lineage: "casual"
        context_lineage: "forward"
        continuity_lineage: "continue"
        topology: "linear"
        metrics:
          ambiguity_score: 0.05
          collapse_risk: 0.02
          stability_score: 0.90
          drift_score: 0.10
        semantic_residue: "previous"
        next_context: "assistance"

      conv_2:
        identity_lineage: "misc"
        clarifying_lineage: "normal"
        context_lineage: "backward"
        continuity_lineage: "reset"
        topology: "linear"
        metrics:
          ambiguity_score: 0.40
          collapse_risk: 0.10
          stability_score: 0.50
          drift_score: 0.30
        semantic_residue: "none"
        next_context: "misc"

  expected:
    cex:
      ccr:
        alignment:
          identity: "strong"
          clarifying: "strong"
          context: "strong"
          continuity: "strong"
          reference: "strong"
        scores:
          ambiguity: 0.05
          collapse: 0.02
          drift: 0.10
          stability: 0.90
        decision: "specific"
        selected_conversation: "conv_1"

# ============================================================
# SCENARIO 3 — FALLBACK
# identity weak/moderate + ambiguity moderate + continuity unclear
# ============================================================

scenario_3:
  description: "FALLBACK — identity weak + ambiguity moderate + continuity unclear"

  TP:
    cex:
      ie:
        tokens: ["about", "that", "other", "thing"]
        token_flags: ["norm", "norm", "norm", "norm"]
        normalized_text: "about that other thing"
        structural_phrases: ["reference_ambiguous"]
        topic_hint: "misc"
        intent_hint: "inform"
        continuity_hint: "unknown"
        reference_hint: "ambiguous_previous"
        register_hint: "none"
        politeness_hint: "none"
        direction_hint: "none"
        coherence_hint: "unstable"
        importance_hint: "low"

    cil:
      conv_1:
        identity_lineage: "assistance"
        clarifying_lineage: "normal"
        context_lineage: "forward"
        continuity_lineage: "continue"
        topology: "linear"
        metrics:
          ambiguity_score: 0.45
          collapse_risk: 0.10
          stability_score: 0.80
          drift_score: 0.20
        semantic_residue: "none"
        next_context: "assistance"

      conv_2:
        identity_lineage: "misc"
        clarifying_lineage: "normal"
        context_lineage: "forward"
        continuity_lineage: "continue"
        topology: "linear"
        metrics:
          ambiguity_score: 0.50
          collapse_risk: 0.20
          stability_score: 0.70
          drift_score: 0.25
        semantic_residue: "none"
        next_context: "misc"

  expected:
    cex:
      ccr:
        alignment:
          identity: "weak"
          clarifying: "weak"
          context: "weak"
          continuity: "none"
          reference: "weak"
        scores:
          ambiguity: 0.45
          collapse: 0.10
          drift: 0.20
          stability: 0.80
        decision: "fallback"
        selected_conversation: "conv_1"   # highest stability_score

