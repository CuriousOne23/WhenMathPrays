# ============================================================
# CEx‑CCR Testbench (Mode A — Deterministic Testing)
# Version 2.0
# ============================================================

metadata:
  primitive: CEx-CCR
  mode: testbench
  description: >
    Deterministic testbench for the CEx‑CCR primitive.
    Uses the static 10‑conversation CIL substrate from cil_input.yaml.
    Each scenario provides:
      - TP.cex.ie input (structural hints)
      - TP.semantic.importance (bounded semantic residues)
      - expected TP.cex.ccr output
    PASS/FAIL is determined by exact equality.

# ============================================================
# SCENARIO 1 — NEW CONVERSATION
# identity alignment = none
# ambiguity = high (conv_10)
# continuity_hint = reset
# ============================================================

scenario_1:
  description: "NEW conversation — identity none + high ambiguity + continuity reset"

  TP:
    cex:
      ie:
        tokens: ["start", "fresh"]
        token_flags: ["norm", "norm"]
        normalized_text: "start fresh"
        structural_phrases: ["continuity_reset"]
        topic_hint: "misc"
        intent_hint: "none"
        continuity_hint: "reset"
        reference_hint: "none"
        register_hint: "none"
        politeness_hint: "none"
        direction_hint: "none"
        coherence_hint: "stable"
        importance_hint: "low"

    semantic:
      importance:
        entities: []
        facts: []

  expected:
    cex:
      ccr:
        alignment:
          identity: "none"
          clarifying: "none"
          context: "none"
          continuity: "none"
          reference: "none"
          semantic_residue: "none"
        scores:
          ambiguity: 0.95        # from conv_10 (highest ambiguity)
          collapse: 0.30
          drift: 0.40
          stability: 0.50
        decision: "new"
        selected_conversation: null

# ============================================================
# SCENARIO 2 — SPECIFIC CONVERSATION
# IE references previous assistance conversation
# conv_1 (Alice router) is strong match
# ============================================================

scenario_2:
  description: "SPECIFIC conversation — strong identity + low ambiguity + strong continuity"

  TP:
    cex:
      ie:
        tokens: ["as", "I", "was", "saying"]
        token_flags: ["norm", "norm", "norm", "norm"]
        normalized_text: "as I was saying"
        structural_phrases: ["reference_previous"]
        topic_hint: "assistance"
        intent_hint: "request"
        continuity_hint: "continue"
        reference_hint: "previous"
        register_hint: "casual"
        politeness_hint: "normal"
        direction_hint: "forward"
        coherence_hint: "stable"
        importance_hint: "medium"

    semantic:
      importance:
        entities:
          - { value: "Alice", role: "primary_name", score: 0.9 }
          - { value: "home router", role: "primary_object", score: 0.8 }
        facts:
          - { value: "Wi‑Fi not working", role: "primary_issue", score: 0.85 }

  expected:
    cex:
      ccr:
        alignment:
          identity: "strong"
          clarifying: "strong"
          context: "strong"
          continuity: "strong"
          reference: "strong"
          semantic_residue: "strong"
        scores:
          ambiguity: 0.10        # from conv_1
          collapse: 0.05
          drift: 0.12
          stability: 0.88
        decision: "specific"
        selected_conversation: "conv_1"

# ============================================================
# SCENARIO 3 — FALLBACK
# IE ambiguous reference
# identity weak/moderate across CIL
# fallback selects highest stability among moderate candidates
# conv_7 (Grace clinic) has stability 0.85
# ============================================================

scenario_3:
  description: "FALLBACK — identity weak/moderate + ambiguity moderate + continuity unclear"

  TP:
    cex:
      ie:
        tokens: ["about", "that", "other", "thing"]
        token_flags: ["norm", "norm", "norm", "norm"]
        normalized_text: "about that other thing"
        structural_phrases: ["reference_ambiguous"]
        topic_hint: "misc"
        intent_hint: "inform"
        continuity_hint: "unknown"
        reference_hint: "ambiguous_previous"
        register_hint: "none"
        politeness_hint: "none"
        direction_hint: "none"
        coherence_hint: "unstable"
        importance_hint: "low"

    semantic:
      importance:
        entities:
          - { value: "clinic", role: "object", score: 0.6 }
        facts:
          - { value: "appointment scheduling", role: "fact", score: 0.55 }

  expected:
    cex:
      ccr:
        alignment:
          identity: "weak"
          clarifying: "weak"
          context: "weak"
          continuity: "none"
          reference: "weak"
          semantic_residue: "weak"
        scores:
          ambiguity: 0.15        # from conv_7 (moderate ambiguity candidate)
          collapse: 0.05
          drift: 0.22
          stability: 0.85
        decision: "fallback"
        selected_conversation: "conv_7"

# ============================================================
# END OF FILE
# ============================================================
