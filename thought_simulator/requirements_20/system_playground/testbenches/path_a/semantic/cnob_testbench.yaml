# ============================================================
#  CnOB Testbench (Version 1.0)
#  SROB-shaped inputs + expected CnOB constraint outputs
# ============================================================

primitive: CnOB
version: "1.0"

tests:

  # ----------------------------------------------------------
  - id: cnob_test_001
    description: "Single declarative + operator → C1; no conflict"
    input:
      tp_identity:
        tp_id: "tp_cnob_001"
      structural:
        srob_structural_map:
          segments:
            - id: seg_0
              text: "The system processes input deterministically."
              type: sentence
              modality: declarative
          operators:
            - process
          lexical_domains:
            - technical_like
          lexical_tones:
            - neutral
          lexical_constraints: []
          discourse_flags: []
        srob_residue:
          refined_tags: []
          pass_through_tags:
            - operator: process
          structural_adjacent: []
          unmapped_coarse: []
          disagreement_flags: []
          override_flags: []
      metadata:
        context:
          context_fields:
            topic: system_behavior
            stance: neutral
            intent: inform
            continuity: moderate
            direction: forward
            coherence: medium
            importance: normal
        msl: {}
    expected:
      structural:
        cnob_constraint_map:
          constraint_families:
            C1:
              - family: C1
                rule_id: c1_segment_exists
                payload:
                  reason: segment_exists
              - family: C1
                rule_id: c1_operator_present
                payload:
                  reason: operator_present
            C2: []
            C3: []
            C4: []
            C5:
              - family: C5
                rule_id: c5_segment_id_lineage
                payload:
                  reason: segment_id_lineage
            C6: []
            C7: []
          missing_slot_signals: []
          underspecification_markers: []
          conflict_indicators: []
          constraint_importance: []
          discourse_constraints: []
          lineage_constraints: []
          routing_constraints: []
          policy_constraints: []
        cnob_residue:
          missing_slot_signals: []
          underspecification_markers: []
          conflict_indicators: []
          constraint_importance: []
          constraint_family_summary:
            - C1
            - C5
          disagreement_flags: []
          override_flags: []
          constraint_residue_hash: present

