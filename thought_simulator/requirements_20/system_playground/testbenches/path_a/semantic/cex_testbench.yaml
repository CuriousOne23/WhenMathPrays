# ============================================================
# CEx Testbench — Strict Deterministic Mode (Aligned with cex_expectations_of_cil.md)
# ============================================================
# PASS/FAIL is determined solely by expected outputs.
# Rulechecker may run for diagnostics but does not affect PASS/FAIL.
# ============================================================

version: "1.1"
primitive: "CEx"
mode: "testbench"

tests:

  # ----------------------------------------------------------
  # Test 1 — Specific Conversation (Strong Identity Match)
  # ----------------------------------------------------------
  - id: "cex_specific_conversation_identity_match"
    description: "CEx selects a specific conversation when identity lineage matches and ambiguity/collapse are low."

    ie_input:
      intake:
        ie_tokens: ["hello", "world"]
        token_flags: ["normative", "normative"]
        normalized_text: "hello world"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity:
        primary_layer_id: 3
        identity_layer_prev: 3
        identity_layer_lineage: [3, 3, 3]
        identity_layer_recency: { 3: 0 }
        identity_layer_density: { 3: 1.0 }
        identity_layer_switch_count: 0
      clarifying:
        clarifying_fields_prev:
          topic: "greeting"
        clarifying_fields_lineage:
          - topic: "greeting"
        clarifying_field_stability: 1.0
      context:
        context_fields_prev:
          topic: "greeting"
        context_fields_lineage:
          - topic: "greeting"
        context_shift_count: 0
      continuity:
        continuity_prev: "continue"
        continuity_lineage: ["continue"]
        continuity_break_count: 0
      topology:
        conversation_id: "conv_001"
        conversation_topology: "linear"
        conversation_length: 3
      metrics:
        primary_certainty: 0.92
        ambiguity_score: 0.05
        collapse_risk: 0.01
        stability_score: 0.95
        volatility_score: 0.0
        drift_score: 0.0
        lineage_confidence: 0.95
      semantic_residue:
        last_topic: "greeting"
        last_intent: "inform"
        last_register: "casual"
      next_context:
        topic: "greeting"
        stance: "neutral"
        intent: "inform"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 1

    expected_ce_output:
      context_fields:
        topic: "greeting"
        stance: "neutral"
        intent: "inform"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 1
      clarifying_fields:
        topic: "greeting"
      identity_layer_id: 3

      metadata:
        continuity_status: "continue"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit:
          - kind: "rule_2_specific"
            reason: "strong_identity_match_low_ambiguity_low_collapse"

      version_tag: "cex_v3.1"


  # ----------------------------------------------------------
  # Test 2 — Fallback Conversation (Ambiguous Case)
  # ----------------------------------------------------------
  - id: "cex_ambiguous_fallback"
    description: "CEx falls back to most recent stable conversation when identity match is weak and ambiguity/collapse are moderate."

    ie_input:
      intake:
        ie_tokens: ["status", "update"]
        token_flags: ["normative", "normative"]
        normalized_text: "status update"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity:
        primary_layer_id: null
        identity_layer_prev: 7
        identity_layer_lineage: [7, 5, 7]
        identity_layer_recency: { 7: 0, 5: 2 }
        identity_layer_density: { 7: 0.67, 5: 0.33 }
        identity_layer_switch_count: 2
      clarifying:
        clarifying_fields_prev:
          topic: "system"
        clarifying_fields_lineage:
          - topic: "system"
        clarifying_field_stability: 0.8
      context:
        context_fields_prev:
          topic: "system"
        context_fields_lineage:
          - topic: "system"
        context_shift_count: 1
      continuity:
        continuity_prev: "unknown"
        continuity_lineage: ["continue", "unknown"]
        continuity_break_count: 0
      topology:
        conversation_id: "conv_002"
        conversation_topology: "branched"
        conversation_length: 5
      metrics:
        primary_certainty: 0.4
        ambiguity_score: 0.6
        collapse_risk: 0.5
        stability_score: 0.6
        volatility_score: 0.2
        drift_score: 0.4
        lineage_confidence: 0.6
      semantic_residue:
        last_topic: "system"
        last_intent: "inform"
        last_register: "formal"
      next_context:
        topic: "system"
        stance: "neutral"
        intent: "inform"
        register: "formal"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 2

    expected_ce_output:
      context_fields:
        topic: "system"
        stance: "neutral"
        intent: "inform"
        register: "formal"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 2
      clarifying_fields:
        topic: "system"
      identity_layer_id: 7

      metadata:
        continuity_status: "continue"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit:
          - kind: "rule_3_fallback"
            reason: "weak_identity_match_moderate_ambiguity_moderate_collapse"

      version_tag: "cex_v3.1"


  # ----------------------------------------------------------
  # Test 3 — New Conversation Detection
  # ----------------------------------------------------------
  - id: "cex_new_conversation_detection"
    description: "CEx declares a new conversation when identity lineage has no match, ambiguity and collapse are high, and continuity_prev is reset."

    ie_input:
      intake:
        ie_tokens: ["start", "fresh"]
        token_flags: ["normative", "normative"]
        normalized_text: "start fresh"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity:
        primary_layer_id: null
        identity_layer_prev: null
        identity_layer_lineage: []
        identity_layer_recency: {}
        identity_layer_density: {}
        identity_layer_switch_count: 0
      clarifying:
        clarifying_fields_prev: {}
        clarifying_fields_lineage: []
        clarifying_field_stability: 0.0
      context:
        context_fields_prev: {}
        context_fields_lineage: []
        context_shift_count: 0
      continuity:
        continuity_prev: "reset"
        continuity_lineage: ["reset"]
        continuity_break_count: 1
      topology:
        conversation_id: "conv_003"
        conversation_topology: "reset-heavy"
        conversation_length: 0
      metrics:
        primary_certainty: 0.1
        ambiguity_score: 0.95
        collapse_risk: 0.9
        stability_score: 0.0
        volatility_score: 0.0
        drift_score: 0.0
        lineage_confidence: 0.0
      semantic_residue:
        last_topic: null
        last_intent: null
        last_register: null
      next_context:
        topic: "new"
        stance: "neutral"
        intent: "begin"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "reset"
        direction: "forward"
        coherence: "stable"
        shift_required: true
        importance: 1

    expected_ce_output:
      context_fields:
        topic: "new"
        stance: "neutral"
        intent: "begin"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "reset"
        direction: "forward"
        coherence: "stable"
        shift_required: true
        importance: 1
      clarifying_fields: {}
      identity_layer_id: "new_conversation"

      metadata:
        continuity_status: "new"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit:
          - kind: "rule_1_new"
            reason: "identity_mismatch_high_ambiguity_high_collapse_reset_continuity"

      version_tag: "cex_v3.1"


  # ----------------------------------------------------------
  # Test 4 — Clarifying Metadata Extraction
  # ----------------------------------------------------------
  - id: "cex_clarifying_metadata_extraction"
    description: "CEx carries clarifying_fields from CIL into its output deterministically."

    ie_input:
      intake:
        ie_tokens: ["please", "help"]
        token_flags: ["normative", "normative"]
        normalized_text: "please help"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity:
        primary_layer_id: 4
        identity_layer_prev: 4
        identity_layer_lineage: [4, 4]
        identity_layer_recency: { 4: 0 }
        identity_layer_density: { 4: 1.0 }
        identity_layer_switch_count: 0
      clarifying:
        clarifying_fields_prev:
          topic: "assistance"
          urgency: "medium"
        clarifying_fields_lineage:
          - topic: "assistance"
            urgency: "medium"
        clarifying_field_stability: 1.0
      context:
        context_fields_prev:
          topic: "assistance"
        context_fields_lineage:
          - topic: "assistance"
        context_shift_count: 0
      continuity:
        continuity_prev: "continue"
        continuity_lineage: ["continue"]
        continuity_break_count: 0
      topology:
        conversation_id: "conv_004"
        conversation_topology: "linear"
        conversation_length: 2
      metrics:
        primary_certainty: 0.88
        ambiguity_score: 0.1
        collapse_risk: 0.03
        stability_score: 0.9
        volatility_score: 0.0
        drift_score: 0.0
        lineage_confidence: 0.9
      semantic_residue:
        last_topic: "assistance"
        last_intent: "request"
        last_register: "polite"
      next_context:
        topic: "assistance"
        stance: "neutral"
        intent: "request"
        register: "polite"
        politeness: "high"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 3

    expected_ce_output:
      context_fields:
        topic: "assistance"
        stance: "neutral"
        intent: "request"
        register: "polite"
        politeness: "high"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 3
      clarifying_fields:
        topic: "assistance"
        urgency: "medium"
      identity_layer_id: 4

      metadata:
        continuity_status: "continue"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit: []

      version_tag: "cex_v3.1"


  # ----------------------------------------------------------
  # Test 5 — Passthrough Case (use_cex = false)
  # ----------------------------------------------------------
  - id: "cex_passthrough"
    description: "When passthrough=true, CEx output equals input (no modification)."

    passthrough: true

    ie_input:
      intake:
        ie_tokens: ["noop"]
        token_flags: ["normative"]
        normalized_text: "noop"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity:
        primary_layer_id: 1
        identity_layer_prev: 1
        identity_layer_lineage: [1]
        identity_layer_recency: { 1: 0 }
        identity_layer_density: { 1: 1.0 }
        identity_layer_switch_count: 0
      clarifying:
        clarifying_fields_prev: {}
        clarifying_fields_lineage: []
        clarifying_field_stability: 0.0
      context:
        context_fields_prev:
          topic: "noop"
        context_fields_lineage:
          - topic: "noop"
        context_shift_count: 0
      continuity:
        continuity_prev: "continue"
        continuity_lineage: ["continue"]
        continuity_break_count: 0
      topology:
        conversation_id: "conv_005"
        conversation_topology: "linear"
        conversation_length: 1
      metrics:
