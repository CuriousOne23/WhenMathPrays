        ambiguity_score: 0.01
        collapse_risk: 0.0
        stability_score: 1.0
        volatility_score: 0.0
        drift_score: 0.0
        lineage_confidence: 1.0
      semantic_residue:
        last_topic: "noop"
        last_intent: "none"
        last_register: "none"
      next_context:
        topic: "noop"
        stance: "neutral"
        intent: "none"
        register: "none"
        politeness: "none"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 0

    expected_ce_output:
      passthrough: true


  # ----------------------------------------------------------
  # Test 6 — Malformed CIL (Skip Condition)
  # ----------------------------------------------------------
  - id: "cex_malformed_cil"
    description: "CEx extracts only valid fields when CIL is malformed and marks audit accordingly."

    ie_input:
      intake:
        ie_tokens: ["check", "status"]
        token_flags: ["normative", "normative"]
        normalized_text: "check status"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity: null
      clarifying:
        clarifying_fields_prev: "MALFORMED"
        clarifying_fields_lineage: []
        clarifying_field_stability: 0.0
      context:
        context_fields_prev:
          topic: "status"
        context_fields_lineage:
          - topic: "status"
        context_shift_count: 0
      continuity:
        continuity_prev: "unknown"
        continuity_lineage: ["unknown"]
        continuity_break_count: 0
