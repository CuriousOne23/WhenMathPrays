  # ----------------------------------------------------------
  # Test 5 — Passthrough Case (use_cex = false)
  # ----------------------------------------------------------
  - id: "cex_passthrough"
    description: "When use_cex=false, CEx output equals input (passthrough)."

    passthrough: true

    ie_input:
      intake:
        ie_tokens: ["noop"]
        token_flags: ["normative"]
        normalized_text: "noop"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity_selection_block:
        primary_layer_id: 1
        primary_certainty: 0.99
        ambiguity_score: 0.01
        last_referred: 1
        total_referrals: { "1": 20 }
        recent_referrals: { "1": 5 }
      clarifying_fields: {}
      stability:
        collapse_risk: 0.00
      next_context:
        topic: "noop"
        stance: "neutral"
        intent: "none"
        register: "none"
        politeness: "none"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 0

    expected_ce_output:
      passthrough: true


  # ----------------------------------------------------------
  # Test 6 — Malformed CIL (Skip Condition)
  # ----------------------------------------------------------
  - id: "cex_malformed_cil"
    description: "CEx extracts only valid fields when CIL is malformed."

    ie_input:
      intake:
        ie_tokens: ["check", "status"]
        token_flags: ["normative", "normative"]
        normalized_text: "check status"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity_selection_block: null
      clarifying_fields: "MALFORMED"
      stability: {}
      next_context:
        topic: "status"

    expected_ce_output:
      context_fields:
        topic: "status"
        clarifying_fields: {}
        identity_layer_id: "fallback"

      metadata:
        continuity_status: "undetermined"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit:
          - kind: "malformed_input"
            field: "clarifying_fields"

      version_tag: "cex_v3.0"
