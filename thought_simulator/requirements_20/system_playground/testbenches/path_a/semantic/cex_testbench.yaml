        token_flags: ["normative", "normative"]
        normalized_text: "please help"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations: []
        replay: {}
      error: null

    cil_input:
      identity_selection_block:
        primary_layer_id: 4
        primary_certainty: 0.88
        ambiguity_score: 0.10
        last_referred: 4
        total_referrals: { "4": 9 }
        recent_referrals: { "4": 3 }
      clarifying_fields:
        topic: "assistance"
        urgency: "medium"
      stability:
        collapse_risk: 0.03
