# ============================================================
# CEx Testbench — Deterministic Mode (Aligned with cex_expectations_of_cil.md)
# ============================================================
version: "2.0"
primitive: "CEx"
mode: "testbench"

tests:

  # ===========================================================
  # 1. SPECIFIC CONVERSATION — Strong Identity Match
  # ===========================================================
  - id: "cex_specific_identity_strong"
    description: "Identity lineage matches strongly; ambiguity and collapse low."

    ie_input:
      intake:
        ie_tokens: ["hello", "world"]
        token_flags: ["normative", "normative"]
        normalized_text: "hello world"
      structure: { tags: [], spans: [], markup: [] }
      metadata: { repair_annotations: [], replay: {} }
      error: null

    cil_input:
      identity:
        primary_layer_id: 3
        identity_layer_prev: 3
        identity_layer_lineage: [3, 3, 3]
        identity_layer_recency: { 3: 0 }
        identity_layer_density: { 3: 1.0 }
        identity_layer_switch_count: 0

      clarifying:
        clarifying_fields_prev: { topic: "greeting" }
        clarifying_fields_lineage:
          - { topic: "greeting" }
        clarifying_field_stability: 1.0

      context:
        context_fields_prev: { topic: "greeting" }
        context_fields_lineage:
          - { topic: "greeting" }
        context_shift_count: 0

      continuity:
        continuity_prev: "continue"
        continuity_lineage: ["continue"]
        continuity_break_count: 0

      topology:
        conversation_id: "conv_001"
        conversation_topology: "linear"
        conversation_length: 3

      metrics:
        primary_certainty: 0.92
        ambiguity_score: 0.05
        collapse_risk: 0.01
        stability_score: 0.95
        volatility_score: 0.0
        drift_score: 0.0
        lineage_confidence: 0.95

      semantic_residue:
        last_topic: "greeting"
        last_intent: "inform"
        last_register: "casual"

      next_context:
        topic: "greeting"
        stance: "neutral"
        intent: "inform"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 1

    expected_ce_output:
      identity_layer_id: 3
      continuity_status: "continue"

      context_fields:
        topic: "greeting"
        stance: "neutral"
        intent: "inform"
        register: "casual"
        politeness: "normal"
        epistemic_shading: "none"
        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 1

      clarifying_fields:
        topic: "greeting"

      provenance:
        decision_category: "specific"
        trigger_conditions:
          identity_match: true
          ambiguity_level: "low"
          collapse_level: "low"
          continuity_signal: "continue"
          lineage_alignment: "aligned"

      audit:
        rule_fired: "rule_2_specific"
        identity_layer_id: 3
        continuity_status: "continue"
        turn_index: 1

      version_tag: "cex_v3.2"


