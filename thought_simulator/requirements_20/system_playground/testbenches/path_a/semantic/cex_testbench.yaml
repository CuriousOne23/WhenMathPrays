        continuity: "continue"
        direction: "forward"
        coherence: "stable"
        shift_required: false
        importance: 2
      clarifying_fields: {}
      identity_layer_id: "fallback"

      metadata:
        continuity_status: "undetermined"
        context_provenance:
          - origin: "CEx"
            last_update: "CEx"
        extraction_audit:
          - kind: "malformed_input"
            field: "clarifying_fields_prev"

      version_tag: "cex_v3.1"
