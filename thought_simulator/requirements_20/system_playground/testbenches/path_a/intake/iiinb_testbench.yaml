# ============================================================
# Path A Intake Testbench — IIInB (Deterministic Repair-Proposal Primitive)
# Compliant with 20.101 (Rewritten)
# ============================================================

testbench_id: "path_a.intake.iiinb"
version: "3.0.0"
description: "IIInB testbench aligned with deterministic token-span repair proposals."

simulation:
  deterministic: true
  replayable: true
  seed: 42

tests:

  # ----------------------------------------------------------
  # 1. Clean Input — No Repairs, No Anomalies
  # ----------------------------------------------------------
  - id: "clean.simple"
    description: "Clean input should produce no repairs or anomalies."
    input: "The dog chased the cat."
    expected:
      iiinb_status: "inspected"
      repair_proposals: []
      anomaly_flags: []
      intake_surface: "The dog chased the cat."
      intake_tokens: ["The", "dog", "chased", "the", "cat", "."]

  # ----------------------------------------------------------
  # 2. Unicode Noise Normalization (Proposal Only)
  # ----------------------------------------------------------
  - id: "unicode.noise"
    description: "Invalid Unicode should produce repair proposals, not applied repairs."
    input: "The dog chased the cat. � �"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "unicode.normalize"
          span: [5, 5]
          replacement: ""
        - rule_id: "unicode.normalize"
          span: [6, 6]
          replacement: ""
      anomaly_flags: []
      intake_surface: "The dog chased the cat. � �"
      intake_tokens: ["The", "dog", "chased", "the", "cat", ".", "�", "�"]

  # ----------------------------------------------------------
  # 3. Structural Token Repair (Proposal Only)
  # ----------------------------------------------------------
  - id: "structural.break"
    description: "Malformed structural tokens should produce repair proposals."
    input: "The dog chased the cat <broken>"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "structural.clean"
          span: [6, 6]
          replacement: ""
      anomaly_flags: []
      intake_surface: "The dog chased the cat <broken>"
      intake_tokens: ["The", "dog", "chased", "the", "cat", "<broken>"]

  # ----------------------------------------------------------
  # 4. Empty Input
  # ----------------------------------------------------------
  - id: "empty.input"
    description: "Empty input should produce no repairs or anomalies."
    input: ""
    expected:
      iiinb_status: "inspected"
      repair_proposals: []
      anomaly_flags: []
      intake_surface: ""
      intake_tokens: []

  # ----------------------------------------------------------
  # 5. Long Input — Deterministic Replay
  # ----------------------------------------------------------
  - id: "long.input"
    description: "Long input should produce deterministic repair proposals."
    generate_long_input: true
    long_length: 5000
    expected:
      iiinb_status: "inspected"
      repair_proposals: []
      anomaly_flags: []
      # intake_surface and intake_tokens filled by generator

  # ----------------------------------------------------------
  # 6. Repeating Letters — Collapse (Proposal Only)
  # ----------------------------------------------------------
  - id: "repeating.letters"
    description: "Excessive repeating letters should produce deterministic proposals."
    input: "YYYYYYYYYYEEEEEAAAAHHHH"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "repetition.collapse"
          span: [0, 0]
          replacement: "YY"
        - rule_id: "repetition.collapse"
          span: [1, 1]
          replacement: "EE"
        - rule_id: "repetition.collapse"
          span: [2, 2]
          replacement: "AA"
        - rule_id: "repetition.collapse"
          span: [3, 3]
          replacement: "HH"
      anomaly_flags: []
      intake_surface: "YYYYYYYYYYEEEEEAAAAHHHH"
      intake_tokens: ["YYYYYYYYYY", "EEEEE", "AAAA", "HHHH"]

  # ----------------------------------------------------------
  # 7. Shorthand Expansion (Proposal Only)
  # ----------------------------------------------------------
  - id: "shorthand.plz"
    description: "Deterministic shorthand expansion proposal."
    input: "plz help me"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "shorthand.expand"
          span: [0, 0]
          replacement: "please"
      anomaly_flags: []
      intake_surface: "plz help me"
      intake_tokens: ["plz", "help", "me"]

  # ----------------------------------------------------------
  # 8. Misspelling — Transposition (Proposal Only)
  # ----------------------------------------------------------
  - id: "misspelling.transposition"
    description: "Transposed letters should produce deterministic proposals."
    input: "hte dog chased the cat"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "spelling.transpose"
          span: [0, 0]
          replacement: "the"
      anomaly_flags: []
      intake_surface: "hte dog chased the cat"
      intake_tokens: ["hte", "dog", "chased", "the", "cat"]

  # ----------------------------------------------------------
  # 9. Misspelling — Missing Letter (Proposal Only)
  # ----------------------------------------------------------
  - id: "misspelling.missing"
    description: "Missing-letter misspelling should produce deterministic proposals."
    input: "The rd fox jumped."
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "spelling.missing"
          span: [1, 1]
          replacement: "red"
      anomaly_flags: []
      intake_surface: "The rd fox jumped."
      intake_tokens: ["The", "rd", "fox", "jumped", "."]

  # ----------------------------------------------------------
  # 10. Multiple Repairs — Whitespace + Punctuation (Proposal Only)
  # ----------------------------------------------------------
  - id: "multi.repairs.surface"
    description: "Multiple deterministic repair proposals."
    input: "The   dog!!!"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "whitespace.normalize"
          span: [0, 1]
          replacement: ["The", "dog"]
        - rule_id: "punctuation.clean"
          span: [2, 2]
          replacement: "!"
      anomaly_flags: []
      intake_surface: "The   dog!!!"
      intake_tokens: ["The", "dog", "!!!"]

  # ----------------------------------------------------------
  # 11. Multiple Anomalies — Illegal Characters
  # ----------------------------------------------------------
  - id: "multi.anomalies.illegal"
    description: "Illegal characters should produce anomaly flags with spans."
    input: "Th#e dog$ chased the cat%"
    expected:
      iiinb_status: "inspected"
      repair_proposals: []
      anomaly_flags:
        - type: "illegal_character"
          span: [1, 1]
          target: "#"
        - type: "illegal_character"
          span: [3, 3]
          target: "$"
        - type: "illegal_character"
          span: [6, 6]
          target: "%"
      intake_surface: "Th#e dog$ chased the cat%"
      intake_tokens: ["Th#e", "dog$", "chased", "the", "cat%"]

  # ----------------------------------------------------------
  # 12. Mixed Repairs + Anomalies
  # ----------------------------------------------------------
  - id: "mixed.repairs.anomalies"
    description: "Repairs and anomalies together."
    input: "The   dog@!!!"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "whitespace.normalize"
          span: [0, 1]
          replacement: ["The", "dog"]
        - rule_id: "punctuation.clean"
          span: [3, 3]
          replacement: "!"
      anomaly_flags:
        - type: "illegal_character"
          span: [2, 2]
          target: "@"
      intake_surface: "The   dog@!!!"
      intake_tokens: ["The", "dog", "@", "!!!"]

  # ----------------------------------------------------------
  # 13. Structural + Surface Repairs + Anomalies
  # ----------------------------------------------------------
  - id: "structural.surface.mixed"
    description: "Structural cleanup + surface repairs + anomalies."
    input: "Hello,, world <broken> @"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "structural.clean"
          span: [3, 3]
          replacement: ""
        - rule_id: "punctuation.clean"
          span: [0, 0]
          replacement: ","
      anomaly_flags:
        - type: "illegal_character"
          span: [4, 4]
          target: "@"
      intake_surface: "Hello,, world <broken> @"
      intake_tokens: ["Hello,,", "world", "<broken>", "@"]

  # ----------------------------------------------------------
  # 14. Token Preservation Case (IIInB → IE Compatibility)
  # ----------------------------------------------------------
  - id: "token.preservation"
    description: "IIInB must preserve token boundaries."
    input: "the dog"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "case.normalize"
          span: [0, 0]
          replacement: "The"
      anomaly_flags: []
      intake_surface: "the dog"
      intake_tokens: ["the", "dog"]

  # ----------------------------------------------------------
  # 15. Replay Determinism — Identical Input → Identical Output
  # ----------------------------------------------------------
  # NOTE:
  # This test verifies replay determinism: identical input bytes must produce
  # identical IIInB output. The literal YAML string "café�" is re-encoded by
  # GitHub/YAML loaders into mojibake bytes (e.g., caf├⌐∩┐╜). IIInB must preserve
  # these bytes exactly, without normalization or mutation. Therefore the expected
  # intake_surface and intake_tokens must match the actual mojibake bytes that
  # Python receives, not the visual representation shown in editors.
  - id: "replay.determinism"
    description: "Identical input bytes must produce identical IIInB output."
    input_codepoints:
      - "0x63"
      - "0x61"
      - "0x66"
      - "0xc3"
      - "0xa9"
      - "0xef"
      - "0xbf"
      - "0xbd"
    expected:
      iiinb_status: "inspected"
      repair_proposals:
        - rule_id: "unicode.normalize"
          span: [0, 0]
          replacement: ""
        - rule_id: "unicode.normalize"
          span: [1, 1]
          replacement: ""
      anomaly_flags: []
      intake_surface: "caf├⌐∩┐╜"
      intake_tokens: ["caf├⌐", "∩┐╜"]
