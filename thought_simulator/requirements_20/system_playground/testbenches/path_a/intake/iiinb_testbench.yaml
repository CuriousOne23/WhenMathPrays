# ============================================================
# Path A Intake Testbench — IIInB (Bounded Intake Inspection)
# Deterministic Replay-Compatible Testbench for Pipeline Use
# ============================================================

testbench_id: "path_a.intake.iiinb"
version: "2.0.0"
description: "IIInB testbench aligned with InB→IIInB→IE pipeline."

simulation:
  deterministic: true
  replayable: true
  seed: 42

tests:

  # ----------------------------------------------------------
  # 1. Clean Input — No Repairs, No Anomalies
  # ----------------------------------------------------------
  - id: "clean.simple"
    description: "Clean input should produce no repairs or anomalies."
    input: "The dog chased the cat."
    expected:
      iiinb_status: "inspected"
      repair_operations: []
      anomaly_flags: []
      normalized: "The dog chased the cat."

  # ----------------------------------------------------------
  # 2. Unicode Noise Normalization
  # ----------------------------------------------------------
  - id: "unicode.noise"
    description: "Unicode invalid characters should be normalized."
    input: "The dog chased the cat. � �"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "unicode.normalized"
          target: "�"
          proposal: ""
        - type: "unicode.normalized"
          target: "�"
          proposal: ""
      anomaly_flags: []
      normalized: "The dog chased the cat.  "

  # ----------------------------------------------------------
  # 3. Structural Token Repair
  # ----------------------------------------------------------
  - id: "structural.break"
    description: "Malformed structural tokens should be repaired."
    input: "The dog chased the cat <broken>"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "structural.cleaned"
          target: "<broken>"
          proposal: ""
      anomaly_flags: []
      normalized: "The dog chased the cat "

  # ----------------------------------------------------------
  # 4. Empty Input
  # ----------------------------------------------------------
  - id: "empty.input"
    description: "Empty input should produce no repairs or anomalies."
    input: ""
    expected:
      iiinb_status: "inspected"
      repair_operations: []
      anomaly_flags: []
      normalized: ""

  # ----------------------------------------------------------
  # 5. Long Input — Deterministic Replay
  # ----------------------------------------------------------
  - id: "long.input"
    description: "Long input should be normalized deterministically."
    generate_long_input: true
    long_length: 5000
    expected:
      iiinb_status: "inspected"
      repair_operations: []
      anomaly_flags: []
      normalized: ""   # Filled by generator

  # ----------------------------------------------------------
  # 6. Repeating Letters — Collapse
  # ----------------------------------------------------------
  - id: "repeating.letters"
    description: "Excessive repeating letters should be collapsed."
    input: "YYYYYYYYYYEEEEEAAAAHHHH"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "repetition.cleaned"
          target: "YYYYYYYYYY"
          proposal: "YY"
        - type: "repetition.cleaned"
          target: "EEEEE"
          proposal: "EE"
        - type: "repetition.cleaned"
          target: "AAAA"
          proposal: "AA"
        - type: "repetition.cleaned"
          target: "HHHH"
          proposal: "HH"
      anomaly_flags: []
      normalized: "YYEEAAHH"

  # ----------------------------------------------------------
  # 7. Shorthand Expansion
  # ----------------------------------------------------------
  - id: "shorthand.plz"
    description: "Informal shorthand 'plz' should be expanded."
    input: "plz help me"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "shorthand.expanded"
          target: "plz"
          proposal: "please"
      anomaly_flags: []
      normalized: "please help me"

  # ----------------------------------------------------------
  # 8. Misspelling — Transposition
  # ----------------------------------------------------------
  - id: "misspelling.transposition"
    description: "Transposed letters should be repaired."
    input: "hte dog chased the cat"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "spelling.transposed"
          target: "hte"
          proposal: "the"
      anomaly_flags: []
      normalized: "the dog chased the cat"

  # ----------------------------------------------------------
  # 9. Misspelling — Missing Letter
  # ----------------------------------------------------------
  - id: "misspelling.missing"
    description: "Missing-letter misspelling should be repaired."
    input: "The rd fox jumped."
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "spelling.missing"
          target: "rd"
          proposal: "red"
      anomaly_flags: []
      normalized: "The red fox jumped."
  
  # ----------------------------------------------------------
  # 10. Multiple Repairs — Whitespace + Punctuation
  # ----------------------------------------------------------
  - id: "multi.repairs.surface"
    description: "Whitespace and punctuation excess should produce multiple repairs."
    input: "The   dog!!!"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
        - type: "punctuation.cleaned"
          target: "!!!"
          proposal: "!"
      anomaly_flags: []
      normalized: "The dog!"

  # ----------------------------------------------------------
  # 11. Multiple Anomalies — Illegal Characters
  # ----------------------------------------------------------
  - id: "multi.anomalies.illegal"
    description: "Multiple illegal characters should produce multiple anomaly flags."
    input: "Th#e dog$ chased the cat%"
    expected:
      iiinb_status: "inspected"
      repair_operations: []
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "#"
          location: 2
        - type: "illegal_character.unknown"
          target: "$"
          location: 7
        - type: "illegal_character.unknown"
          target: "%"
          location: 20
      normalized: "Th#e dog$ chased the cat%"

  # ----------------------------------------------------------
  # 12. Mixed Repairs + Anomalies
  # ----------------------------------------------------------
  - id: "mixed.repairs.anomalies"
    description: "IIInB should apply repairs and propagate anomalies."
    input: "The   dog@!!!"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
        - type: "punctuation.cleaned"
          target: "!!!"
          proposal: "!"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 6
      normalized: "The dog@!"

  # ----------------------------------------------------------
  # 13. Structural + Surface Repairs + Anomalies
  # ----------------------------------------------------------
  - id: "structural.surface.mixed"
    description: "Structural cleanup, surface repairs, and anomalies together."
    input: "Hello,, world <broken> @"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "structural.cleaned"
          target: "<broken>"
          proposal: ""
        - type: "punctuation.cleaned"
          target: ",,"
          proposal: ","
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 11
      normalized: "Hello, world  @"

  # ----------------------------------------------------------
  # 14. Token Preservation Case (IIInB → IE Compatibility)
  # ----------------------------------------------------------
  - id: "token.preservation"
    description: "IIInB should emit tokens for IE to preserve boundaries."
    input: "the dog"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "case.normalized"
          target: "the"
          proposal: "The"
      anomaly_flags: []
      tokens:
        - "the"
        - "dog"
      normalized: "The dog"

  # ----------------------------------------------------------
  # 15. Replay Determinism — Identical Input → Identical Output
  # ----------------------------------------------------------
  - id: "replay.determinism"
    description: "IIInB output must be identical for identical input."
    input: "café�"
    expected:
      iiinb_status: "inspected"
      repair_operations:
        - type: "unicode.normalized"
          target: "�"
          proposal: ""
      anomaly_flags: []
      normalized: "café"
