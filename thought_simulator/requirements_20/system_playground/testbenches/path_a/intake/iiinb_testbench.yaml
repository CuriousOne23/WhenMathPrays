# ============================================================
# Path A Intake Testbench — IIInB (Bounded Intake Inspection)
# ============================================================
# Purpose:
#   Provide deterministic, replayable scenarios for exercising
#   the bounded intake inspection primitive (IIInB).
#
#   This testbench is intentionally minimal. It is designed
#   for simulation alignment, not requirement coverage.
# ============================================================

testbench_id: "path_a.intake.iiinb"
version: "1.0.0"
description: "Testbench for bounded intake inspection (IIInB)."

simulation:
  deterministic: true
  replayable: true
  seed: 42

tests:

  - id: "clean.simple"
    description: "Clean input should produce no repairs."
    input: "The dog chased the cat."
    expected_iiinb_status: "inspected"
    expected_repairs: []
    expected_normalized: "The dog chased the cat."

  - id: "unicode.noise"
    description: "Unicode noise should be normalized."
    input: "The dog chased the cat. � �"
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "normalize_unicode"
        target: "�"
        replacement: ""
        rule_id: "iiinb.unicode.invalid"
    expected_normalized: "The dog chased the cat.  "

  - id: "structural.break"
    description: "Malformed structural tokens should be repaired."
    input: "The dog chased the cat <broken>"
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "remove_structural_token"
        target: "<broken>"
        replacement: ""
        rule_id: "iiinb.structural.malformed"
    expected_normalized: "The dog chased the cat "

  - id: "empty.input"
    description: "Empty input should produce no repairs."
    input: ""
    expected_iiinb_status: "inspected"
    expected_repairs: []
    expected_normalized: ""

  - id: "long.input"
    description: "Long input should be normalized deterministically."
    generate_long_input: true
    long_length: 5000
    expected_iiinb_status: "inspected"
    expected_repairs: []

  - id: "repeating.letters"
    description: "Excessive repeating letters should be collapsed."
    input: "YYYYYYYYYYEEEEEAAAAHHHH"
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "collapse_repeated_chars"
        target: "YYYYYYYYYY"
        replacement: "YY"
        rule_id: "iiinb.repeating.letters"
      - op: "collapse_repeated_chars"
        target: "EEEEE"
        replacement: "EE"
        rule_id: "iiinb.repeating.letters"
      - op: "collapse_repeated_chars"
        target: "AAAA"
        replacement: "AA"
        rule_id: "iiinb.repeating.letters"
      - op: "collapse_repeated_chars"
        target: "HHHH"
        replacement: "HH"
        rule_id: "iiinb.repeating.letters"
    expected_normalized: "YYEEAAHH"

  - id: "shorthand.plz"
    description: "Informal shorthand 'plz' should be expanded."
    input: "plz help me"
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "expand_shorthand"
        target: "plz"
        replacement: "please"
        rule_id: "iiinb.shorthand.plz"
    expected_normalized: "please help me"

  - id: "misspelling.transposition"
    description: "Transposed letters should be repaired."
    input: "hte dog chased the cat"
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "correct_transposition"
        target: "hte"
        replacement: "the"
        rule_id: "iiinb.spelling.transposed"
    expected_normalized: "the dog chased the cat"

  - id: "misspelling.missing"
    description: "Missing-letter misspelling should be repaired."
    input: "The rd fox jumped."
    expected_iiinb_status: "inspected"
    expected_repairs:
      - op: "correct_missing_letter"
        target: "rd"
        replacement: "red"
        rule_id: "iiinb.spelling.missing"
    expected_normalized: "The red fox jumped."
