# ============================================================
# IIInB Test Selection Toggles
# Path‑A Intake Envelope
# Testbench-driven rule-family toggles (NOT IIInB ontology)
# ============================================================

tests_to_run:

  # ------------------------------------------------------------
  # Spacing Repair Tests
  # ------------------------------------------------------------
  # Covers primitive whitespace issues that produce:
  #   - repair_operations: whitespace.normalized
  spacing: 1

  # ------------------------------------------------------------
  # Punctuation Repair Tests
  # ------------------------------------------------------------
  # Covers primitive punctuation issues that produce:
  #   - repair_operations: punctuation.cleaned
  punctuation: 1

  # ------------------------------------------------------------
  # Control Character Tests
  # ------------------------------------------------------------
  # Covers primitive illegal characters that produce:
  #   - primitive_flags: illegal_character.unknown
  control_chars: 1

  # ------------------------------------------------------------
  # Normalization Tests
  # ------------------------------------------------------------
  # Covers normalization behaviors that produce:
  #   - repair_operations: whitespace.normalized
  #   - repair_operations: punctuation.cleaned
  #   - repair_operations: case.normalized
  normalization: 1

  # ------------------------------------------------------------
  # Deterministic Behavior Tests
  # ------------------------------------------------------------
  # Covers rulechecker validations:
  #   - rulechecker_flags: deterministic.*
  deterministic: 1
