# ============================================================
# IIInB Test Selection Toggles
# Path‑A Intake Envelope
# Testbench-driven rule-family toggles (NOT IIInB ontology)
# Compliant with 20.101 (Rewritten)
# ============================================================

tests_to_run:

  # ------------------------------------------------------------
  # Spacing Repair Tests
  # ------------------------------------------------------------
  # Covers whitespace issues that produce:
  #   - repair_proposals: whitespace.normalize
  spacing: 1

  # ------------------------------------------------------------
  # Punctuation Repair Tests
  # ------------------------------------------------------------
  # Covers punctuation issues that produce:
  #   - repair_proposals: punctuation.clean
  punctuation: 1

  # ------------------------------------------------------------
  # Control Character Tests
  # ------------------------------------------------------------
  # Covers illegal characters that produce:
  #   - anomaly_flags: illegal_character
  control_chars: 1

  # ------------------------------------------------------------
  # Normalization Tests
  # ------------------------------------------------------------
  # Covers normalization behaviors that produce:
  #   - repair_proposals: unicode.normalize
  #   - repair_proposals: case.normalize
  #   - repair_proposals: structural.clean
  normalization: 1

  # ------------------------------------------------------------
  # Deterministic Behavior Tests
  # ------------------------------------------------------------
  # Covers rulechecker validations:
  #   - deterministic.* rule families
  deterministic: 1
