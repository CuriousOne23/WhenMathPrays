# ============================================================
# IE Input — General Mode Stimulus for 20.109 IE Primitive
# Version: 3.1 (Model‑A‑Aligned, Updated for Rule B)
# ============================================================

inputs:

  # ----------------------------------------------------------
  # 1. Basic Repair Case
  # ----------------------------------------------------------
  - id: ie_basic_repair
    description: "IE applies a simple whitespace normalization repair."
    iiinb_output:
      intake_surface: "The   dog"
      intake_tokens: ["The", "dog"]
      repair_proposals:
        - rule_id: "whitespace.normalized"
          span: [0, 1]
          replacement: "The dog"
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 2. Multiple Repairs Case
  # ----------------------------------------------------------
  - id: ie_multiple_repairs
    description: "IE applies multiple deterministic repairs."
    iiinb_output:
      intake_surface: "the dog cccaaattt"
      intake_tokens: ["the", "dog", "cccaaattt"]
      repair_proposals:
        - rule_id: "repetition.cleaned"
          span: [2, 2]
          replacement: "cat"
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 3. Anomaly‑Only Case (Updated for Rule B)
  # ----------------------------------------------------------
  - id: ie_anomaly_only
    description: "IE propagates anomaly when IIInB cannot repair."
    iiinb_output:
      intake_surface: "Th#e dog"
      intake_tokens: ["Th", "#", "e", "dog"]
      repair_proposals:
        - rule_id: "illegal_character.removed"
          span: [1, 1]
          replacement: ""
      anomaly_flags:
        - anomaly_type: "illegal_character.unknown"
          target: "#"
          location: 1
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 4. Mixed Repairs + Anomaly Case (Updated for Rule B)
  # ----------------------------------------------------------
  - id: ie_mixed_case
    description: "IE applies repairs and propagates unresolved anomaly."
    iiinb_output:
      intake_surface: "The   dog @ !!!"
      intake_tokens: ["The", "dog", "@", "!!!"]
      repair_proposals:
        - rule_id: "whitespace.normalized"
          span: [0, 1]
          replacement: "The dog"
        - rule_id: "punctuation.cleaned"
          span: [3, 3]
          replacement: "!"
      anomaly_flags:
        - anomaly_type: "illegal_character.unknown"
          target: "@"
          location: 2
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 5. Structural Preservation Case
  # ----------------------------------------------------------
  - id: ie_structural_preservation
    description: "IE preserves structural tags provided by IIInB."
    iiinb_output:
      intake_surface: "Hello,, world"
      intake_tokens: ["Hello", ",,", "world"]
      repair_proposals:
        - rule_id: "punctuation.cleaned"
          span: [1, 1]
          replacement: ","
      anomaly_flags: []
      structure:
        tags:
          - { type: "block.start", location: 0 }
          - { type: "block.end", location: 12 }
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 6. Token Boundary Case
  # ----------------------------------------------------------
  - id: ie_token_boundary
    description: "IE preserves token boundaries unless repairs modify them."
    iiinb_output:
      intake_surface: "the dog"
      intake_tokens: ["the", "dog"]
      repair_proposals: []   # case normalization forbidden
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 7. Unicode Normalization Case
  # ----------------------------------------------------------
  - id: ie_unicode_normalization
    description: "IE applies deterministic unicode normalization repair."
    iiinb_output:
      intake_surface: "café"
      intake_tokens: ["caf", "é"]
      repair_proposals:
        - rule_id: "unicode.normalized"
          span: [0, 1]
          replacement: "cafe"
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 8. Complex Mixed Case (Updated for Rule B)
  # ----------------------------------------------------------
  - id: ie_complex_mixed
    description: "IE applies multiple repairs and removes illegal characters."
    iiinb_output:
      intake_surface: "The   dog cccaaattt % $"
      intake_tokens: ["The", "dog", "cccaaattt", "%", "$"]
      repair_proposals:
        - rule_id: "whitespace.normalized"
          span: [0, 1]
          replacement: "The dog"
        - rule_id: "repetition.cleaned"
          span: [2, 2]
          replacement: "cat"
        - rule_id: "illegal_character.removed"
          span: [3, 3]
          replacement: ""
        - rule_id: "illegal_character.removed"
          span: [4, 4]
          replacement: ""
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 9. Error Case — Invalid Token Sequence (TP-field validity test)
  # ----------------------------------------------------------
  - id: ie_error_invalid_tokens
    description: "IE emits deterministic error when intake_tokens violates the IIInB→IE contract."
    iiinb_output:
      intake_surface: "hello world"
      intake_tokens: "hello world"   # malformed: must be a list
      repair_proposals: []
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

  # ----------------------------------------------------------
  # 10. Error Case — Missing Required Fields (TP-field validity test)
  # ----------------------------------------------------------
  - id: ie_error_missing_fields
    description: "IE emits deterministic error when required IIInB fields are missing."
    iiinb_output:
      intake_surface: "hello world"
      intake_tokens: ["hello", "world"]
      repair_proposals: null   # malformed: must be a list (possibly empty)
      anomaly_flags: null      # malformed: must be a list (possibly empty)
      metadata:
        iiinb:
          status: "inspected"
