# ============================================================
# IE Tests-To-Run — Execution Control for IE Testbench (v3.3)
# ============================================================

pipeline:
  use_inb: true
  use_iiinb: true
  use_ie: true
  use_cex: false
  use_ce: false
  use_isc: false
  use_tpu: false

tests_to_run:

  - id: ie_basic_repair
    enabled: true
    reason: "Whitespace normalization repair; IE enabled."

  - id: ie_multiple_repairs
    enabled: true
    reason: "Multiple deterministic repairs; IE enabled."

  - id: ie_anomaly_only
    enabled: true
    reason: "Anomaly-only case; IE enabled."

  - id: ie_mixed_case
    enabled: true
    reason: "Mixed repairs + anomaly; IE enabled."

  - id: ie_structural_preservation
    enabled: true
    reason: "IIInB provides structure.tags; IE preserves structure."

  - id: ie_token_boundary
    enabled: true
    reason: "Token preservation case; IE must preserve boundaries."

  - id: ie_unicode_normalization
    enabled: true
    reason: "Unicode normalization repair; IE enabled."

  - id: ie_complex_mixed
    enabled: true
    reason: "Complex mixed repairs + anomalies; IE enabled."

  - id: ie_error_invalid_tokens
    enabled: true
    reason: "Invalid token sequence; IE must emit deterministic error."

  - id: ie_error_missing_fields
    enabled: true
    reason: "Missing required IIInB fields; IE must emit deterministic error."

summary:
  total_tests: 10
  enabled_tests: 10
  disabled_tests: 0
  notes:
    - "All IE tests enabled because IIInB provides required fields."
    - "Structural tests enabled because IIInB provides structure.tags."
    - "Replay determinism implicitly covered by all tests."
