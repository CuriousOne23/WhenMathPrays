# =====================================================================
# IIInB Primitive – Canonical Rule Set (Proposal‑Only, Non‑Mutating)
# Compliant with:
#   - 20.101_iiinb_prim.md (Version 3.2)
#   - 20.105 TP Requirements (proposal/anomaly only)
#   - iiinb_py_struc_pgm.md
#   - iiinb_rulechecker.py
#   - progressive_lineup_testing.md
# =====================================================================

iiinb_rules:
  version: "3.2.0"
  primitive: "IIInB"
  determinism: "strict"

  # -------------------------------------------------------------------
  # RULE ORDERING (MUST remain stable)
  # -------------------------------------------------------------------

  rule_order:
    - tokenize_original_surface
    - detect_illegal_character_control
    - detect_illegal_character_forbidden
    - detect_illegal_character_nonprintable
    - detect_whitespace_anomalies
    - detect_repetition_anomalies
    - detect_punctuation_anomalies
    - detect_unicode_anomaly
    - detect_malformed_token
    - detect_no_entry
    - detect_shorthand
    - detect_spelling_transpose
    - detect_spelling_missing
    - detect_spelling_extra
    - detect_case_normalization_trigger
    - detect_structural_clean
    - detect_long_input_guardrail

  # -------------------------------------------------------------------
  # RULE DEFINITIONS (Proposal‑Only)
  # -------------------------------------------------------------------

  rules:

    tokenize_original_surface:
      description: >
        Deterministic structural tokenization of the original surface.
      produces: [intake_tokens]
      provenance:
        type: "tokenization"
        deterministic: true

    detect_illegal_character_control:
      description: >
        Detect ASCII control characters (< 32) except tab/newline/carriage return.
      produces: [anomaly_flags]
      anomaly_types: [illegal_character.control]
      provenance:
        type: "illegal_character"
        deterministic: true

    detect_illegal_character_forbidden:
      description: >
        Detect forbidden characters (e.g., "@", "$", "%") defined by ontology.
      produces: [anomaly_flags]
      anomaly_types: [illegal_character.forbidden]
      provenance:
        type: "illegal_character"
        deterministic: true

    detect_illegal_character_nonprintable:
      description: >
        Detect nonprintable characters (e.g., U+0007).
      produces: [anomaly_flags]
      anomaly_types: [illegal_character.nonprintable]
      provenance:
        type: "illegal_character"
        deterministic: true

    detect_whitespace_anomalies:
      description: >
        Detect leading, trailing, and multi‑space runs.
      produces: [repair_proposals]
      repair_types: [whitespace.normalize]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_repetition_anomalies:
      description: >
        Detect excessive repeating letters.
      produces: [repair_proposals, anomaly_flags]
      repair_types: [repetition.collapse]
      anomaly_types: [repetition_pattern]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_punctuation_anomalies:
      description: >
        Detect repeated or malformed punctuation clusters.
      produces: [repair_proposals, anomaly_flags]
      repair_types: [punctuation.clean]
      anomaly_types: [punctuation_anomaly]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_unicode_anomaly:
      description: >
        Detect invalid Unicode characters (e.g., U+FFFD).
      produces: [repair_proposals, anomaly_flags]
      repair_types: [unicode.normalize]
      anomaly_types: [unicode_anomaly]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_malformed_token:
      description: >
        Detect malformed structural tokens (e.g., "<broken>").
      produces: [anomaly_flags, repair_proposals]
      repair_types: [structural.clean]
      anomaly_types: [malformed_token]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_no_entry:
      description: >
        Detect dictionary‑absence tokens.
      produces: [anomaly_flags]
      anomaly_types: [no_entry]
      provenance:
        type: "anomaly"
        deterministic: true

    detect_shorthand:
      description: >
        Detect shorthand tokens (e.g., "plz").
      produces: [repair_proposals]
      repair_types: [shorthand.expand]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_spelling_transpose:
      description: >
        Detect transposition misspellings (e.g., "hte").
      produces: [repair_proposals]
      repair_types: [spelling.transpose]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_spelling_missing:
      description: >
        Detect missing‑letter misspellings (e.g., "rd" → "red").
      produces: [repair_proposals]
      repair_types: [spelling.missing]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_spelling_extra:
      description: >
        Detect extra‑letter misspellings.
      produces: [repair_proposals]
      repair_types: [spelling.extra]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_case_normalization_trigger:
      description: >
        Detect deterministic case normalization triggers.
      produces: [repair_proposals]
      repair_types: [case.normalize]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_structural_clean:
      description: >
        Detect structural cleanup opportunities.
      produces: [repair_proposals]
      repair_types: [structural.clean]
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_long_input_guardrail:
      description: >
        Detect long input streams and reject them deterministically.
      produces: [anomaly_flags]
      anomaly_types: [long_input_guardrail]
      provenance:
        type: "anomaly"
        deterministic: true

  # -------------------------------------------------------------------
  # TP ENVELOPE REQUIREMENTS
  # -------------------------------------------------------------------

  tp_envelope:
    required_fields:
      - iiinb_status
      - repair_proposals
      - anomaly_flags
      - intake_surface
      - intake_tokens

  # -------------------------------------------------------------------
  # FORBIDDEN BEHAVIOR
  # -------------------------------------------------------------------

  forbidden_behavior:
    - semantic_inference
    - semantic_repair
    - content_generation
    - surface_mutation
    - token_mutation
    - normalization
    - repair_application
    - nondeterministic_operations
    - external_state_dependency

  # -------------------------------------------------------------------
  # REPLAY DETERMINISM
  # -------------------------------------------------------------------

  replay:
    deterministic: true
    stable_rule_order: true
    stable_token_spans: true
    stable_anomaly_spans: true
    stable_proposal_order: true

  # -------------------------------------------------------------------
  # PYTHON/C++ PARITY
  # -------------------------------------------------------------------

  parity:
    cross_language_identical_output: true
    tokenization_rules_must_match: true
    proposal_rules_must_match: true
    anomaly_detection_must_match: true
