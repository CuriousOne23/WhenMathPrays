# =====================================================================
# IIInB Primitive – Canonical Rule Set (Proposal‑Only, Non‑Mutating)
# Compliant with:
#   - 20.101_iiinb_prim.md (rewritten)
#   - 20.105 TP Requirements (proposal/anomaly only)
#   - iiinb_py_struc_pgm.md (structural program)
#   - iiinb_rulechecker.py (mechanical validator)
#   - progressive_lineup_testing.md (lineup determinism)
# =====================================================================

iiinb_rules:
  version: "2.0.0"
  primitive: "IIInB"
  determinism: "strict"

  # -------------------------------------------------------------------
  # RULE ORDERING (MUST remain stable)
  # IIInB performs *detection only*, never normalization or mutation.
  # -------------------------------------------------------------------

  rule_order:
    - tokenize_original_surface
    - detect_control_characters
    - detect_whitespace_anomalies
    - detect_repetition_anomalies
    - detect_punctuation_anomalies
    - detect_shorthand
    - detect_spelling
    - detect_unicode_noise
    - detect_case_normalization_trigger

  # -------------------------------------------------------------------
  # RULE DEFINITIONS (Proposal‑Only)
  # -------------------------------------------------------------------

  rules:

    tokenize_original_surface:
      description: >
        Tokenize the original intake surface using deterministic,
        language‑agnostic structural tokenization. Tokens MUST come
        from the original surface. No normalization or mutation allowed.
      produces:
        - intake_tokens
      forbidden:
        - semantic_splitting
        - semantic_merging
        - token_mutation
      provenance:
        type: "tokenization"
        deterministic: true

    detect_control_characters:
      description: >
        Detect illegal surface characters that cannot be deterministically
        represented or repaired (ASCII control characters < 32 except space,
        and explicit illegal characters defined by the testbench).
        These defects are unrepairable and MUST be flagged.
      produces:
        - anomaly_flags
      anomaly_types:
        - illegal_character
      provenance:
        type: "illegal_character"
        deterministic: true

    detect_whitespace:
      description: >
        Detect whitespace issues (leading, trailing, multi‑space runs).
        Produces repair_proposals with deterministic token‑span indexing.
      produces:
        - repair_proposals
      repair_types:
        - whitespace.normalize
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_repetition:
      description: >
        Detect repeated-character sequences (e.g., "YYYYYYYY", "EEEEE").
        Produces repair_proposals with deterministic token-span indexing.
      produces:
        - repair_proposals
      repair_types:
        - repetition.collapse
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_punctuation:
      description: >
        Detect repeated or malformed punctuation sequences (e.g., "!!", "??", "...").
        Produces repair_proposals only.
      produces:
        - repair_proposals
      repair_types:
        - punctuation.clean
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_shorthand:
      description: >
        Detect informal shorthand tokens (e.g., "plz") and propose deterministic
        expansions. No mutation allowed.
      produces:
        - repair_proposals
      repair_types:
        - shorthand.expand
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_spelling:
      description: >
        Detect misspellings (transpositions, missing letters) and produce
        deterministic repair_proposals.
      produces:
        - repair_proposals
      repair_types:
        - spelling.transpose
        - spelling.missing
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_unicode_noise:
      description: >
        Detect invalid Unicode characters (e.g., U+FFFD) and produce
        deterministic repair_proposals.
      produces:
        - repair_proposals
      repair_types:
        - unicode.normalize
      provenance:
        type: "repair_proposal"
        deterministic: true

    detect_case_normalization_trigger:
      description: >
        Detect deterministic case‑normalization triggers (e.g., "the dog" → "The dog").
        Produces repair_proposals only. No mutation allowed.
      produces:
        - repair_proposals
      repair_types:
        - case.normalize
      provenance:
        type: "repair_proposal"
        deterministic: true

  # -------------------------------------------------------------------
  # TP ENVELOPE REQUIREMENTS (20.105)
  # -------------------------------------------------------------------

  tp_envelope:
    required_fields:
      - iiinb_status
      - repair_proposals
      - anomaly_flags
      - intake_surface
      - intake_tokens
    field_types:
      iiinb_status: str
      repair_proposals: list
      anomaly_flags: list
      intake_surface: str
      intake_tokens: list
    metadata:
      allowed_write_fields:
        - iiinb_status
      forbidden_write_fields: "*"

  # -------------------------------------------------------------------
  # FORBIDDEN BEHAVIOR (20.101 / 20.105.030)
  # -------------------------------------------------------------------

  forbidden_behavior:
    - semantic_inference
    - semantic_repair
    - content_generation
    - surface_mutation
    - token_mutation
    - normalization
    - repair_application
    - nondeterministic_operations
    - external_state_dependency

  # -------------------------------------------------------------------
  # REPLAY DETERMINISM (20.15)
  # -------------------------------------------------------------------

  replay:
    deterministic: true
    stable_rule_order: true
    stable_token_spans: true
    stable_anomaly_spans: true
    stable_proposal_order: true

  # -------------------------------------------------------------------
  # PYTHON/C++ PARITY
  # -------------------------------------------------------------------

  parity:
    cross_language_identical_output: true
    tokenization_rules_must_match: true
    proposal_rules_must_match: true
    anomaly_detection_must_match: true


