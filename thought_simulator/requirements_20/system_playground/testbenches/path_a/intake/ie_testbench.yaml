# ============================================================
# IE Testbench — Path‑A Intake Envelope (TP-Aligned, v3.1)
# Deterministic Replay Testbench for 20.109 IE Primitive
# ============================================================

tests:

  # ----------------------------------------------------------
  # 1. Repair‑Only Case (No Anomalies)
  # ----------------------------------------------------------
  - id: ie_repair_only_whitespace
    description: "IE applies IIInB whitespace normalization repair"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags: []
      tokens:
        - "The"
        - "dog"
    expected:
      intake:
        normalized_text: "The dog"
        tokens:
          - "The"
          - "dog"
        token_flags:
          - "repaired"
          - "normative"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "whitespace.normalized"
            target: "The   dog"
            proposal: "The dog"
        replay:
          repair_count: 1
          anomaly_count: 0
          applied_repairs:
            - "whitespace.normalized"
          applied_anomalies: []
        ruleset_id: "ie.v3.1"
      error: null

  # ----------------------------------------------------------
  # 2. Repair‑Only Case (Multiple Repairs)
  # ----------------------------------------------------------
  - id: ie_multiple_repairs
    description: "IE applies multiple deterministic repairs"
    iiinb_output:
      repair_operations:
        - type: "repetition.cleaned"
          target: "cccchhhhhaaassseeedddd"
          proposal: "chased"
        - type: "case.normalized"
          target: "the dog chased the cat"
          proposal: "The dog chased the cat"
        - type: "punctuation.cleaned"
          target: "!!!"
          proposal: "!"
      anomaly_flags: []
      tokens:
        - "the"
        - "dog"
        - "cccchhhhhaaassseeedddd"
        - "the"
        - "cat"
        - "!!!"
    expected:
      intake:
        normalized_text: "The dog chased the cat!"
        tokens:
          - "The"
          - "dog"
          - "chased"
          - "the"
          - "cat"
          - "!"
        token_flags:
          - "repaired"
          - "normative"
          - "repaired"
          - "normative"
          - "normative"
          - "normative"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "repetition.cleaned"
            target: "cccchhhhhaaassseeedddd"
            proposal: "chased"
          - kind: "repair"
            type: "case.normalized"
            target: "the dog chased the cat"
            proposal: "The dog chased the cat"
          - kind: "repair"
            type: "punctuation.cleaned"
            target: "!!!"
            proposal: "!"
        replay:
          repair_count: 3
          anomaly_count: 0
          applied_repairs:
            - "repetition.cleaned"
            - "case.normalized"
            - "punctuation.cleaned"
          applied_anomalies: []
        ruleset_id: "ie.v3.1"
      error: null

  # ----------------------------------------------------------
  # 3. Anomaly‑Only Case (No Repairs)
  # ----------------------------------------------------------
  - id: ie_anomaly_only
    description: "IE propagates anomaly when IIInB cannot repair"
    iiinb_output:
      repair_operations: []
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "#"
          location: 2
      tokens:
        - "Th#e"
        - "dog"
        - "chased"
        - "the"
        - "cat"
    expected:
      intake:
        normalized_text: "Th#e dog chased the cat"
        tokens:
          - "Th#e"
          - "dog"
          - "chased"
          - "the"
          - "cat"
        token_flags:
          - "anomalous"
          - "normative"
          - "normative"
          - "normative"
          - "normative"
      metadata:
        repair_annotations:
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "#"
            location: 2
        replay:
          repair_count: 0
          anomaly_count: 1
          applied_repairs: []
          applied_anomalies:
            - "illegal_character.unknown"
        ruleset_id: "ie.v3.1"
      error: null

  # ----------------------------------------------------------
  # 4. Mixed Repairs + Anomaly
  # ----------------------------------------------------------
  - id: ie_mixed_repairs_anomaly
    description: "IE applies repairs and propagates unresolved anomaly"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 7
      tokens:
        - "The"
        - "dog"
        - "@"
        - "!!!"
    expected:
      intake:
        normalized_text: "The dog@"
        tokens:
          - "The"
          - "dog@"
        token_flags:
          - "repaired"
          - "anomalous"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "whitespace.normalized"
            target: "The   dog"
            proposal: "The dog"
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "@"
            location: 7
        replay:
          repair_count: 1
          anomaly_count: 1
          applied_repairs:
            - "whitespace.normalized"
          applied_anomalies:
            - "illegal_character.unknown"
        ruleset_id: "ie.v3.1"
      error: null

  # ----------------------------------------------------------
  # 5. Structural Normalization Case
  # ----------------------------------------------------------
  - id: ie_structural_tags
    description: "IE preserves structural tags from IIInB"
    iiinb_output:
      repair_operations:
        - type: "punctuation.cleaned"
          target: "Hello,,"
          proposal: "Hello,"
      anomaly_flags: []
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12
      tokens:
        - "Hello,,"
        - "world"
    expected:
      intake:
        normalized_text: "Hello, world"
        tokens:
          - "Hello,"
          - "world"
        token_flags:
          - "repaired"
          - "normative"
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "punctuation.cleaned"
            target: "Hello,,"
            proposal: "Hello,"
        replay:
          repair_count: 1
          anomaly_count: 0
          applied_repairs:
            - "punctuation.cleaned"
          applied_anomalies: []
        ruleset_id: "ie.v3.1"
      error: null

  # ----------------------------------------------------------
  # 6. Token Preservation Case
  # ----------------------------------------------------------
  - id: ie_token_preservation
    description: "IE preserves token boundaries exactly"
    iiinb_output:
      repair_operations:
        - type: "case.normalized"
          target: "the"
          proposal: "The"
      anomaly_flags: []
      tokens:
        - "the
