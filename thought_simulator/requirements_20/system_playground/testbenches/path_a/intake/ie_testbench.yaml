# ============================================================
# IE Testbench — TP‑Aligned (Model‑A, Version 3.1)
# ============================================================

tests:

  # ----------------------------------------------------------
  # 1. Basic Repair Case
  # ----------------------------------------------------------
  - id: ie_basic_repair
    description: "IE applies a simple whitespace normalization repair."
    iiinb_output:
      intake_surface: "The   dog"
      intake_tokens: ["The", "dog"]
      repair_proposals:
        - rule_id: "whitespace.normalized"
          span: [0, 1]
          replacement: "The dog"
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

    expected:
      intake:
        ie_tokens: ["The", "dog"]
        token_flags: ["repaired", "normative"]
        normalized_text: "The dog"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations:
          - { rule_id: "whitespace.normalized", span: [0,1] }
        replay: {}
        ruleset_id: "ie_rules_v3.1"
      error: null

  # ----------------------------------------------------------
  # 2. Multiple Repairs Case
  # ----------------------------------------------------------
  - id: ie_multiple_repairs
    description: "IE applies multiple deterministic repairs."
    iiinb_output:
      intake_surface: "the dog cccaaattt"
      intake_tokens: ["the", "dog", "cccaaattt"]
      repair_proposals:
        - rule_id: "repetition.cleaned"
          span: [2, 2]
          replacement: "cat"
        - rule_id: "case.normalized"
          span: [0, 1]
          replacement: "The dog"
      anomaly_flags: []
      metadata:
        iiinb:
          status: "inspected"

    expected:
      intake:
        ie_tokens:
          - "the"
          - "dog"
          - "cat"
        token_flags:
          - "normative"
          - "normative"
          - "repaired"
        normalized_text: "the dog cat"
      structure:
        tags: []
        spans: []
        markup: []
      metadata:
        repair_annotations:
          - { rule_id: "repetition.cleaned", span: [2,2] }
          - { rule_id: "case.normalized", span: [0,1] }
        replay: {}
        ruleset_id: "ie_rules_v3.1"
      error: null

  # ----------------------------------------------------------
  # 3. Anomaly‑Only Case (Corrected)
  # ----------------------------------------------------------
  - id: ie_anomaly_only
    description: "IE applies deterministic removal of illegal character and performs composite merge."
  
    iiinb_output:
      intake_surface: "Th#e dog"
      intake_tokens: ["Th", "#", "e", "dog"]
  
      repair_proposals:
        - rule_id: "illegal_character.removed"
          span: [1, 1]
          replacement: ""
  
      anomaly_flags:
        - anomaly_type: "illegal_character.unknown"
          target: "#"
          location: 1
        - anomaly_type: "no_entry"
          target: "Th"
          location: 0
        - anomaly_type: "no_entry"
          target: "e"
          location: 2
  
      metadata:
        iiinb:
          status: "inspected"
  
    expected:
      intake:
        ie_tokens: ["The", "dog"]
        token_flags: ["repaired", "normative"]
        normalized_text: "The dog"
  
      structure:
        tags: []
        spans: []
        markup: []
  
      metadata:
        repair_annotations:
          - { rule_id: "illegal_character.removed", span: [1,1] }
          - { anomaly_type: "illegal_character.unknown", location: 1 }
          - { anomaly_type: "no_entry", location: 0 }
          - { anomaly_type: "no_entry", location: 2 }
        replay: {}
        ruleset_id: "ie_rules_v3.1"
  
      error: null

  # ----------------------------------------------------------
  # 4. Mixed Repairs + Anomaly Case
  # ----------------------------------------------------------
  - id: ie_mixed_case
    description: "IE applies repairs and propagates unresolved anomaly."
    iiinb_output:
      intake_surface: "The   dog @!!!"
      intake_tokens: ["The", "dog", "@", "!!!"]
    
      repair_proposals:
        - rule_id: "whitespace.normalized"
          span: [0, 1]
          replacement: "The dog"
    
        - rule_id: "illegal_character.removed"
          span: [2, 2]
          replacement: ""
    
        - rule_id: "punctuation.normalized"
          span: [3, 3]
          replacement: "!"

    expected:
      intake:
        ie_tokens: ["The", "dog", "", "!"]
        token_flags: ["repaired", "normative", "repaired", "repaired"]
        normalized_text: "The dog !"


# ----------------------------------------------------------
# 5. Structural Preservation Case (Corrected)
# ----------------------------------------------------------
- id: ie_structural_preservation
  description: "IE preserves structural tags and applies deterministic punctuation normalization."

  iiinb_output:
    intake_surface: "Hello,, world"
    intake_tokens: ["Hello", ",,", "world"]

    repair_proposals:
      - rule_id: "punctuation.cleaned"
        span: [1, 1]
        replacement: ","

    anomaly_flags: []

    metadata:
      iiinb:
        status: "inspected"

  expected:
    intake:
      ie_tokens: ["Hello", ",", "world"]
      token_flags: ["normative", "repaired", "normative"]
      normalized_text: "Hello , world"

    structure:
      tags: []
      spans: []
      markup: []

    metadata:
      repair_annotations:
        - { rule_id: "punctuation.cleaned", span: [1,1] }
      replay: {}
      ruleset_id: "ie_rules_v3.1"

    error: null


# ----------------------------------------------------------
# 6. Token Boundary Case (Corrected)
# ----------------------------------------------------------
- id: ie_token_boundary
  description: "IE preserves token boundaries; IIInB must NOT propose case normalization."

  iiinb_output:
    intake_surface: "the dog"
    intake_tokens: ["the", "dog"]

    repair_proposals: []   # case normalization forbidden

    anomaly_flags: []

    metadata:
      iiinb:
        status: "inspected"

  expected:
    intake:
      ie_tokens: ["the", "dog"]
      token_flags: ["normative", "normative"]
      normalized_text: "the dog"

    structure:
      tags: []
      spans: []
      markup: []

    metadata:
      repair_annotations: []
      replay: {}
      ruleset_id: "ie_rules_v3.1"

    error: null


# ----------------------------------------------------------
# 7. Unicode Normalization Case (Corrected)
# ----------------------------------------------------------
- id: ie_unicode_normalization
  description: "IE applies deterministic unicode normalization proposed by IIInB."

  iiinb_output:
    intake_surface: "café"
    intake_tokens: ["caf", "é"]
  
    repair_proposals:
      - rule_id: "unicode.normalized"
        span: [0, 1]
        replacement: "cafe"
  
    anomaly_flags: []
  
    metadata:
      iiinb:
        status: "inspected"
  
  expected:
    intake:
      ie_tokens: ["cafe"]
      token_flags: ["repaired"]
      normalized_text: "cafe"
  
    structure:
      tags: []
      spans: []
      markup: []
  
    metadata:
      repair_annotations:
        - { rule_id: "unicode.normalized", span: [0,1] }
      replay: {}
      ruleset_id: "ie_rules_v3.1"
  
    error: null


# ----------------------------------------------------------
# 8. Complex Mixed Case (Corrected)
# ----------------------------------------------------------
- id: ie_complex_mixed
  description: "IE applies multiple deterministic repairs; illegal characters are removed."

  iiinb_output:
    intake_surface: "The   dog cccaaattt % $"
    intake_tokens: ["The", "dog", "cccaaattt", "%", "$"]

    repair_proposals:
      - rule_id: "whitespace.normalized"
        span: [0, 1]
        replacement: "The dog"

      - rule_id: "repetition.cleaned"
        span: [2, 2]
        replacement: "cat"

      - rule_id: "illegal_character.removed"
        span: [3, 3]
        replacement: ""

      - rule_id: "illegal_character.removed"
        span: [4, 4]
        replacement: ""

    anomaly_flags: []   # anomalies resolved by deterministic repairs

    metadata:
      iiinb:
        status: "inspected"

  expected:
    intake:
      ie_tokens: ["The", "dog", "cat"]
      token_flags: ["repaired", "normative", "repaired"]
      normalized_text: "The dog cat"

    structure:
      tags: []
      spans: []
      markup: []

    metadata:
      repair_annotations:
        - { rule_id: "whitespace.normalized", span: [0,1] }
        - { rule_id: "repetition.cleaned", span: [2,2] }
        - { rule_id: "illegal_character.removed", span: [3,3] }
        - { rule_id: "illegal_character.removed", span: [4,4] }
      replay: {}
      ruleset_id: "ie_rules_v3.1"

    error: null


# ----------------------------------------------------------
# 9. Error Case — Invalid Token Sequence (TP-field validity test)
# ----------------------------------------------------------
# This test does NOT represent a real IIInB output.
# IIInB would NEVER produce intake_surface + null/malformed intake_tokens.
# Instead, this test verifies that IE correctly rejects malformed TP fields
# in the IIInB → IE transfer object. IE is a deterministic replay primitive
# and MUST NOT attempt to tokenize, infer, or repair malformed token lists.
# IE must fail deterministically when intake_tokens is not a list.

- id: ie_error_invalid_tokens
  description: "IE emits deterministic error when intake_tokens violates the IIInB→IE contract."

  iiinb_output:
    intake_surface: "hello world"
    intake_tokens: "hello world"   # malformed: should be a list of tokens
    repair_proposals: []
    anomaly_flags: []

    metadata:
      iiinb:
        status: "inspected"

  expected:
    intake:
      ie_tokens: []
      token_flags: []
      normalized_text: ""

    structure:
      tags: []
      spans: []
      markup: []

    metadata:
      repair_annotations: []
      replay: {}
      ruleset_id: "ie_rules_v3.1"

    error:
      type: "invalid_tokens"


# ----------------------------------------------------------
# 10. Error Case — Missing Required Fields (TP-field validity test)
# ----------------------------------------------------------
# This test does NOT represent a real IIInB output.
# IIInB ALWAYS produces repair_proposals (possibly empty) and anomaly_flags (possibly empty).
# This test verifies that IE correctly rejects malformed TP fields in the IIInB→IE
# transfer object. Missing required fields is a contract violation. IE MUST NOT attempt
# to infer, reconstruct, or repair missing fields. IE must fail deterministically.

- id: ie_error_missing_fields
  description: "IE emits deterministic error when required IIInB→IE fields are missing."

  iiinb_output:
    intake_surface: "hello world"
    intake_tokens: ["hello", "world"]

    # These fields are REQUIRED by the IIInB→IE contract.
    # Setting them to null simulates a malformed TP object.
    repair_proposals: null
    anomaly_flags: null

    metadata:
      iiinb:
        status: "inspected"

  expected:
    intake:
      ie_tokens: []
      token_flags: []
      normalized_text: ""

    structure:
      tags: []
      spans: []
      markup: []

    metadata:
      repair_annotations: []
      replay: {}
      ruleset_id: "ie_rules_v3.1"

    error:
      type: "missing_fields"

