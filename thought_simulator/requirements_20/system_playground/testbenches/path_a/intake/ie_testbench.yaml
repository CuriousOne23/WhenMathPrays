# ============================================================
# IE Testbench — Path‑A Intake Envelope
# Deterministic Replay Testbench for 20.109 IE Primitive
# ============================================================

tests:

  # ----------------------------------------------------------
  # 1. Repair‑Only Case (No Anomalies)
  # ----------------------------------------------------------
  - id: ie_repair_only_whitespace
    description: "IE applies IIInB whitespace normalization repair"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags: []
    expected:
      repairs:
        - "whitespace.normalized"
      normalized: "The dog"
      ie_status: "repaired"
      anomaly_flags: []

  # ----------------------------------------------------------
  # 2. Repair‑Only Case (Multiple Repairs)
  # ----------------------------------------------------------
  - id: ie_multiple_repairs
    description: "IE applies multiple deterministic repairs"
    iiinb_output:
      repair_operations:
        - type: "repetition.cleaned"
          target: "cccchhhhhaaassseeedddd"
          proposal: "chased"
        - type: "case.normalized"
          target: "the dog chased the cat"
          proposal: "The dog chased the cat"
        - type: "punctuation.cleaned"
          target: "The dog chased the cat!!!"
          proposal: "The dog chased the cat!"
      anomaly_flags: []
    expected:
      repairs:
        - "repetition.cleaned"
        - "case.normalized"
        - "punctuation.cleaned"
      normalized: "The dog chased the cat!"
      ie_status: "repaired"
      anomaly_flags: []

  # ----------------------------------------------------------
  # 3. Anomaly‑Only Case (No Repairs)
  # ----------------------------------------------------------
  - id: ie_anomaly_only
    description: "IE propagates anomaly when IIInB cannot repair"
    iiinb_output:
      repair_operations: []
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "#"
          location: 2
    expected:
      repairs:
        - "anomaly.illegal_character.unknown"
      normalized: "Th#e dog chased the cat"
      ie_status: "anomaly_propagated"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "#"
          location: 2

  # ----------------------------------------------------------
  # 4. Mixed Repairs + Anomaly
  # ----------------------------------------------------------
  - id: ie_mixed_repairs_anomaly
    description: "IE applies repairs and propagates unresolved anomaly"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 7
    expected:
      repairs:
        - "whitespace.normalized"
        - "anomaly.illegal_character.unknown"
      normalized: "The dog@"
      ie_status: "anomaly_propagated"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 7

  # ----------------------------------------------------------
  # 5. Structural Normalization Case
  # ----------------------------------------------------------
  - id: ie_structural_tags
    description: "IE preserves structural tags from IIInB"
    iiinb_output:
      repair_operations:
        - type: "punctuation.cleaned"
          target: "Hello,, world"
          proposal: "Hello, world"
      anomaly_flags: []
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12
    expected:
      repairs:
        - "punctuation.cleaned"
      normalized: "Hello, world"
      ie_status: "repaired"
      anomaly_flags: []
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12

  # ----------------------------------------------------------
  # 6. Token Preservation Case
  # ----------------------------------------------------------
  - id: ie_token_preservation
    description: "IE preserves token boundaries exactly"
    iiinb_output:
      repair_operations:
        - type: "case.normalized"
          target: "the dog"
          proposal: "The dog"
      anomaly_flags: []
      tokens:
        - "the"
        - "dog"
    expected:
      repairs:
        - "case.normalized"
      normalized: "The dog"
      ie_status: "repaired"
      anomaly_flags: []
      tokens:
        - "The"
        - "dog"

  # ----------------------------------------------------------
  # 7. Replay Determinism Case
  # ----------------------------------------------------------
  - id: ie_replay_determinism
    description: "IE output must be identical for identical IIInB output"
    iiinb_output:
      repair_operations:
        - type: "unicode.normalized"
          target: "café"
          proposal: "cafe"
      anomaly_flags: []
    expected:
      repairs:
        - "unicode.normalized"
      normalized: "cafe"
      ie_status: "repaired"
      anomaly_flags: []

  # ----------------------------------------------------------
  # 8. Complex Mixed Case (Multiple Repairs + Multiple Anomalies)
  # ----------------------------------------------------------
  - id: ie_complex_mixed
    description: "IE applies all repairs and propagates all anomalies"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
        - type: "repetition.cleaned"
          target: "cccaaattt"
          proposal: "cat"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "%"
          location: 3
        - type: "illegal_character.unknown"
          target: "$"
          location: 9
    expected:
      repairs:
        - "whitespace.normalized"
        - "repetition.cleaned"
        - "anomaly.illegal_character.unknown"
        - "anomaly.illegal_character.unknown"
      normalized: "The dog cat"
      ie_status: "anomaly_propagated"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "%"
          location: 3
        - type: "illegal_character.unknown"
          target: "$"
          location: 9
