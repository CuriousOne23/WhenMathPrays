# ============================================================
# Path A Intake Testbench — IE (Intake Envelope)
# ============================================================
# Purpose:
#   Provide deterministic, replayable scenarios for exercising
#   the Intake Envelope (IE) primitive.
#
#   This trimmed version includes only the first 3 tests
#   to validate testbench flow before expanding to full 7.
# ============================================================

testbench_id: "path_a.intake.ie"
version: "1.0.1"
description: "Trimmed IE testbench (3 tests) for flow validation."

simulation:
  deterministic: true
  replayable: true
  seed: 42

tests:

  # ----------------------------------------------------------
  # 1. Clean input — no normalization needed
  # ----------------------------------------------------------
  - id: "clean.simple"
    description: "Clean input should pass through unchanged."
    input: "The dog chased the cat."
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs: []
    expected_normalized: "The dog chased the cat."

  # ----------------------------------------------------------
  # 2. Whitespace normalization
  # ----------------------------------------------------------
  - id: "normalize.whitespace"
    description: "Excess whitespace should be normalized."
    input: "   The   dog   chased   the   cat.   "
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "whitespace.normalized"
    expected_normalized: "The dog chased the cat."

  # ----------------------------------------------------------
  # 3. Punctuation cleanup
  # ----------------------------------------------------------
  - id: "normalize.punctuation"
    description: "Excess punctuation should be repaired."
    input: "The dog chased the cat!!!"
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "punctuation.cleaned"
    expected_normalized: "The dog chased the cat!"

  # ----------------------------------------------------------
  # 4. Excessive whitespace detection (future IE behavior)
  # ----------------------------------------------------------
  - id: "detect.excessive_whitespace"
    description: "IE should detect excessive whitespace even if repairs are not yet implemented."
    input: "The    dog      chased   the   cat."
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "whitespace.detected"
    expected_normalized: "The dog chased the cat."

  # ----------------------------------------------------------
  # 5. Excessive punctuation detection (future IE behavior)
  # ----------------------------------------------------------
  - id: "detect.excessive_punctuation"
    description: "IE should detect excessive punctuation even if repairs are not yet implemented."
    input: "The dog chased the cat!!!!!!"
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "punctuation.detected"
    expected_normalized: "The dog chased the cat!"

  # ----------------------------------------------------------
  # 6. Whitespace repair (future IE behavior)
  # ----------------------------------------------------------
  - id: "repair.whitespace"
    description: "IE should repair excessive whitespace."
    input: "   The    dog   chased    the   cat.   "
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "whitespace.normalized"
    expected_normalized: "The dog chased the cat."

  # ----------------------------------------------------------
  # 7. Punctuation repair (future IE behavior)
  # ----------------------------------------------------------
  - id: "repair.punctuation"
    description: "IE should repair excessive punctuation."
    input: "The dog chased the cat!!!!"
    expected_inb_status: "accepted"
    expected_iiinb_status: "inspected"
    expected_ie_status: "normalized"
    expected_repairs:
      - "punctuation.cleaned"
    expected_normalized: "The dog chased the cat!"
