# ============================================================
# IE Testbench — Path‑A Intake Envelope (TP-Aligned)
# Deterministic Replay Testbench for 20.109 IE Primitive
# ============================================================

tests:

  # ----------------------------------------------------------
  # 1. Repair‑Only Case (No Anomalies)
  # ----------------------------------------------------------
  - id: ie_repair_only_whitespace
    description: "IE applies IIInB whitespace normalization repair"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags: []
    expected:
      intake:
        normalized_text: "The dog"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "whitespace.normalized"
            target: "The   dog"
            proposal: "The dog"
        replay:
          repair_count: 1
          anomaly_count: 0
      error: null

  # ----------------------------------------------------------
  # 2. Repair‑Only Case (Multiple Repairs)
  # ----------------------------------------------------------
  - id: ie_multiple_repairs
    description: "IE applies multiple deterministic repairs"
    iiinb_output:
      repair_operations:
        - type: "repetition.cleaned"
          target: "cccchhhhhaaassseeedddd"
          proposal: "chased"
        - type: "case.normalized"
          target: "the dog chased the cat"
          proposal: "The dog chased the cat"
        - type: "punctuation.cleaned"
          target: "The dog chased the cat!!!"
          proposal: "The dog chased the cat!"
      anomaly_flags: []
    expected:
      intake:
        normalized_text: "The dog chased the cat!"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "repetition.cleaned"
            target: "cccchhhhhaaassseeedddd"
            proposal: "chased"
          - kind: "repair"
            type: "case.normalized"
            target: "the dog chased the cat"
            proposal: "The dog chased the cat"
          - kind: "repair"
            type: "punctuation.cleaned"
            target: "The dog chased the cat!!!"
            proposal: "The dog chased the cat!"
        replay:
          repair_count: 3
          anomaly_count: 0
      error: null

  # ----------------------------------------------------------
  # 3. Anomaly‑Only Case (No Repairs)
  # ----------------------------------------------------------
  - id: ie_anomaly_only
    description: "IE propagates anomaly when IIInB cannot repair"
    iiinb_output:
      repair_operations: []
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "#"
          location: 2
    expected:
      intake:
        normalized_text: "Th#e dog chased the cat"
      metadata:
        repair_annotations:
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "#"
            location: 2
        replay:
          repair_count: 0
          anomaly_count: 1
      error: null

  # ----------------------------------------------------------
  # 4. Mixed Repairs + Anomaly
  # ----------------------------------------------------------
  - id: ie_mixed_repairs_anomaly
    description: "IE applies repairs and propagates unresolved anomaly"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "@"
          location: 7
    expected:
      intake:
        normalized_text: "The dog@"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "whitespace.normalized"
            target: "The   dog"
            proposal: "The dog"
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "@"
            location: 7
        replay:
          repair_count: 1
          anomaly_count: 1
      error: null

  # ----------------------------------------------------------
  # 5. Structural Normalization Case
  # ----------------------------------------------------------
  - id: ie_structural_tags
    description: "IE preserves structural tags from IIInB"
    iiinb_output:
      repair_operations:
        - type: "punctuation.cleaned"
          target: "Hello,, world"
          proposal: "Hello, world"
      anomaly_flags: []
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12
    expected:
      intake:
        normalized_text: "Hello, world"
      structure:
        tags:
          - type: "block.start"
            location: 0
          - type: "block.end"
            location: 12
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "punctuation.cleaned"
            target: "Hello,, world"
            proposal: "Hello, world"
        replay:
          repair_count: 1
          anomaly_count: 0
      error: null

  # ----------------------------------------------------------
  # 6. Token Preservation Case
  # ----------------------------------------------------------
  - id: ie_token_preservation
    description: "IE preserves token boundaries exactly"
    iiinb_output:
      repair_operations:
        - type: "case.normalized"
          target: "the dog"
          proposal: "The dog"
      anomaly_flags: []
      tokens:
        - "the"
        - "dog"
    expected:
      intake:
        normalized_text: "The dog"
        tokens:
          - "The"
          - "dog"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "case.normalized"
            target: "the dog"
            proposal: "The dog"
        replay:
          repair_count: 1
          anomaly_count: 0
      error: null

  # ----------------------------------------------------------
  # 7. Replay Determinism Case
  # ----------------------------------------------------------
  - id: ie_replay_determinism
    description: "IE output must be identical for identical IIInB output"
    iiinb_output:
      repair_operations:
        - type: "unicode.normalized"
          target: "café"
          proposal: "cafe"
      anomaly_flags: []
    expected:
      intake:
        normalized_text: "cafe"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "unicode.normalized"
            target: "café"
            proposal: "cafe"
        replay:
          repair_count: 1
          anomaly_count: 0
      error: null

  # ----------------------------------------------------------
  # 8. Complex Mixed Case (Multiple Repairs + Multiple Anomalies)
  # ----------------------------------------------------------
  - id: ie_complex_mixed
    description: "IE applies all repairs and propagates all anomalies"
    iiinb_output:
      repair_operations:
        - type: "whitespace.normalized"
          target: "The   dog"
          proposal: "The dog"
        - type: "repetition.cleaned"
          target: "cccaaattt"
          proposal: "cat"
      anomaly_flags:
        - type: "illegal_character.unknown"
          target: "%"
          location: 3
        - type: "illegal_character.unknown"
          target: "$"
          location: 9
    expected:
      intake:
        normalized_text: "The dog cat"
      metadata:
        repair_annotations:
          - kind: "repair"
            type: "whitespace.normalized"
            target: "The   dog"
            proposal: "The dog"
          - kind: "repair"
            type: "repetition.cleaned"
            target: "cccaaattt"
            proposal: "cat"
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "%"
            location: 3
          - kind: "anomaly"
            type: "illegal_character.unknown"
            target: "$"
            location: 9
        replay:
          repair_count: 2
          anomaly_count: 2
      error: null
