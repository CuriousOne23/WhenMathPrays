# ============================================================
# Path A Intake Testbench — InB / IIInB / IE
# ============================================================

testbench_id: "path_a.intake.inb"
version: "1.0.0"
description: "Testbench for Path A intake boundary (InB), bounded inspection (IIInB), and IE normalization."

simulation:
  deterministic: true
  replayable: true
  seed: 42

tests:

  - id: "clean.simple"
    description: "Simple clean input with no defects."
    input: "The dog chased the cat."
    expected_defects: []
    expected_repairs: []
    expected_normalized: "The dog chased the cat."
    expected_failure: false

  - id: "messy.whitespace"
    description: "Whitespace normalization and punctuation cleanup."
    input: "   The   dog   chased   the   cat   !!! "
    expected_defects:
      - "whitespace.excess"
      - "punctuation.excess"
    expected_repairs: []
    expected_normalized: "The dog chased the cat."
    expected_failure: true

  - id: "unicode.noise"
    description: "Input containing stray unicode artifacts."
    input: "The dog chased the cat. � �"
    expected_defects:
      - "unicode.invalid"
    expected_repairs: []
    expected_normalized: "The dog chased the cat. � �"
    expected_failure: true

  - id: "structural.break"
    description: "Input containing malformed structural tokens."
    input: "The dog chased the cat <broken>"
    expected_defects:
      - "structural.malformed"
    expected_repairs: []
    expected_normalized: "The dog chased the cat <broken>"
    expected_failure: true

  - id: "empty.input"
    description: "Empty input should trigger bounded defect."
    input: ""
    expected_defects:
      - "empty.input"
    expected_repairs: []
    expected_normalized: ""
    expected_failure: true

  - id: "long.input"
    description: "Long input should be treated as clean (stub behavior)."
    generate_long_input: true
    long_length: 5000
    expected_defects: []
    expected_repairs: []
    expected_long_input: true
    expected_failure: true

  - id: multi.defects
    input: "Bad   text!!! with � and <broken> tokens."
    expected_defects:
      - whitespace.excess
      - punctuation.excess
      - unicode.invalid
      - structural.malformed
    expected_failure: true

