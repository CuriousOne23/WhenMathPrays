# ============================================================
# InB Testbench — Path‑A Intake Envelope
# Deterministic Error/No‑Error Boundary for 20.100 InB Primitive
# ============================================================

tests:

  - id: inb_baseline_no_error
    description: "Clean input — no defects expected"
    tp:
      raw_input: "The dog chased the cat."
      tokens: []
    expected_defects: []
    expected_failure: False

  - id: inb_whitespace_anomaly
    description: "Excess whitespace should trigger whitespace.excess"
    tp:
      raw_input: "The   dog"
      tokens: []
    expected_defects:
      - "whitespace.excess"
    expected_failure: False

  - id: inb_multiple_surface_anomalies
    description: "Multiple anomalies: whitespace + punctuation"
    tp:
      raw_input: "The   dog!!!"
      tokens: []
    expected_defects:
      - "whitespace.excess"
      - "punctuation.excess"
    expected_failure: False

  - id: inb_illegal_character_only
    description: "Unicode invalid character should trigger unicode.invalid"
    tp:
      raw_input: "Th�e dog"
      tokens: []
    expected_defects:
      - "unicode.invalid"
    expected_failure: False

  - id: inb_mixed_whitespace_illegal
    description: "Whitespace + unicode invalid"
    tp:
      raw_input: "The   dog�"
      tokens: []
    expected_defects:
      - "whitespace.excess"
      - "unicode.invalid"
    expected_failure: False

  - id: inb_structural_tags_present
    description: "Malformed structural token should trigger structural.malformed"
    tp:
      raw_input: "Hello <broken> world"
      tokens: []
    expected_defects:
      - "structural.malformed"
    expected_failure: False

  - id: inb_tokenizable_input
    description: "Simple tokenizable input — no defects expected"
    tp:
      raw_input: "the dog"
      tokens: []
    expected_defects: []
    expected_failure: False

  - id: inb_unicode_normalization_opportunity
    description: "Unicode invalid character should trigger unicode.invalid"
    tp:
      raw_input: "café�"
      tokens: []
    expected_defects:
      - "unicode.invalid"
    expected_failure: False

  - id: inb_complex_mixed_case
    description: "Whitespace + punctuation + unicode invalid"
    tp:
      raw_input: "The   dog!!!�"
      tokens: []
    expected_defects:
      - "whitespace.excess"
      - "punctuation.excess"
      - "unicode.invalid"
    expected_failure: False
