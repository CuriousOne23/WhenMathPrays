# debug_setup.yaml
# Defines which documentation files the debugger should load and how they are grouped.

dimensions:
  - segment_geometry
  - role_geometry
  - constraint_geometry
  - smoothing_geometry
  - identity_geometry
  - meaning_geometry

fields:
  - struct_segments
  - segment_tokens
  - struct_roles
  - constraints_matched
  - constraints_unmatched
  - constraint_residue
  - smoothing_operations
  - semantic_adjacent_cues
  - basin_residue
  - truth_relation
  - semantic_core
  - idob_packet

primitives:
  - SOB
  - SROB
  - CnOB
  - SmOB
  - IdOB

examples:
  - placeholder

# Debugger behavior flags (static, no scanning/searching)
settings:
  include_links: true
  include_examples: true
  include_effects: true
  include_allowed_values: true
  include_definitions: true
