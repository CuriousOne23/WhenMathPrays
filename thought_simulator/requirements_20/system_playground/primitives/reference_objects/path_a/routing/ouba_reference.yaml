reference_object_name: OuBA
reference_object_class: semantic
semantic_class: path_a_commit_primitive
version: 1.0.0

purpose:
  short: >
    Defines commit geometry, invariants, admissible envelopes, and semantic-snapshot
    constraints for the Output Basin — Path A Commit (OuBA).
  long: >
    OuBA commits the finalized Path-A meaning state into an immutable semantic snapshot
    containing semantic_core and meaning-bearing fields. OuBA freezes meaning-layer
    state, writes commit-time metadata, resolution flags, and DF-readiness indicators,
    and produces the committed TP snapshot consumed by DF beginning at IB. OuBA performs
    no semantic correction, truth evaluation, routing, or governance decisions, and
    never modifies semantic_core after commit.

invariants:
  - name: stabilized_meaning_required
    description: >
      OuBA must operate only after meaning construction and completion evaluation
      stabilize; in-flight meaning states are inadmissible.
  - name: semantic_core_required
    description: >
      semantic_core must be present and valid; missing or partial semantic_core
      invalidates commit.
  - name: meaning_fields_required
    description: >
      All meaning-bearing fields required by DF must be present and valid.
  - name: deterministic_commit
    description: >
      Given identical stabilized TP inputs, OuBA must produce identical committed
      snapshots under replay.
  - name: no_semantic_correction
    description: >
      OuBA must not perform semantic correction, repair, or normalization.
  - name: no_truth_or_routing
    description: >
      OuBA must not evaluate truth, routing, stance, or governance decisions.
  - name: no_df_invocation
    description: >
      OuBA must not invoke IB, TB, GBIB, or GB; DF ingress occurs only after commit.
  - name: single_commit_per_cycle
    description: >
      OuBA must run exactly once per Path-A cycle and must never re-commit the same
      meaning state.
  - name: path_a_only
    description: >
      OuBA must not be invoked during Path-B realization; Path-B is meaning-read-only.

geometry_signature:
  envelope_type: semantic_commit_envelope
  shape: bounded_polytope
  dimensions:
    - name: semantic_core_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: meaning_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: commit_metadata_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: resolution_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: df_readiness_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    OuBA geometry represents semantic_core magnitude, meaning-bearing field stability,
    commit-time metadata strength, resolution-flag magnitude, and DF-readiness indicators.
    No routing, structural, or truth-evaluation axes appear here.

scalar_fields:
  - name: semantic_core_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude and stability of semantic_core at commit time.
  - name: meaning_stability
    type: float
    bounds: [0.0, 1.0]
    description: >
      Stability of meaning-bearing fields at commit time.
  - name: commit_metadata_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of commit-time metadata written by OuBA.
  - name: resolution_flag_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of resolution flags indicating meaning-layer stabilization.
  - name: df_readiness_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of DF-readiness indicators for IB intake.

vector_fields:
  - name: semantic_core_vector
    type: vector
    length: 3
    description: >
      Coordinates representing the committed semantic_core.
  - name: meaning_vector
    type: vector
    length: 3
    description: >
      Coordinates representing meaning-bearing fields.
  - name: commit_metadata_vector
    type: vector
    length: 3
    description: >
      Coordinates representing commit-time metadata.
  - name: resolution_vector
    type: vector
    length: 3
    description: >
      Coordinates representing resolution flags.
  - name: df_readiness_vector
    type: vector
    length: 3
    description: >
      Coordinates representing DF-readiness indicators.

tp_update_fields:
  - name: semantic_commit_snapshot
    type: struct
    description: >
      Immutable semantic snapshot containing semantic_core, meaning-bearing fields,
      commit-time metadata, resolution flags, and DF-readiness indicators. This is
      the sole output of OuBA and is consumed by DF beginning at IB.

envelope_status:
  admissible_status:
    - commit_ready
    - stabilized
  terminal_status:
    - invalid_geometry
    - missing_semantic_core
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy OuBA invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_semantic_core
    description: semantic_core was absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical commit geometry.

routing:
  admissible_inputs:
    - IdOB
    - TPU
  admissible_outputs:
    - DF
  description: >
    OuBA consumes stabilized TP snapshots and emits the immutable semantic commit
    snapshot. DF ingress begins at IB; OuBA performs no routing.

dependencies:
  dictionaries:
    - semantic_dictionary
    - runtime_dictionary
  reference_objects:
    - idob_reference
    - tpu_reference
    - boundary_reference
    - semantic_reference
  flow_contracts:
    - path_a_commit_flow
    - df_ingress_flow

psc_alignment:
  - OuBA must satisfy PSC commit-object requirements.
  - OuBA must expose deterministic commit geometry for replay validation.
  - OuBA must align with DF ingress (IB → TB → GBIB → GB).
  - OuBA must enforce admissible semantic-commit envelope constraints.
