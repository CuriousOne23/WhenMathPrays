reference_object_name: SSG
reference_object_class: structure
semantic_class: structural_signature_generator
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and routing constraints
    for the Structural Signature Generator (SSG) in Path A.
  long: >
    SSG converts SmOB structural output into a deterministic, fixed-length structural
    signature vector for routing and similarity operations. SSG extracts and normalizes
    structural invariants (arc patterns, residue entropy, curvature, binding depth,
    motif frequencies) into a coordinate-stable vector representation. SSG performs
    no semantic interpretation, tokenization, or meaning construction.

invariants:
  - name: envelope_must_be_closed
    description: >
      SSG must operate only on closed envelopes produced by SmOB.
  - name: structural_invariants_required
    description: >
      SmOB structural invariants (arc patterns, residue entropy, curvature, binding depth,
      motif frequencies) must be present and valid.
  - name: deterministic_signature_required
    description: >
      The structural signature vector must be deterministically derived from SmOB residue.
  - name: replay_stability_required
    description: >
      SSG must produce identical signature vectors under replay for identical inputs.
  - name: no_semantic_interpretation
    description: >
      SSG must not perform semantic interpretation, semantic embedding, or tokenization.

geometry_signature:
  envelope_type: structural_signature_envelope
  shape: bounded_polytope
  dimensions:
    - name: arc_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: entropy_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: curvature_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: binding_depth_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: motif_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    SSG geometry represents normalized structural invariants extracted from SmOB residue.
    No semantic manifold axes appear here.

scalar_fields:
  - name: arc_pattern_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of arc-pattern structural invariants.
  - name: residue_entropy
    type: float
    bounds: [0.0, 1.0]
    description: >
      Entropy of structural residue.
  - name: curvature_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Curvature magnitude of structural geometry.
  - name: binding_depth
    type: float
    bounds: [0.0, 1.0]
    description: >
      Depth of structural binding.
  - name: motif_frequency
    type: float
    bounds: [0.0, 1.0]
    description: >
      Frequency of structural motifs.

vector_fields:
  - name: structural_signature_vector
    type: vector
    length: 32
    description: >
      Fixed-length structural signature vector used for routing and similarity operations.

envelope_status:
  admissible_status:
    - signature_ready
    - degraded_structure
  terminal_status:
    - invalid_geometry
    - missing_invariants
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SSG invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_invariants
    description: Required structural invariants are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical structural signature vectors.

routing:
  admissible_inputs:
    - SmOB
  admissible_outputs:
    - RB
  description: >
    SSG emits structural signature vectors consumed by RB for routing and similarity
    operations. SSG does not route into semantic or correction primitives.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - smob_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SSG must satisfy PSC structure object requirements.
  - SSG must expose deterministic structural signature geometry for replay validation.
  - SSG must align with SmOB and RB.
  - SSG must enforce admissible structural signature envelope constraints.
