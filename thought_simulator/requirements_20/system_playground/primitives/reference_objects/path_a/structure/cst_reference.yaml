reference_object_name: CST
reference_object_class: structure
semantic_class: stability_tracker
version: 1.0.0

purpose:
  short: >
    Defines the deterministic stability‑tracking geometry and invariants for the
    Conversation Stability Tracker (CST), which monitors COB identity‑layer structure
    for drift, oscillation, collapse, and instability.
  long: >
    CST observes the 20 identity‑layers maintained by COB and computes stability
    signatures, drift vectors, oscillation patterns, collapse indicators, and
    long‑horizon noise accumulation. CST does not modify structure directly; it emits
    bounded stabilization signals that COB may apply. CST is non‑semantic, non‑routing,
    and non‑boundary; it operates strictly within structural geometry.

invariants:
  - name: no_meaning_construction
    description: >
      CST must not construct meaning or interpret semantics.
  - name: no_boundary_access
    description: >
      CST must not read intake envelopes or boundary‑class objects.
  - name: no_routing_authority
    description: >
      CST may not perform routing decisions or modify routing metadata.
  - name: bounded_stability_geometry
    description: >
      CST must operate on bounded structural geometry derived from COB.
  - name: replay_stability_required
    description: >
      CST must produce identical stability signatures under replay for identical inputs.
  - name: admissible_source_only
    description: >
      CST may only accept structural envelopes produced by COB.

geometry_signature:
  envelope_type: stability_envelope
  shape: bounded_polytope
  dimensions:
    - name: drift_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: oscillation_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: collapse_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    CST geometry represents drift magnitude, oscillation magnitude, and collapse
    magnitude across COB’s identity‑layer structure. These axes determine stability
    classification and stabilization signal emission.

scalar_fields:
  - name: drift_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of long‑horizon drift detected in identity‑layer structure.
  - name: oscillation_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Magnitude of oscillatory instability across identity‑layers.
  - name: collapse_magnitude
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of structural collapse or degradation detected.

vector_fields:
  - name: stability_vector
    type: vector
    length: 3
    description: >
      Manifold coordinates representing drift, oscillation, and collapse signatures.

envelope_status:
  admissible_status:
    - stable
    - drift_detected
    - oscillation_detected
    - collapse_detected
  terminal_status:
    - invalid_geometry
    - inadmissible_source
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy CST invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: inadmissible_source
    description: Envelope did not originate from COB.
  - name: replay_inconsistency
    description: Replay produced non-identical stability geometry.

routing:
  admissible_inputs:
    - COB
  admissible_outputs:
    - stabilization_signal
  description: >
    CST emits bounded stabilization signals (e.g., weaken, strengthen, stabilize,
    merge‑candidate, split‑candidate). CST does not apply structural changes; COB
    performs all modifications.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - cob_reference
    - structure_reference
  flow_contracts:
    - path_a_structure_flow

psc_alignment:
  - CST must satisfy PSC structural object requirements.
  - CST must expose deterministic stability geometry for replay validation.
  - CST must align with COB and structural primitives.
  - CST must enforce admissible stability‑tracking constraints.
