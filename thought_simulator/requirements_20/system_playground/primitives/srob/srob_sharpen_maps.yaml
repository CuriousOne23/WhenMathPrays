      - id: formatting.code_block_preferred

# ---------------------------------------------------------------------------
# Notes for implementers
# - Match parent keys to strings SOB writes on the TP (lemma/coarse id).
# - If SOB emits a coarse id not listed here: pass-through + optional
#   unmapped_coarse diagnostic; then add parent key in a controlled expansion.
# - Prefer few testable children over deep trees.
# - when: conditions may be added later; v1 may choose first refinement or
#   pass-through policy explicitly in srob.py (document choice in code).
# ---------------------------------------------------------------------------
