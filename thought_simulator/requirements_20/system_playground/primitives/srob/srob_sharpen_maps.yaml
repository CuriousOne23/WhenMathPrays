# ---------------------------------------------------------------------------
# Constraints — parents from sob_constraints.yaml
# Hints only; SROB never enforces constraints.
# ---------------------------------------------------------------------------
constraints:
  precision:
    refinements:
      - id: precision.parameter_level
      - id: precision.numeric
      - id: precision.definitional
  conciseness:
    refinements:
