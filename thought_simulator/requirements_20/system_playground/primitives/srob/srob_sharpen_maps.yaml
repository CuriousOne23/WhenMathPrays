# srob_sharpen_maps.yaml
# SROB-owned tag refinement policy (Stream B)
# Purpose: Higher-resolution labels WITHIN SOB coarse families only.
# Parent keys MUST match SOB category ids exactly (vocab coupling).
# Fine ids MUST be hierarchical: parent.child
# Empty refinements => pass-through of coarse tag.
# Version: 1.0
# Aligned with: 20.40.020 v2.0, sob_operators/domains/tones/constraints.yaml,
#   srob_software_architecture.md, srob_sob_comm_architect.md

version: "1.0"
description: >
  Sharpen maps keyed by SOB coarse category strings. SROB does not invent
  new top-level types. Illegal parent keys are a load/test desync fault.
  No sharpen without a matching SOB coarse tag on the TP.

vocab_coupling:
  parent_source: SOB coarse category ids
  fine_id_form: "parent.child"
  missing_parent_in_map: pass_through_coarse
  illegal_parent_in_map: SROB_MAP_DESYNC
  no_sharpen_without_sob_tag: true

# ---------------------------------------------------------------------------
# Operators — parents from sob_operators.yaml (core + normalized additional)
# ---------------------------------------------------------------------------
operators:
  summarize:
    refinements:
      - id: summarize.abstract
      - id: summarize.bullets
      - id: summarize.tldr
  compare:
    refinements:
      - id: compare.contrast
      - id: compare.rank
  classify:
    refinements:
      - id: classify.categorize
      - id: classify.group
  derive:
    refinements:
      - id: derive.compute
      - id: derive.deduce
  plan:
    refinements:
      - id: plan.steps
      - id: plan.roadmap
  explain:
    refinements:
      - id: explain.clarify
      - id: explain.detail
      - id: explain.justify
  rewrite:
    refinements:
      - id: rewrite.paraphrase
      - id: rewrite.revise
  transform:
    refinements:
      - id: transform.convert
      - id: transform.map
  # Additional operator forms SOB may emit (from sob_operators additional list,
  # normalized to lemma-like coarse ids as SOB writes them on TP).
  # Thin: pass-through until downstream needs depth.
  analyze:
    refinements: []
  evaluate:
    refinements: []
  assess:
    refinements: []
  identify:
    refinements: []
  list:
    refinements: []
  extract:
    refinements: []
  generate:
    refinements: []
  create:
    refinements: []
  produce:
    refinements: []
  define:
    refinements: []
  formalize:
    refinements: []
  prove:
    refinements: []
  show:
    refinements: []
  demonstrate:
    refinements: []
  illustrate:
    refinements: []
  implement:
    refinements:
      - id: implement.code_action
      - id: implement.procedure
  design:
    refinements: []
  model:
    refinements: []
  simulate:
    refinements: []
  optimize:
    refinements: []
  debug:
    refinements: []
  test:
    refinements: []
  validate:
    refinements: []
  verify:
    refinements: []
  review:
    refinements: []
  critique:
    refinements: []
  improve:
    refinements: []
  refine:
    refinements: []
  expand:
    refinements: []
  compress:
    refinements: []
  simplify:
    refinements: []
  elaborate:
    refinements: []

