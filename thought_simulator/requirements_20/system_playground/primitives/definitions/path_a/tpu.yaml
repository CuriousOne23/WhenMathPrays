primitive_name: TPU
primitive_family: path_a
reference_type: tpu_reference
version: 1.0.0

description: >
  TPU (Thought Packet Updater) is the Path-A primitive responsible for committing
  deterministic updates to the TP. TPU performs no routing computation, no semantic
  interpretation, no correction, and no truth evaluation. Its sole job is to validate
  update envelopes from upstream primitives and apply TP-safe writes. TPU is the
  sole writer to TP and is strictly replay-stable.

runtime_behavior:
  mode: tp_commit_engine
  semantic_interpretation: none
  routing_computation: none
  correction_application: none
  truth_evaluation: none
  tp_write: commit_only
  replay_behavior: deterministic

inputs:
  required:
    - update_envelope
  optional:
    - idob_update
    - rbu_update
    - rtu_update
    - isc_update
    - ce_update
    - cex_update
    - ie_update

outputs:
  envelope_type: tp_commit_envelope
  fields:
    scalar_fields:
      - commit_integrity
      - commit_magnitude
      - update_conflict
      - update_reason_code
      - degradation_level
    vector_fields:
      - commit_vector
      - update_vector
      - lineage_vector
  status_flags:
    - commit_ready
    - commit_applied
    - degraded

invariants:
  update_envelope_required: true
  deterministic_commit_required: true
  no_semantic_or_truth: true
  no_routing_computation: true
  no_correction: true
  no_global_state_access: true
  replay_stability_required: true
  path_a_only: true

constraint_families:
  C1_slot_presence:
    description: >
      All required update fields must be present; TPU may not infer or repair.
    enforced: true

  C2_slot_shape:
    description: >
      All update vectors must match expected structural shapes.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_commit_integrity:
    description: >
      commit_integrity must reflect deterministic validation rules and may not
      decrease when upstream update consistency increases.
    enforced: true

  C5_no_semantic_or_routing:
    description: >
      TPU must not modify semantic meaning, routing metadata, identity fields,
      or cue semantics.
    enforced: true

  C6_tp_write_safety:
    description: >
      TPU must ensure TP writes are atomic, deterministic, and replay-stable.
    enforced: true

  C7_replay_determinism:
    description: >
      TPU must produce identical TP commits under replay for identical inputs.
    enforced: true

evaluation_logic:
  steps:
    - validate_update_envelope
    - validate_update_vectors
    - compute_commit_vector
    - compute_update_vector
    - compute_scalar_fields
    - apply_constraint_families
    - apply_tp_commit
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  commit_ready:
    conditions:
      - commit_integrity >= 0.0
  commit_applied:
    conditions:
      - update_conflict == 0.0

anomaly_flags:
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  missing_update_envelope:
    triggers:
      - update envelope absent or invalid
  replay_inconsistency:
    triggers:
      - replay produces non-identical commit geometry
  inadmissible_source:
    triggers:
      - envelope not from IdOB/RBU/RTU/ISc/CE/CEx/IE

routing:
  admissible_inputs:
    - IdOB
    - RBU
    - RTU
    - ISc
    - CE
    - CEx
    - IE
  admissible_outputs:
    - TS
  description: >
    TPU commits updates into TP and hands control to TS. TPU performs no routing
    transitions.

dependencies:
  dictionaries:
    - runtime_dictionary
  reference_objects:
    - idob_reference
    - rbu_reference
    - rtu_reference
    - isc_reference
    - ce_reference
    - cex_reference
    - ie_reference
    - boundary_reference
  flow_contracts:
    - path_a_commit_flow

psc_alignment:
  - TPU satisfies PSC commit-engine object requirements.
  - TPU exposes deterministic commit geometry for replay validation.
  - TPU aligns with IdOB, RBU, RTU, ISc, CE, CEx, and IE.
  - TPU enforces admissible TP-commit envelope constraints.
