# semantic_roles_dictionary.yaml
# Version: 1.0 (IdOB-prm v3.0 aligned)
# Purpose:
#   Provide the minimal semantic-role layer (lexical → role) required by IdOB-prm,
#   Path-A primitives, and the progressive lineup testbench.
#
# Location note (2026-08-19):
#   Placed under primitives/idob/ as a local exclusive table.
#   Loaders look here first. The copy under papers/ is historical.

identity_roles:
  identity_formation:
    role: identity_formation
    description: Initial formation of a coherent identity envelope for a topic cluster.
  identity_refinement:
    role: identity_refinement
    description: Incremental sharpening or clarification of an existing identity envelope.
  identity_correction:
    role: identity_correction
    description: Correction of previously mis-specified or misaligned identity content.
  identity_drift:
    role: identity_drift
    description: Slow, unintentional movement of identity away from prior envelope.
  identity_conflict:
    role: identity_conflict
    description: Internal or external conflict between identity commitments.
  identity_bifurcation:
    role: identity_bifurcation
    description: Splitting of identity into two or more competing envelopes.
  identity_stabilization:
    role: identity_stabilization
    description: Reduction of volatility; identity becomes more stable and predictable.
  identity_convergence:
    role: identity_convergence
    description: Movement of multiple identity strands toward a shared envelope.
  identity_alignment:
    role: identity_alignment
    description: Alignment of identity with external constraints, norms, or commitments.
  identity_closure:
    role: identity_closure
    description: Completion or closure of identity work for a topic cluster.

stance_roles:
  stance_supportive:
    role: stance_supportive
    description: Supportive, affirming stance toward the identity or topic.
  stance_skeptical:
    role: stance_skeptical
    description: Skeptical stance that questions or probes the identity.
  stance_neutral:
    role: stance_neutral
    description: Neutral stance without strong positive or negative commitment.
  stance_conflicted:
    role: stance_conflicted
    description: Mixed or conflicted stance with competing pulls.
  stance_corrective:
    role: stance_corrective
    description: Stance oriented toward correcting or improving identity content.

pressure_roles:
  pressure_low:
    role: pressure_low
    description: Low meaning-pressure; identity can change without strong resistance.
  pressure_moderate:
    role: pressure_moderate
    description: Moderate meaning-pressure; changes are possible but constrained.
  pressure_high:
    role: pressure_high
    description: High meaning-pressure; identity is under strong constraint or stress.
  pressure_spike:
    role: pressure_spike
    description: Sudden spike in pressure due to events or conflicts.
  pressure_release:
    role: pressure_release
    description: Release or reduction of pressure after resolution or closure.

continuity_roles:
  continuity_stable:
    role: continuity_stable
    description: Identity continuity is stable across TP segments.
  continuity_incremental:
    role: continuity_incremental
    description: Identity changes are incremental and traceable.
  continuity_disruptive:
    role: continuity_disruptive
    description: Identity continuity is disrupted by strong events or corrections.
  continuity_reset:
    role: continuity_reset
    description: Identity continuity is reset; prior envelope is largely discarded.
  continuity_bridge:
    role: continuity_bridge
    description: Identity continuity bridges between two regimes or envelopes.

geometry_roles:
  geometry_expand:
    role: geometry_expand
    description: Identity envelope expands to cover more topics or nuances.
  geometry_contract:
    role: geometry_contract
    description: Identity envelope contracts to focus on fewer topics or nuances.
  geometry_shift:
    role: geometry_shift
    description: Identity envelope shifts position (e.g., stance or emphasis).
  geometry_rotate:
    role: geometry_rotate
    description: Identity orientation rotates (e.g., from self-focus to other-focus).
  geometry_recenter:
    role: geometry_recenter
    description: Identity envelope recenters around a new core concept.

residual_roles:
  residual_accumulate:
    role: residual_accumulate
    description: Residual meaning or tension accumulates across TP segments.
  residual_dissipate:
    role: residual_dissipate
    description: Residual meaning or tension dissipates over time.
  residual_persist:
    role: residual_persist
    description: Residual meaning or tension persists despite updates.
  residual_resurface:
    role: residual_resurface
    description: Old residuals resurface in new identity work.
  residual_resolved:
    role: residual_resolved
    description: Residual meaning or tension is resolved and cleared.

freeze_roles:
  freeze_none:
    role: freeze_none
    description: Identity is not frozen; updates are allowed.
  freeze_partial:
    role: freeze_partial
    description: Some aspects of identity are frozen; others can update.
  freeze_full:
    role: freeze_full
    description: Identity envelope is fully frozen; updates are blocked.
  freeze_release:
    role: freeze_release
    description: Previously frozen identity is released for update.
  freeze_guarded:
    role: freeze_guarded
    description: Identity is guarded; updates require strong justification.

basin_surface_roles:
  basin_stable:
    role: basin_stable
    description: Identity resides in a stable basin of attraction.
  basin_shallow:
    role: basin_shallow
    description: Identity basin is shallow; small perturbations can move it.
  basin_deep:
    role: basin_deep
    description: Identity basin is deep; strong perturbations are needed to move it.
  surface_exposed:
    role: surface_exposed
    description: Identity is exposed at the surface; easily perturbed by events.
  surface_shielded:
    role: surface_shielded
    description: Identity is shielded from surface-level perturbations.

routing_roles:
  routing_path_a_only:
    role: routing_path_a_only
    description: Identity work is confined to Path-A primitives.
  routing_path_b_eligible:
    role: routing_path_b_eligible
    description: Identity envelope is eligible for Path-B processing.
  routing_idob_complete:
    role: routing_idob_complete
    description: IdOB has completed its required identity-conditioned meaning refinement.
  routing_needs_review:
    role: routing_needs_review
    description: Identity envelope requires review before further routing.
  routing_hold:
    role: routing_hold
    description: Routing is temporarily held pending additional information.

domain_roles:
  domain_workplace_communication:
    role: domain_workplace_communication
    description: Topic cluster relates to workplace communication and team interactions.
  domain_team_dynamics:
    role: domain_team_dynamics
    description: Topic cluster relates to team dynamics and collaboration.
  domain_personal_growth:
    role: domain_personal_growth
    description: Topic cluster relates to personal development and self-understanding.
  domain_conflict_resolution:
    role: domain_conflict_resolution
    description: Topic cluster relates to resolving conflicts and tensions.
  domain_decision_making:
    role: domain_decision_making
    description: Topic cluster relates to decisions, tradeoffs, and commitments.
