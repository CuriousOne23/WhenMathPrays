# Relocated 2026-08-19 from papers/

semantic_field_definitions:

  identity:
    description: >
      The core meaning dimension describing what the user is talking
      about and how that meaning evolves. Identity fields capture
      formation, refinement, correction, drift, conflict, bifurcation,
      convergence, alignment, and closure.
    required: true

  stance:
    description: >
      Describes the user's attitude or position toward the identity:
      agreement, disagreement, clarification, rejection, uncertainty,
      emphasis, or de-emphasis.
    required: true

  direction:
    description: >
      Describes the directional flow of meaning: next, previous,
      stable, or unknown. Used by Path A routing and continuity logic.
    required: true

  pressure:
    description: >
      Describes the intensity of meaning change: low, medium, high,
      escalation, de-escalation, insistence, withdrawal.
    required: true

  continuity:
    description: >
      Describes how meaning persists or changes across turns:
      continuation, correction, oscillation, drift, bifurcation,
      stabilization.
    required: true

  geometry:
    description: >
      Describes the structural behavior of identity meaning:
      formation, refinement, correction, drift, conflict, bifurcation,
      stabilization, convergence, alignment, closure.
    required: true

  residuals:
    description: >
      Describes leftover meaning differences between the current
      identity and previous identities: small, medium, large,
      explosion, two_clusters, collapsed.
    required: true

  freeze:
    description: >
      Describes whether identity meaning is frozen or propagating:
      none, identity_freeze, propagation_active.
    required: true

  basin_surface:
    description: >
      Describes the stability region of identity meaning: basin,
      split, unstable, transition_surface, none.
    required: true

  routing:
    description: >
      Describes how meaning should move through Path A: forward,
      backward, branch, merge, hold.
    required: true

  importance:
    description: >
      Describes the significance of the identity: low, medium, high,
      critical. Used by TS prioritization logic.
    required: false

  domain:
    description: >
      Domain-neutral placeholders for world concepts (object, event,
      process, system, structure, behavior, state, transition).
    required: false
