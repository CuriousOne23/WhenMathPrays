# semantic_field_id inventory for 09 / structure cards.
# No meaning floats. New id = unused int + gloss + examples.
# Lifecycle envelope names are NOT field ids (see idob_schema.yaml).

semantic_field_definitions:
  entries:
    - id: 0
      gloss: unspecified field
      examples: []
    - id: 12
      gloss: physical-event basin (toy rock / burst)
      examples: ["The rock burst open."]
    - id: 101
      gloss: scheduling / deadline basin
      examples: ["The project deadline is Friday."]
    - id: 401
      gloss: biological-condition basin
      examples: ["I am sleepy."]
    - id: 999
      gloss: unmapped / no group candidates (coverage hole)
      examples: ["zzzz unmapped geometry"]
