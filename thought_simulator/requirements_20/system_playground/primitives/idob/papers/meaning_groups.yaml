# =====================================================================
# meaning_groups.yaml
# ---------------------------------------------------------------------
# Purpose:
#   Defines the meaning groups used by IdOB. Meaning groups are the
#   intermediate layer between lexical meaning units and IdOB's
#   meaning_semantics[] vector. They cluster meaning units that share:
#
#     - primitive
#     - invariant tags
#     - cue envelopes
#     - meaning dimensions
#     - identity anchors
#     - routing signatures
#
#   IdOB selects meaning groups based on structural_hash and identity
#   envelope, then refines meaning within the group using meaning_delta_h.
#
# Relationship to Other Files:
#   - idob_meaning_dictionary.yaml: defines meaning units and dimensions
#   - struct_to_meaning_map.yaml: maps structural_hash → meaning_group_id
#   - idob_struc_to_meaning.md: architecture paper defining how groups
#     are used in structure→meaning mapping
#
# Notes:
#   - This file does NOT contain lexical entries.
#   - It contains IdOB-specific meaning groups derived from lexical units.
#   - Meaning groups are stable across TS runs and replay-safe.
# =====================================================================

meaning_groups:

  # -------------------------------------------------------------------
  # Example Meaning Group (template)
  # -------------------------------------------------------------------
  # This is a template for how each meaning group should be structured.
  # Replace <...> with actual values when populating the dictionary.
  # -------------------------------------------------------------------
  - group_id: <int>                # Unique ID for the meaning group
    group_name: <string>           # Human-readable name (e.g., "ACTION.physical.motion")
    primitive: <ENTITY|ACTION|EVENT|STATE|QUALITY|PROCESS|RELATION|TEMPORAL|SPATIAL>

    # Meaning units belonging to this group
    members:
      - <unit_id_1>
      - <unit_id_2>
      - <unit_id_3>

    # Shared invariants across all members
    group_invariants:
      tags: [<string>, ...]        # e.g., ["dynamic", "physical"]
      core_features: [<string>, ...]  # e.g., ["walk", "move", "step"]

    # Meaning dimensions (normalized floats 0.0–1.0)
    group_dimensions:
      physicality: <float>
      sociality: <float>
      temporality: <float>
      intentionality: <float>
      materiality: <float>
      spatiality: <float>

    # Identity anchor for the group (derived from member anchors)
    group_identity_anchor:
      anchor_vector: [<int>, ...]
      checksum: <int>

    # Routing signature for the group (derived from member signatures)
    group_routing_signature:
      primitive_code: <int>
      feature_codes: [<int>, ...]
      tag_codes: [<int>, ...]

