# =====================================================================
# semantic_gradients.yaml
# ---------------------------------------------------------------------
# Purpose:
#   Defines the gradient scales used across the Semantic Universe.
#   Gradients quantify the intensity, magnitude, or rate of change
#   for meaning signals such as pressure, drift, residuals, stability,
#   and continuity. These gradients are essential for IdOB evaluation,
#   TP metadata normalization, and Path A meaning extraction.
#
# Relationship to Other Files:
#   - Supports: idob_realization_input_output_examples.md
#   - Supports: idob_yaml_files_support_10_examples.md
#   - Consumed by: semantic_objects.yaml
#   - Consumed by: semantic_universe_to_tp_mapping.md
#   - Required by: idob_schema.yaml
#   - Required by: idob_preconditions_contract.md
#
# Notes:
#   - Gradients are domain-agnostic and describe meaning intensity,
#     not world categories (e.g., not baseball, politics, economics).
#   - As Path A gains capability, this file will expand with additional
#     gradient scales or refinements.
# =====================================================================

semantic_gradients:

  # --------------------------------------------------------------
  # Generic magnitude gradients
  # --------------------------------------------------------------
  magnitude:
    - none
    - low
    - medium
    - high

  # --------------------------------------------------------------
  # Pressure gradients
  # --------------------------------------------------------------
  pressure:
    level:
      - low
      - medium
      - high

    change:
      - escalate
      - de-escalate

  # --------------------------------------------------------------
  # Drift gradients
  # --------------------------------------------------------------
  drift:
    intensity:
      - small
      - medium
      - large

    behavior:
      - slow
      - moderate
      - rapid

  # --------------------------------------------------------------
  # Residual gradients
  # --------------------------------------------------------------
  residuals:
    magnitude:
      - small
      - medium
      - large

    pattern:
      - explosion
      - two_clusters
      - collapsed

  # --------------------------------------------------------------
  # Stability gradients
  # --------------------------------------------------------------
  stability:
    region:
      - basin
      - split
      - unstable
      - transition_surface
      - none

    confidence:
      - low
      - medium
      - high

  # --------------------------------------------------------------
  # Continuity gradients
  # --------------------------------------------------------------
  continuity:
    persistence:
      - weak
      - moderate
      - strong

    change_rate:
      - slow
      - medium
      - fast

  # --------------------------------------------------------------
  # Freeze gradients
  # --------------------------------------------------------------
  freeze:
    state:
      - none
      - identity_freeze
      - propagation_active

  # --------------------------------------------------------------
  # Routing gradients
  # --------------------------------------------------------------
  routing:
    strength:
      - weak
      - moderate
      - strong

    mode:
      - forward
      - backward
      - branch
      - merge
      - hold

  # --------------------------------------------------------------
  # Importance gradients
  # --------------------------------------------------------------
  importance:
    level:
      - low
      - medium
      - high
      - critical
