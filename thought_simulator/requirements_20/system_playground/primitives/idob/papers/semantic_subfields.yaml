# =====================================================================
# semantic_subfields.yaml
# ---------------------------------------------------------------------
# Purpose:
#   Defines the fine-grained subfields for each meaning dimension
#   ("field") in the Semantic Universe. These subfields provide the
#   structural detail required for IdOB interpretation, TP metadata
#   mapping, and Path A meaning extraction.
#
# Relationship to Other Files:
#   - Supports: idob_realization_input_output_examples.md
#   - Supports: idob_yaml_files_support_10_examples.md
#   - Consumed by: semantic_objects.yaml
#   - Consumed by: semantic_universe_to_tp_mapping.md
#   - Required by: idob_schema.yaml
#   - Required by: idob_preconditions_contract.md
#
# Notes:
#   - Subfields refine the meaning dimensions defined in
#     semantic_field_definitions.yaml.
#   - These subfields are domain-agnostic and describe meaning behavior,
#     not world categories (e.g., not baseball, politics, economics).
#   - As Path A gains capability, this file will expand with additional
#     subfields or refinements.
# =====================================================================

semantic_subfields:

  identity:
    geometry:
      - formation
      - refinement
      - correction
      - drift
      - conflict
      - bifurcation
      - stabilization
      - convergence
      - alignment
      - closure

    continuity:
      - continuation
      - correction
      - oscillation
      - drift
      - bifurcation
      - stabilization

    pressure:
      - low
      - medium
      - high
      - escalate
      - de-escalate
      - insist
      - withdraw

    residuals:
      - small
      - medium
      - large
      - explosion
      - two_clusters
      - collapsed

    freeze:
      - none
      - identity_freeze
      - propagation_active

    basin_surface:
      - basin
      - split
      - unstable
      - transition_surface
      - none

  stance:
    category:
      - agree
      - disagree
      - clarify
      - confirm
      - reject
      - redirect
      - uncertain
      - emphasize
      - de-emphasize

  direction:
    flow:
      - next
      - previous
      - stable
      - unknown

  pressure:
    level:
      - low
      - medium
      - high

    gradient:
      - escalate
      - de-escalate

    behavior:
      - insist
      - withdraw

  continuity:
    mode:
      - continuation
      - correction
      - oscillation
      - drift
      - bifurcation
      - stabilization

  geometry:
    behavior:
      - formation
      - refinement
      - correction
      - drift
      - conflict
      - bifurcation
      - stabilization
      - convergence
      - alignment
      - closure

  residuals:
    magnitude:
      - small
      - medium
      - large

    pattern:
      - explosion
      - two_clusters
      - collapsed

  freeze:
    state:
      - none
      - identity_freeze
      - propagation_active

  basin_surface:
    region:
      - basin
      - split
      - unstable
      - transition_surface
      - none

  routing:
    mode:
      - forward
      - backward
      - branch
      - merge
      - hold

  importance:
    level:
      - low
      - medium
      - high
      - critical

  domain:
    category:
      - object
      - event
      - process
      - system
      - structure
      - behavior
      - state
      - transition
