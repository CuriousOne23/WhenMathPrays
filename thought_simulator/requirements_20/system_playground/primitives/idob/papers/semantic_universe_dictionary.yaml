# =====================================================================
# semantic_universe_dictionary.yaml
# ---------------------------------------------------------------------
# Purpose:
#   This file defines the top-level lexical dictionary for the Semantic
#   Universe. All IdOB examples, IdOB schema objects, TP metadata
#   mappings, and Path A meaning extraction depend on this dictionary.
#
# Relationship to Other Files:
#   - Supports: idob_realization_input_output_examples.md
#   - Supports: idob_yaml_files_support_10_examples.md
#   - Consumed by: semantic_universe_fields.md
#   - Consumed by: semantic_subfields.yaml
#   - Consumed by: semantic_objects.yaml
#   - Required by: idob_schema.yaml
#   - Required by: idob_preconditions_contract.md
#
# Notes:
#   - This dictionary is intentionally generic and domain-agnostic.
#   - It defines the lexical universe that IdOB uses to interpret
#     identity behavior, stance, pressure, drift, conflict, bifurcation,
#     merging, closure, and stability.
#   - As Path A gains capability, this file will expand in size.
# =====================================================================

semantic_universe_dictionary:

  identity_terms:
    - identity
    - concept
    - meaning
    - interpretation
    - definition
    - refinement
    - correction
    - drift
    - conflict
    - bifurcation
    - convergence
    - alignment
    - closure

  stance_terms:
    - agree
    - disagree
    - clarify
    - confirm
    - reject
    - redirect
    - uncertain
    - emphasize
    - de-emphasize

  pressure_terms:
    - low
    - medium
    - high
    - escalate
    - de-escalate
    - insist
    - withdraw

  continuity_terms:
    - continuation
    - correction
    - oscillation
    - drift
    - bifurcation
    - stabilization

  geometry_terms:
    - formation
    - refinement
    - correction
    - drift
    - conflict
    - bifurcation
    - stabilization
    - convergence
    - alignment
    - closure

  residual_terms:
    - small
    - medium
    - large
    - explosion
    - two_clusters
    - collapsed

  freeze_terms:
    - none
    - identity_freeze
    - propagation_active

  basin_surface_terms:
    - basin
    - split
    - unstable
    - transition_surface
    - none

  routing_terms:
    - forward
    - backward
    - branch
    - merge
    - hold

  direction_terms:
    - next
    - previous
    - unknown
    - stable

  importance_terms:
    - low
    - medium
    - high
    - critical

  domain_terms:
    # Domain-neutral placeholders; expanded as Path A grows
    - object
    - event
    - process
    - system
    - structure
    - behavior
    - state
    - transition
