# =====================================================================
# struct_to_meaning_map.yaml
# ---------------------------------------------------------------------
# Purpose:
#   Defines the mapping from structural geometry (represented by
#   structural_hash and decomposed structural fields) to IdOB meaning
#   groups. This is the core bridge used by IdOB to convert structure
#   into meaning candidates.
#
# Relationship to Other Files:
#   - Consumed by IdOB during meaning-group selection.
#   - Uses meaning_group_id values defined in meaning_groups.yaml.
#   - Structural hashes originate from SOB/SROB/CnOB/SmOB/SSG/STPX/RB.
#   - Required by idob_struc_to_meaning.md (architecture paper).
#
# Notes:
#   - This file does NOT contain meaning units or lexical entries.
#   - It contains ONLY the mapping from structural_hash → meaning_group_id.
#   - Multiple meaning groups may map to the same structural_hash.
#   - IdOB ranks candidates using identity envelope + cue envelopes.
# =====================================================================

struct_to_meaning_map:

  # -------------------------------------------------------------------
  # Template Entry (copy this structure for real mappings)
  # -------------------------------------------------------------------
  - structural_hash: <hex_or_int>
    semantic_field_id: <int>
    semantic_role_id: <int>
    semantic_object_id: <int>
    gradient_id: <int>
    universe_id: <int>
    subfield_id: <int>

    meaning_group_candidates:
      - <group_id_1>
      - <group_id_2>
      - <group_id_3>

    # Optional ranking hints (IdOB still computes final ranking)
    ranking_hints:
      identity_weight: <float>
      cue_weight: <float>
      invariant_weight: <float>

  # -------------------------------------------------------------------
  # Example Mappings (aligned with meaning_groups.yaml examples)
  # -------------------------------------------------------------------

