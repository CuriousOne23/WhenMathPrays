# =====================================================================
# idob_object.yaml (CvThP‑updated)
# =====================================================================

idob_object:

  # -------------------------------------------------------------------
  # 1. Structural Geometry (from PT1)
  # -------------------------------------------------------------------
  structural:
    structural_hash: <hex_or_int>
    semantic_field_id: <int>
    semantic_role_id: <int>
    semantic_object_id: <int>
    gradient_id: <int>
    universe_id: <int>
    subfield_id: <int>

    residue_hash: <hex_or_int>

    routing_signature:
      struct_hash: <hex_or_int>
      feature_hashes: [<hex_or_int>, ...]

    identity_metadata:
      identity_tags: [<string>, ...]
      identity_vector: [<int>, ...]

  # -------------------------------------------------------------------
  # 2. Meaning Group Selection
  # -------------------------------------------------------------------
  meaning_group:
    selected_group_id: <int>
    candidate_group_ids: [<int>, ...]

    ranking_details:
      identity_score: <float>
      cue_score: <float>
      invariant_score: <float>
      final_rank_order: [<int>, ...]

  # -------------------------------------------------------------------
  # 3. Meaning Semantics (IdOB Output)
  # -------------------------------------------------------------------
  meaning_semantics:
    physicality: <float>
    sociality: <float>
    temporality: <float>
    intentionality: <float>
    materiality: <float>
    spatiality: <float>

  idob_semantics:
    meaning_delta_h: <float>
    meaning_stable: <true|false>        # NEW — required for stabilization rules
    stabilization_state: <stable|unstable|exhausted>
    refinement_cycles: <int>

  # -------------------------------------------------------------------
  # 4. Identity Envelope (IdOB Refinement)
  # -------------------------------------------------------------------
  identity_envelope:
    identity_importance: <float>
    identity_tags: [<string>, ...]
    identity_vector: [<int>, ...]
    identity_delta: <float>

    stabilization:
      identity_stable: <true|false>
      cycles: <int>

  # Optional symmetry block (recommended)
  meaning_stabilization:
    meaning_stable: <true|false>
    cycles: <int>

  # -------------------------------------------------------------------
  # 5. Search Control (Unified Depth/Parallel Budget)
  # -------------------------------------------------------------------
  search_control:
    idob_search_budget_max: <int>
    idob_search_budget_min: <int>
    idob_search_budget_used: <int>

    idob_search_mode: <single|parallel_candidates|parallel_segments>

    search_history:
      - cycle: <int>
        selected_group_id: <int>
        meaning_delta_h: <float>
        identity_delta: <float>
        meaning_stable: <true|false>     # NEW — required
        identity_stable: <true|false>    # NEW — required
        stabilization_state: <string>

  # -------------------------------------------------------------------
  # 6. Finalization (Handoff to OuBA)
  # -------------------------------------------------------------------
  finalization:
    resolution_status: <stable|identity_stable|budget_exhausted|time_exhausted>  # UPDATED
    ready_for_ouba: <true|false>
