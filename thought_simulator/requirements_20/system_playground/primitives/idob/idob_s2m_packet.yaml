# Live IdOB packet (11_idob_core). idob.py writes this under tp.idob.
# Full list: testbenches/idob_structure_to_meaning/11_idob_core/packet.schema.yaml
#
# Field catalog authority (20.116): names/paths/owners in
# requirements_20/20.116_field_catalog.md and 20.116.010 / .020 / .030.
# 20.116 wins names/paths/owners; this packet wins nested S2M fields.
# Root writes: tp.idob, tp.semantic.meaning_delta_h,
# idob_complete / path_b_eligible / ready_for_ouba.

idob_s2m_packet:
  utterance: string_or_null
  card_id: string_or_null
  assignment_status: assigned | miss | null
  structural_key: string_or_null
  semantic_field_id: int
  semantic_role_id: int
  semantic_object_id: int
  gradient_id: int
  universe_id: int
  subfield_id: int
  residue_code: string_or_null
  identity_residual:
    magnitude: none | small | medium | large
    pattern: none | collapsed | leftover | empty_map | unassigned
  candidate_group_ids: list[int]
  final_rank_order: list[int]
  selected_group_id: int_or_null
  cie_id: string_or_null
  meaning_semantics: six_axis_or_null
  meaning_semantics_prime: six_axis_or_null
  meaning_delta_h: float_or_null
  meaning_cie_delta: float_or_null
  first_meaning_cycle: bool
  hold_geometry: string
  resolution_status: string
  ready_for_ouba: bool
  path_b_eligible: bool
  idob_complete: bool
  routing_filter_mutated: bool
  expand_target: string_or_null
