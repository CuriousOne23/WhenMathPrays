# idob_schema.yaml — LIFECYCLE enums (formation…closure)
# Not the S2M packet. Live hop schema:
#   primitives/idob/idob_s2m_packet.yaml
#   testbenches/idob_structure_to_meaning/11_idob_core/packet.schema.yaml
# idob.py (11 wrapper) does not consume these enums as meaning axes.
# Optional packet field hold_geometry may echo a geometry name as a label only.

idob_schema:
  identity:
    geometry:
      type: enum
      allowed_values: [formation, refinement, correction, drift, conflict, bifurcation, stabilization, convergence, alignment, closure]
    continuity:
      type: enum
      allowed_values: [continuation, correction, oscillation, drift, bifurcation, stabilization]
    pressure:
      type: enum
      allowed_values: [low, medium, high, escalate, de-escalate, insist, withdraw]
    residuals:
      type: enum
      allowed_values: [small, medium, large, explosion, two_clusters, collapsed]
    freeze:
      type: enum
      allowed_values: [none, identity_freeze, propagation_active]
    basin_surface:
      type: enum
      allowed_values: [basin, split, unstable, transition_surface, none]
  stance:
    category:
      type: enum
      allowed_values: [agree, disagree, clarify, confirm, reject, redirect, uncertain, emphasize, de-emphasize]
  direction:
    flow:
      type: enum
      allowed_values: [next, previous, stable, unknown]
  routing:
    mode:
      type: enum
      allowed_values: [forward, backward, branch, merge, hold]
  importance:
    level:
      type: enum
      allowed_values: [low, medium, high, critical]
