# gradient_id inventory (static vs dynamic, etc.). Not pressure enums.

semantic_gradients:
  entries:
    - id: 0
      gloss: unspecified gradient
      examples: []
    - id: 1
      gloss: relatively static / condition
      examples: ["I am sleepy."]
    - id: 2
      gloss: dynamic / eventive
      examples: ["The rock burst open.", "The project deadline is Friday."]
