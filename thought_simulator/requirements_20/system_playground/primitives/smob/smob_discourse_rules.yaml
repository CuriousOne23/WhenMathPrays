# ============================================================
#  SmOB Discourse Rules (Version 1.0)
#  Discourse-adjacent cue normalization
#  Aligned with: 20.40.040 HLR-015–018, smob_py_struc_pgm.md §6.1
# ------------------------------------------------------------
#  COUPLING (support-critical):
#  Depends on CnOB TP discourse_constraints and/or SROB discourse_flags
#  — NOT on upstream YAML key trees.
# ============================================================

primitive: SmOB
version: "1.0"

# Canonical name map: variant → canonical cue_id
canonicalize:
  temporal_shift: temporal_shift
  temporal_marker: temporal_shift
  temporal: temporal_shift
  contrastive: contrastive_shift
  contrastive_marker: contrastive_shift
  causal: causal_link
  causal_marker: causal_link
  recent_entity: entity_continuity
  entity_continuity: entity_continuity

rules:

  - id: disc_from_cnob
    family: discourse_adjacent
    description: "Normalize CnOB discourse_constraints flags into discourse_adjacent_cues."
    if:
      cnob_discourse_constraints_non_empty: true
    emit:
      source: cnob
      also_semantic_adjacent: true

  - id: disc_from_srob
    family: discourse_adjacent
    description: "Normalize SROB discourse_flags when CnOB discourse empty or as supplement."
    if:
      srob_discourse_flags_non_empty: true
    emit:
      source: srob
      also_semantic_adjacent: true
