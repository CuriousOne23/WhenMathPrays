# CIL Intake Packet Schema
# System Playground Version
# This file contains no SHALL statements and no HLRs.

cil_intake_packet:
  description: >
    Structured packet produced by CIL and consumed exclusively by CEx.
    Contains stabilized identity-layer context derived from COB and CST.

  version: 1.0

  fields:

    identity_selection_block:
      description: >
        The subset of identity-layer objects selected from COB for this packet.
      type: list
      items:
        type: object
        fields:
          referent_map:
            type: object
            description: >
              Stabilized referent map for the identity-layer object.
          anchors:
            type: list
            description: >
              Anchor set associated with the identity-layer object.
          lineage:
            type: object
            description: >
              Lineage record and lineage stability indicators.
          ambiguity:
            type: object
            description: >
              Ambiguity indicators for referents and anchors.
          stability_metrics:
            type: object
            description: >
              Stability metrics derived from CST signals.
          ordering_metrics:
            type: object
            description: >
              Recency, frequency, and density metrics from COB.

    referent_certainty_block:
      description: >
        Certainty and ambiguity fields aggregated across selected identity objects.
      type: object
      fields:
        certainty_levels:
          type: object
        ambiguity_levels:
          type: object

    stability_block:
      description: >
        Stability summaries derived from CST signals and COB integration.
      type: object
      fields:
        drift:
          type: number
        oscillation:
          type: number
        collapse:
          type: boolean
        merge_split:
          type: object
        freeze_thaw:
          type: object

    lineage_block:
      description: >
        Lineage hints and stability indicators for identity-layer objects.
      type: object
      fields:
        lineage_records:
          type: list
        lineage_stability:
          type: object

    ordering_block:
      description: >
        Ordering metrics used by CIL for identity selection.
      type: object
      fields:
        recency:
          type: number
        frequency:
          type: number
        density:
          type: number

    packet_metadata:
      description: >
        Metadata describing packet creation context.
      type: object
      fields:
        turn_index:
          type: integer
        timestamp:
          type: string
        cob_object_count:
          type: integer
        selected_object_count:
          type: integer

  notes:
    - "This schema defines the system_playground version of the CIL Intake Packet."
    - "It mirrors global CIL architecture while remaining scoped for simulation and testing."
    - "No SHALL statements appear in this file."
