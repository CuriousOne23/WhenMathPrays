primitive_name: CTP
primitive_family: path_a
reference_type: ctp_reference
version: 1.0.0

description: >
  CTP (Collect Thought Point) is a deterministic Path-A orchestration primitive
  responsible for collecting all OB outputs from an IdOB-set, freezing them into
  a stable TP packet, and preparing the TP for RB evaluation. CTP performs no
  semantic merging, no conflict resolution, no correction, and no routing. It is
  a pure bookkeeping primitive that ensures deterministic, order-independent,
  replay-stable TP consolidation.

runtime_behavior:
  mode: collect_and_freeze_tp
  semantic_interpretation: none
  correction_application: none
  routing_computation: none
  truth_evaluation: none
  replay_behavior: deterministic

inputs:
  required:
    - idob_output_set
  optional:
    - ob_residue_vector
    - semantic_vector
    - routing_vector
    - cue_vector

outputs:
  envelope_type: collected_tp_envelope
  fields:
    scalar_fields:
      - tp_collect_count
      - tp_freeze_flag
      - tp_integrity_score
    vector_fields:
      - collected_semantic_vector
      - collected_routing_vector
      - collected_cue_vector
      - collected_residue_vector
  status_flags:
    - tp_ready
    - tp_frozen

invariants:
  idob_set_required: true
  no_semantic_merge: true
  no_conflict_resolution: true
  no_correction_allowed: true
  no_routing_allowed: true
  freeze_required: true
  replay_stability_required: true
  order_independence_required: true

constraint_families:
  C1_slot_presence:
    description: >
      All required OB outputs must be present; CTP may not infer or repair missing slots.
    enforced: true

  C2_slot_shape:
    description: >
      All OB outputs must match expected structural shapes; no plausibility or semantic checks.
    enforced: true

  C3_slot_bounds:
    description: >
      All scalar and vector fields must remain within declared bounds.
    enforced: true

  C4_freeze_integrity:
    description: >
      TP freeze must be complete, stable, and immutable once produced.
    enforced: true

  C5_no_merge_or_resolution:
    description: >
      CTP must not merge semantic content or resolve conflicts; Path-B handles merging.
    enforced: true

  C6_order_independence:
    description: >
      Collection must be invariant to OB-output ordering.
    enforced: true

  C7_replay_determinism:
    description: >
      CTP must produce identical TP packets under replay for identical OB sets.
    enforced: true

evaluation_logic:
  steps:
    - validate_idob_set
    - validate_slot_presence
    - check_slot_shapes
    - aggregate_ob_outputs_order_independent
    - compute_scalar_fields
    - compute_vector_fields
    - freeze_tp_packet
    - apply_constraint_families
    - determine_envelope_status
    - produce_output_envelope

status_determination:
  tp_ready:
    conditions:
      - tp_collect_count > 0
      - tp_freeze_flag == false
  tp_frozen:
    conditions:
      - tp_freeze_flag == true

anomaly_flags:
  missing_idob_set:
    triggers:
      - idob_output_set is absent or empty
  geometry_violation:
    triggers:
      - envelope geometry violates invariants
  field_out_of_bounds:
    triggers:
      - scalar or vector fields exceed bounds
  replay_inconsistency:
    triggers:
      - replay produces non-identical TP packets
  inadmissible_source:
    triggers:
      - envelope not from OB/IdOB outputs

routing:
  admissible_inputs:
    - IdOB
    - OB
  admissible_outputs:
    - RB
  description: >
    CTP collects OB outputs and produces a frozen TP packet for RB evaluation.
    CTP performs no routing transitions; RB is the first routing primitive.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - idob_reference
    - ob_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_routing_flow

psc_alignment:
  - CTP satisfies PSC orchestration-object requirements.
  - CTP exposes deterministic, order-independent TP collection geometry.
  - CTP aligns with OB, IdOB, and RB.
  - CTP enforces admissible TP-collection envelope constraints.
