reference_object_name: SROB
reference_object_class: structure
semantic_class: structural_refinement_object_boundary
version: 1.0.0

purpose:
  short: >
    Defines the geometry, invariants, admissible envelopes, and routing constraints
    for the Structural Refinement OB (SROB) in Path A.
  long: >
    SROB refines and canonicalizes SOB structural residue into normalized forms suitable
    for constraint extraction and downstream OB layers. SROB performs structural
    normalization, anchor refinement, canonical ordering, residue smoothing, and
    refinement-level metadata generation. SROB performs no semantic interpretation.

invariants:
  - name: envelope_must_be_closed
    description: >
      SROB must operate only on closed structural envelopes produced by SOB.
  - name: structural_vector_required
    description: >
      structural_vector must be present and valid; missing vectors invalidate the envelope.
  - name: punctuation_mask_required
    description: >
      punctuation_mask_vector must be present and valid; missing vectors invalidate the envelope.
  - name: no_semantic_interpretation
    description: >
      SROB must not introduce or modify semantic fields; it operates purely on structure.
  - name: deterministic_replay_required
    description: >
      SROB must produce identical refinement geometry under replay for identical inputs.

geometry_signature:
  envelope_type: structural_refinement_envelope
  shape: bounded_polytope
  dimensions:
    - name: refinement_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: structural_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: stability_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    SROB geometry represents refinement magnitude, structural normalization stability,
    and canonical ordering consistency. No semantic or routing manifold axes appear here.

scalar_fields:
  - name: refinement_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Degree of structural refinement applied to SOB residue.
  - name: normalization_stability
    type: float
    bounds: [0.0, 1.0]
    description: >
      Stability of normalized structural residue.
  - name: boundary_stability
    type: float
    bounds: [0.0, 1.0]
    description: >
      Stability of the structural refinement envelope.

vector_fields:
  - name: structural_vector
    type: vector
    length: 3
    description: >
      Structural manifold coordinates after refinement.
  - name: punctuation_mask_vector
    type: vector
    length: 3
    description: >
      Refined punctuation/symbol mask coordinates.
  - name: anchor_vector
    type: vector
    length: 3
    description: >
      Canonicalized structural anchor coordinates.

envelope_status:
  admissible_status:
    - refinement_ready
    - degraded_structure
  terminal_status:
    - invalid_geometry
    - missing_vectors
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy SROB invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: missing_structural_vectors
    description: Required structural vectors are absent or invalid.
  - name: replay_inconsistency
    description: Replay produced non-identical refinement geometry.

routing:
  admissible_inputs:
    - SOB
  admissible_outputs:
    - constraint_extractor
    - downstream_structural_ob
  description: >
    SROB emits refined structural residue for constraint extraction and downstream OB
    layers. It does not route into semantic scoring, routing, or identity primitives.

dependencies:
  dictionaries:
    - structure_dictionary
    - runtime_dictionary
  reference_objects:
    - sob_reference
    - boundary_reference
    - structure_reference
  flow_contracts:
    - path_a_clean_flow
    - path_a_corrected_flow

psc_alignment:
  - SROB must satisfy PSC structure object requirements.
  - SROB must expose deterministic structural refinement geometry for replay validation.
  - SROB must align with SOB and constraint primitives.
  - SROB must enforce admissible structural refinement envelope constraints.
