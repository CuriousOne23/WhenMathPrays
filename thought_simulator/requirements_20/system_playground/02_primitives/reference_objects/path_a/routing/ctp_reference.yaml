reference_object_name: CTP
reference_object_class: routing
semantic_class: collect_consolidate_thought_point
version: 1.0.0

purpose:
  short: >
    Collects and consolidates all IdOB outputs from an IdOB-set into a single,
    stable IdOB-output packet for routing and scheduling.
  long: >
    CTP is the routing-class reference object that represents the consolidated
    IdOB-output packet described in 20.145_ctp.md. It gathers all IdOB₁…IdOBₙ
    outputs from an IdOB-set, normalizes them into a deterministic envelope, and
    exposes control flags and routing hints for RB-prm and TrSch-prm. CTP never
    writes TP or semantic_core; it is a pure consolidation and representation
    object used between IdOB-sets and routing/scheduling.

invariants:
  - name: idob_only_inputs
    description: >
      CTP may only consolidate outputs produced by IdOB-prm instances in the
      current IdOB-set; no other primitive may feed CTP.
  - name: no_tp_writes
    description: >
      CTP must never write to TP, semantic_core, SSR, or MTP; it is a pure
      consolidation reference object.
  - name: envelope_must_be_closed
    description: >
      The IdOB-output packet represented by CTP must be closed and complete
      before RB-prm or TrSch-prm consume it.
  - name: replay_determinism
    description: >
      Given identical IdOB-set outputs, CTP must produce an identical envelope
      and control flag set under replay.
  - name: control_flags_canonical
    description: >
      Control flags (continue, needs_correction, done, unstable, halt, retry)
      must be canonical and mutually consistent.
  - name: idob_set_identity_preserved
    description: >
      CTP must preserve IdOB identity and ordering metadata sufficient for audit
      and replay, even after consolidation.
  - name: admissible_source_only
    description: >
      CTP may only accept IdOB outputs produced in the current Path-A cycle;
      historical or Path-B artifacts are inadmissible.

geometry_signature:
  envelope_type: idob_output_packet_envelope
  shape: routing_consolidation_manifold
  dimensions:
    - name: idob_count_axis
      type: scalar
      bounds: [0, 64]
    - name: stability_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: conflict_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: correction_signal_axis
      type: scalar
      bounds: [0.0, 1.0]
    - name: routing_signal_axis
      type: scalar
      bounds: [0.0, 1.0]
  description: >
    CTP geometry encodes how many IdOBs contributed to the packet, how stable
    the consolidated meaning is, how much conflict remains, whether correction
    is signaled, and whether routing continuation is appropriate. RB-prm and
    TrSch-prm read this manifold to decide the next Path-A action.

scalar_fields:
  - name: idob_set_size
    type: int
    bounds: [0, 64]
    description: >
      Number of IdOB-prm instances whose outputs were consolidated into this
      packet.
  - name: stability_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Consolidated stability indicator over the IdOB-set (1.0 = fully stable).
  - name: conflict_level
    type: float
    bounds: [0.0, 1.0]
    description: >
      Consolidated conflict indicator over the IdOB-set (1.0 = maximal conflict).
  - name: correction_signal_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Strength of correction signals emitted by IdOBs (used by TrSch-prm to
      decide CE→TPU invocation).
  - name: routing_signal_strength
    type: float
    bounds: [0.0, 1.0]
    description: >
      Strength of routing continuation signals (used by RB-prm and TrSch-prm to
      decide further RB→RTU→IdOB cycles).

vector_fields:
  - name: idob_output_vector
    type: vector
    length: 4
    description: >
      Consolidated IdOB-output summary vector (e.g., stability, conflict,
      correction, routing) used by RB-prm for routing arbitration.
  - name: routing_hint_vector
    type: vector
    length: 3
    description: >
      Non-authoritative routing hints derived from IdOB outputs; RB-prm remains
      the sole routing arbiter.

control_flags:
  # These mirror the TrSch-prm description in 20.155_trsch_prm.md
  - name: continue
    type: boolean
    description: >
      Indicates that meaning is not yet stable and another RB→RTU→IdOB cycle
      should be scheduled.
  - name: needs_correction
    type: boolean
    description: >
      Indicates that CE→TPU correction should be scheduled before further
      Path-A refinement.
  - name: done
    type: boolean
    description: >
      Indicates that meaning is stable and OuBA commit should be scheduled.
  - name: unstable
    type: boolean
    description: >
      Indicates that meaning is unstable but not yet clearly corrective; may
      trigger additional refinement cycles.
  - name: halt
    type: boolean
    description: >
      Indicates that Path-A should halt under governance or safety conditions.
  - name: retry
    type: boolean
    description: >
      Indicates that the IdOB-set should be retried under revised routing or
      correction conditions.

envelope_status:
  admissible_status:
    - stable
    - degraded
    - refinement_ready
    - correction_ready
    - commit_ready
  terminal_status:
    - invalid_geometry
    - missing_idob_outputs
    - replay_violation

anomaly_flags:
  - name: geometry_violation
    description: Envelope geometry does not satisfy CTP invariants.
  - name: field_out_of_bounds
    description: One or more scalar/vector fields exceed allowed bounds.
  - name: replay_inconsistency
    description: Replay produced non-identical consolidation geometry.
  - name: inadmissible_source
    description: Envelope did not originate from the current IdOB-set.

routing:
  admissible_inputs:
    - IdOB
  admissible_outputs:
    - RB
    - TrSch
  description: >
    CTP consolidates IdOB-set outputs into a single packet consumed by RB-prm
    for routing arbitration and by TrSch-prm for turn-level scheduling decisions.

dependencies:
  dictionaries:
    - meaning_dictionary
    - runtime_dictionary
  reference_objects:
    - idob_reference
    - rb_reference
    - trsch_reference
    - routing_reference
    - semantic_reference
    - structure_reference
  flow_contracts:
    - path_a_ob_set_flow
    - path_a_turn_scheduler_flow

psc_alignment:
  - CTP must satisfy PSC routing object requirements for consolidation surfaces.
  - CTP must expose deterministic geometry for replay validation.
  - CTP must align with IdOB, RB-prm, and TrSch-prm primitives.
  - CTP must enforce admissible IdOB-set consolidation envelope constraints.
